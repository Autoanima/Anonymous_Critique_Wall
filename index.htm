<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名評圖牆</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#EEF0EC;
  --surface:#FFFFFF;
  --surface-2:#F7F8F5;
  --ink:#1F2421;
  --ink-soft:#5B615C;
  --line:#CBCFC6;
  --accent:#2C5F6F;
  --accent-strong:#204652;
  --accent-soft:#DCEAEB;
  --good:#3F7D4F;
  --warn:#B9860A;
  --low:#B4483B;
  --low-soft:#F5E1DE;
  --focus:#2C5F6F;
  --radius:10px;
  --shadow:0 1px 2px rgba(31,36,33,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --surface:#1C2224; --surface-2:#222A2C; --ink:#E9EBE6; --ink-soft:#A9AFA9;
    --line:#333B3A; --accent:#7FC2CF; --accent-strong:#9FD3DE; --accent-soft:#203238;
    --good:#6FBF7E; --warn:#E0B23D; --low:#E2796A; --low-soft:#3A2420; --focus:#7FC2CF;
    --shadow:0 1px 2px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --surface:#1C2224; --surface-2:#222A2C; --ink:#E9EBE6; --ink-soft:#A9AFA9;
  --line:#333B3A; --accent:#7FC2CF; --accent-strong:#9FD3DE; --accent-soft:#203238;
  --good:#6FBF7E; --warn:#E0B23D; --low:#E2796A; --low-soft:#3A2420; --focus:#7FC2CF;
  --shadow:0 1px 2px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html{color-scheme:light dark;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,textarea{font-family:inherit;}

.shell{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:0 40px;min-height:100vh;display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;background:var(--paper);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;z-index:5;border-bottom:1px solid var(--line);}
.brand{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;}
.brand-mark{color:var(--accent);font-size:1.3rem;}
.tabs{display:flex;gap:8px;}
.navbtn{flex:1;padding:10px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:0.85rem;font-weight:500;cursor:pointer;}
.navbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.navbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.content{padding-top:20px;display:flex;flex-direction:column;gap:16px;}
.screen-title{font-family:'Noto Serif TC',serif;font-size:1.4rem;margin:0;text-wrap:balance;}

.hero h1{font-family:'Noto Serif TC',serif;font-size:1.6rem;margin:0 0 6px;text-wrap:balance;}
.lede{color:var(--ink-soft);margin:0 0 4px;}
.stat-row{display:flex;gap:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.stat-num{display:block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--accent-strong);}
.stat-label{display:block;font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}
.cta-row{display:flex;gap:10px;margin:4px 0;}
.steps{margin:4px 0 0;padding-left:1.2em;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;font-size:0.9rem;}
.footer{margin-top:auto;padding-top:24px;text-align:center;}
.teacher-link{color:var(--ink-soft);font-size:0.8rem;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}

.btn{border:none;border-radius:999px;padding:12px 18px;font-size:0.95rem;font-weight:700;cursor:pointer;flex:1;}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-accent{background:var(--accent-soft);color:var(--accent-strong);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);padding:16px;box-shadow:var(--shadow);}
.form{display:flex;flex-direction:column;gap:12px;}
.field{display:flex;flex-direction:column;gap:6px;font-size:0.85rem;color:var(--ink-soft);}
.field input,.field textarea{font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.field input:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
.hint{font-size:0.8rem;color:var(--ink-soft);margin:0;}

.mine-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
.mine-list .code{font-family:'JetBrains Mono',monospace;background:var(--accent-soft);color:var(--accent-strong);padding:2px 8px;border-radius:6px;margin-right:8px;font-weight:700;}

.progress{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink-soft);margin:0;font-size:0.85rem;}
.work-card{display:flex;flex-direction:column;gap:12px;}
.work-code{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:0.05em;color:var(--accent-strong);background:var(--accent-soft);align-self:flex-start;padding:4px 10px;border-radius:6px;}
.preview-frame{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);}
.preview-frame iframe,.preview-frame img{width:100%;height:100%;border:0;object-fit:contain;background:var(--surface-2);}
.work-title{margin:0;font-style:italic;color:var(--ink-soft);}

.criterion{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line);}
.criterion:last-of-type{border-bottom:none;}
.crit-label{flex:1;min-width:140px;font-size:0.9rem;}
.score-dots{display:flex;gap:6px;}
.score-dot{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.score-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.score-dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.done-card{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;}
.big-check{font-size:1.1rem;font-weight:700;margin:0;}

.toast{border-radius:8px;padding:10px 14px;font-size:0.9rem;}
.toast-success{background:var(--accent-soft);color:var(--accent-strong);}
.toast-error{background:var(--low-soft);color:var(--low);}

.table-wrap{overflow-x:auto;padding:0;}
.grade-table{border-collapse:collapse;width:100%;font-size:0.85rem;min-width:620px;}
.grade-table th,.grade-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.grade-table thead th{position:sticky;top:0;background:var(--surface);font-weight:700;color:var(--ink-soft);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;}
.grade-table td.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;}
.grade-table td.mono{font-family:'JetBrains Mono',monospace;}
.grade-table td.strong{font-weight:700;color:var(--accent-strong);}
.grade-table tbody tr:first-child td{background:var(--accent-soft);}

.config-card summary{cursor:pointer;font-weight:700;padding:2px 0;}
.config-card .form{margin-top:12px;}
.config-card textarea{min-height:120px;resize:vertical;}
.setup-banner{background:var(--low-soft);color:var(--low);border-radius:8px;padding:12px 14px;font-size:0.85rem;}
.setup-banner code{background:rgba(0,0,0,0.08);padding:1px 5px;border-radius:4px;}

@media (max-width:400px){
  .cta-row{flex-direction:column;}
  .score-dot{width:34px;height:34px;font-size:0.85rem;}
}
</style>
</head>
<body>
<div id="app"><div class="shell"><main class="content"><p class="hint">載入中...</p></main></div></div>
<script>
(function(){
'use strict';

// ↓↓↓ 部署好 Google Apps Script 後，把網址貼在這裡（記得保留前後的引號） ↓↓↓
var API_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
// ↑↑↑ 例如 https://script.google.com/macros/s/AKfycb.../exec ↑↑↑

var TITLE = '匿名評圖牆';

function defaultConfig(){
  return {
    criteria: [
      {key:'appeal', label:'有沒有吸引力？'},
      {key:'likeness', label:'一眼知道是肖像嗎？'},
      {key:'composition', label:'構圖舒服嗎？'},
      {key:'color', label:'色彩有一致性嗎？'},
      {key:'originality', label:'有沒有自己的特色？'},
      {key:'completion', label:'整體設計完成度'}
    ],
    reviewsPerStudent: 5,
    teacherPasscode: 'crit-7k2m'
  };
}

var state = { config: defaultConfig(), submissions: [], reviews: [] };
var currentScores = {};
var loading = false;
var setupNeeded = API_URL.indexOf('PASTE_YOUR') !== -1;

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function safeUrl(u){
  u = String(u||'').trim();
  if(/^https?:\/\//i.test(u)) return u;
  return '';
}
function toEmbed(u){
  u = safeUrl(u);
  if(!u) return null;
  var m = u.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || u.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if(m) return { kind:'drive', src:'https://drive.google.com/file/d/'+m[1]+'/preview' };
  if(/\.(png|jpe?g|gif|webp|avif)(\?[^\s]*)?$/i.test(u)) return { kind:'image', src:u };
  return { kind:'link', src:u };
}
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function reviewCountFor(s, workId){
  var n=0; for(var i=0;i<s.reviews.length;i++) if(s.reviews[i].workId===workId) n++;
  return n;
}
function statsFor(s, workId){
  var subReviews = s.reviews.filter(function(r){ return r.workId===workId; });
  var perCrit = {};
  s.config.criteria.forEach(function(c){
    var sum=0, n=0;
    subReviews.forEach(function(r){ if(typeof r.scores[c.key]==='number'){ sum+=r.scores[c.key]; n++; } });
    perCrit[c.key] = n ? sum/n : null;
  });
  var overallSum=0, overallN=0;
  subReviews.forEach(function(r){
    var vals = s.config.criteria.map(function(c){ return r.scores[c.key]; }).filter(function(v){ return typeof v==='number'; });
    if(vals.length){ overallSum += vals.reduce(function(a,b){return a+b;},0)/vals.length; overallN++; }
  });
  return { count: subReviews.length, perCrit: perCrit, overall: overallN ? overallSum/overallN : null };
}
function candidatesFor(s, norm){
  var reviewed = {};
  s.reviews.forEach(function(r){ if(r.reviewerNorm===norm) reviewed[r.workId]=1; });
  return s.submissions.filter(function(x){ return x.studentNorm!==norm && !reviewed[x.id]; });
}
function pickNext(s, norm){
  var cand = candidatesFor(s, norm);
  if(!cand.length) return null;
  cand.forEach(function(c){ c._n = reviewCountFor(s, c.id); });
  for(var i=cand.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=cand[i]; cand[i]=cand[j]; cand[j]=t; }
  cand.sort(function(a,b){ return a._n-b._n; });
  return cand[0];
}

function getRole(){ return localStorage.getItem('crit.role') || 'home'; }
function setRole(r){ localStorage.setItem('crit.role', r); }
function getMyName(){ return localStorage.getItem('crit.myName') || ''; }
function setMyName(n){ localStorage.setItem('crit.myName', n); }
function isTeacherAuthed(){ return sessionStorage.getItem('crit.teacherAuthed')==='1'; }
function getExtraTarget(){ var v = sessionStorage.getItem('crit.extraTarget'); return v ? parseInt(v,10) : 0; }

var toastMsg = null;
function setToast(kind, text){ toastMsg = {kind:kind, text:text}; }
function popToast(){ var t = toastMsg; toastMsg = null; return t; }

function apiGet(){
  return fetch(API_URL, { method:'GET' }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function apiPost(action, payload){
  return fetch(API_URL, { method:'POST', body: JSON.stringify({ action:action, payload:payload }) }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}

function statTile(n, label){ return '<div class="stat"><span class="stat-num">'+n+'</span><span class="stat-label">'+escapeHtml(label)+'</span></div>'; }

function screenHome(){
  var subCount = state.submissions.length;
  var reviewCount = state.reviews.length;
  return (
    '<section class="hero">' +
      '<h1>匿名評圖牆</h1>' +
      '<p class="lede">具名交作品，匿名互評分數。老師指定的題目由同學打 1～5 分，全部完成後自動算出平均分數與排名。</p>' +
      '<div class="stat-row">' +
        statTile(subCount, '件作品') +
        statTile(reviewCount, '筆評分') +
        statTile(state.config.reviewsPerStudent, '每人需評幾件') +
      '</div>' +
      '<div class="cta-row">' +
        '<button class="btn btn-primary" data-nav="submit">交作品</button>' +
        '<button class="btn btn-accent" data-nav="review">我要評分</button>' +
      '</div>' +
      '<ol class="steps">' +
        '<li>用姓名或學號交出你的作品連結，系統會給你一個匿名編號。</li>' +
        '<li>接著幫忙評分：系統會隨機挑其他同學的作品給你評，不會評到自己的。</li>' +
        '<li>全班評完後，老師會看到總表跟排名。</li>' +
      '</ol>' +
    '</section>' +
    '<footer class="footer"><button class="teacher-link" data-nav="teacher">教師專區</button></footer>'
  );
}

function screenSubmit(){
  var name = getMyName();
  var mine = name ? state.submissions.filter(function(s){ return s.studentNorm===normName(name); }) : [];
  var listHtml = mine.length ? (
    '<div class="card"><h2 class="screen-title" style="font-size:1rem">你已經交過的作品</h2><ul class="mine-list">' +
      mine.map(function(s){ return '<li><span class="code">'+escapeHtml(s.workCode)+'</span>'+escapeHtml(s.title||'（未命名）')+'</li>'; }).join('') +
    '</ul></div>'
  ) : '';
  return (
    '<h1 class="screen-title">交作品</h1>' +
    listHtml +
    '<form id="submitForm" class="card form">' +
      '<label class="field"><span>姓名或學號</span><input required id="f_name" value="'+escapeAttr(name)+'" placeholder="例如：王小明 或 10502"></label>' +
      '<label class="field"><span>作品名稱（選填）</span><input id="f_title" placeholder="幫作品取個名字"></label>' +
      '<label class="field"><span>作品圖片連結</span><input required id="f_link" placeholder="https://drive.google.com/..."></label>' +
      '<p class="hint">Google Drive 連結記得把分享權限開成「知道連結的人皆可檢視」，同學才看得到圖片。</p>' +
      '<button type="submit" class="btn btn-primary" '+(loading?'disabled':'')+'>'+(loading?'送出中...':'送出作品')+'</button>' +
    '</form>'
  );
}

function previewHtml(embed){
  if(!embed) return '<p class="hint">（沒有提供有效的圖片連結）</p>';
  if(embed.kind==='drive') return '<div class="preview-frame"><iframe src="'+escapeAttr(embed.src)+'" loading="lazy"></iframe></div>';
  if(embed.kind==='image') return '<div class="preview-frame"><img src="'+escapeAttr(embed.src)+'" loading="lazy" alt="作品預覽"></div>';
  return '<p class="hint">這個連結沒辦法直接預覽，<a href="'+escapeAttr(embed.src)+'" target="_blank" rel="noopener">點此在新分頁開啟</a></p>';
}
function criterionRow(c){
  var dots = [1,2,3,4,5].map(function(n){
    return '<button type="button" class="score-dot" data-key="'+escapeAttr(c.key)+'" data-val="'+n+'">'+n+'</button>';
  }).join('');
  return '<div class="criterion"><span class="crit-label">'+escapeHtml(c.label)+'</span><div class="score-dots">'+dots+'</div></div>';
}

function screenReview(){
  var name = getMyName();
  if(!name){
    return (
      '<h1 class="screen-title">我要評分</h1>' +
      '<form id="nameForm" class="card form">' +
        '<label class="field"><span>先告訴我們你是誰</span><input required id="r_name" placeholder="姓名或學號，跟交作品時輸入的一樣"></label>' +
        '<p class="hint">這是為了不讓你評到自己的作品，不會顯示給其他同學看。</p>' +
        '<button type="submit" class="btn btn-accent">開始評分</button>' +
      '</form>'
    );
  }
  currentScores = {};
  var norm = normName(name);
  var myDone = state.reviews.filter(function(r){ return r.reviewerNorm===norm; }).length;
  var required = state.config.reviewsPerStudent;
  var goal = Math.max(required, getExtraTarget());
  if(myDone >= goal){
    var leftover = candidatesFor(state, norm).length;
    return (
      '<h1 class="screen-title">我要評分</h1>' +
      '<div class="card done-card">' +
        '<p class="big-check">已完成 '+myDone+' / '+required+' 件評分，謝謝你！</p>' +
        (leftover>0 ? '<button class="btn btn-accent" id="wantMore">還想再多評幾件</button>' : '<p class="hint">目前沒有其他作品可以評了。</p>') +
      '</div>'
    );
  }
  var work = pickNext(state, norm);
  if(!work){
    return '<h1 class="screen-title">我要評分</h1><div class="card"><p class="hint">目前還沒有其他同學的作品可以評分，晚點再回來看看。</p></div>';
  }
  var embed = toEmbed(work.driveLink);
  return (
    '<h1 class="screen-title">我要評分</h1>' +
    '<p class="progress">進度：'+myDone+' / '+required+'</p>' +
    '<div class="card work-card">' +
      '<div class="work-code">'+escapeHtml(work.workCode)+'</div>' +
      previewHtml(embed) +
      (work.title ? '<p class="work-title">「'+escapeHtml(work.title)+'」</p>' : '') +
      '<form id="scoreForm" class="score-form" data-work="'+escapeAttr(work.id)+'">' +
        state.config.criteria.map(criterionRow).join('') +
        '<button type="submit" class="btn btn-primary" id="scoreSubmit" disabled>'+(loading?'送出中...':'送出評分')+'</button>' +
      '</form>' +
    '</div>'
  );
}

function screenTeacher(){
  if(!isTeacherAuthed()){
    return '<h1 class="screen-title">教師專區</h1><div class="card"><p class="hint">請從首頁點「教師專區」並輸入密語進入。</p></div>';
  }
  var rows = state.submissions.map(function(s){ return { s:s, st: statsFor(state, s.id) }; });
  rows.sort(function(a,b){
    var av = a.st.overall==null ? -1 : a.st.overall;
    var bv = b.st.overall==null ? -1 : b.st.overall;
    return bv-av;
  });
  var head = state.config.criteria.map(function(c){ return '<th>'+escapeHtml(c.label)+'</th>'; }).join('');
  var tableRows = rows.map(function(r, i){
    var cells = state.config.criteria.map(function(c){
      var v = r.st.perCrit[c.key];
      return '<td class="num">'+(v==null?'—':v.toFixed(1))+'</td>';
    }).join('');
    return '<tr>' +
      '<td class="num">'+(i+1)+'</td>' +
      '<td class="mono">'+escapeHtml(r.s.workCode)+'</td>' +
      '<td>'+escapeHtml(r.s.studentName)+'</td>' +
      '<td>'+escapeHtml(r.s.title||'—')+'</td>' +
      cells +
      '<td class="num strong">'+(r.st.overall==null?'—':r.st.overall.toFixed(2))+'</td>' +
      '<td class="num">'+r.st.count+'</td>' +
    '</tr>';
  }).join('');
  var configHtml =
    '<details class="card config-card"><summary>教師設定</summary>' +
      '<form id="teacherConfigForm" class="form">' +
        '<label class="field"><span>每人需要評幾件作品</span><input type="number" min="1" max="50" id="cfg_n" value="'+state.config.reviewsPerStudent+'"></label>' +
        '<label class="field"><span>評分題目（每行一題）</span><textarea id="cfg_criteria">'+escapeHtml(state.config.criteria.map(function(c){ return c.label; }).join('\n'))+'</textarea></label>' +
        '<label class="field"><span>教師密語</span><input id="cfg_pass" value="'+escapeAttr(state.config.teacherPasscode)+'"></label>' +
        '<p class="hint">密語只是簡單防呆，不是真的加密，頁面原始碼看得到，請勿用來保護重要資料。建議在開放評分「前」就設定好題目，中途更改題目可能會讓已收到的分數對不上新題目。</p>' +
        '<button type="submit" class="btn btn-primary">儲存設定</button>' +
      '</form>' +
    '</details>';
  return (
    '<h1 class="screen-title">教師總表</h1>' +
    '<div class="stat-row">' +
      statTile(state.submissions.length, '件作品') +
      statTile(state.reviews.length, '筆評分') +
      statTile(rows.filter(function(r){ return r.st.count>0; }).length, '已有分數') +
    '</div>' +
    '<div class="cta-row">' +
      '<button class="btn btn-accent" id="refreshData">重新整理資料</button>' +
      '<button class="btn btn-accent" id="exportCsv">匯出 CSV</button>' +
    '</div>' +
    '<div class="table-wrap card"><table class="grade-table"><thead><tr>' +
      '<th>排名</th><th>編號</th><th>姓名</th><th>作品名稱</th>' + head + '<th>總平均</th><th>份數</th>' +
    '</tr></thead><tbody>' + (tableRows || '<tr><td colspan="99" class="hint">目前還沒有作品。</td></tr>') + '</tbody></table></div>' +
    configHtml
  );
}

function screenHtml(role){
  if(role==='submit') return screenSubmit();
  if(role==='review') return screenReview();
  if(role==='teacher') return screenTeacher();
  return screenHome();
}
function navHtml(role){
  function btn(r, label){ return '<button class="navbtn'+(role===r?' active':'')+'" data-nav="'+r+'">'+label+'</button>'; }
  return '<header class="topbar"><div class="brand"><span class="brand-mark">&#9686;</span>'+escapeHtml(TITLE)+'</div><nav class="tabs">'+btn('home','首頁')+btn('submit','交作品')+btn('review','我要評分')+'</nav></header>';
}

function render(){
  var role = getRole();
  var toast = popToast();
  var setupHtml = setupNeeded ?
    '<div class="setup-banner">這個頁面還沒設定好資料庫網址：請部署 Google Apps Script，把網址貼進 <code>index.html</code> 裡的 <code>API_URL</code>（目前還是預設的 <code>PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE</code>）。</div>' : '';
  var html =
    '<div class="shell">' +
      navHtml(role) +
      setupHtml +
      (toast ? '<div class="toast toast-'+escapeAttr(toast.kind)+'">'+escapeHtml(toast.text)+'</div>' : '') +
      '<main class="content">' + screenHtml(role) + '</main>' +
    '</div>';
  document.getElementById('app').innerHTML = html;
  attachHandlers();
}

function updateSubmitEnabled(form){
  if(!form) return;
  var btn = form.querySelector('#scoreSubmit');
  if(!btn) return;
  var complete = state.config.criteria.every(function(c){ return typeof currentScores[c.key]==='number'; });
  btn.disabled = !complete;
}

function handleSubmitWork(form){
  var name = form.querySelector('#f_name').value.trim();
  var title = form.querySelector('#f_title').value.trim();
  var link = form.querySelector('#f_link').value.trim();
  if(!name || !link) return;
  if(!safeUrl(link)){ alert('請貼上以 http:// 或 https:// 開頭的網址連結'); return; }
  setMyName(name);
  var payload = { id: uid('s_'), studentName:name, studentNorm:normName(name), title:title, driveLink:link, createdAt:Date.now() };
  loading = true; render();
  apiPost('addSubmission', payload).then(function(json){
    loading = false;
    state = json;
    var mine = json.submissions.filter(function(s){ return s.id===payload.id; })[0];
    setToast('success', mine ? ('已送出！你的作品編號是 '+mine.workCode+'，同學評分時只會看到這個編號。') : '已送出！');
    render();
  }).catch(function(e){
    loading = false;
    setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。');
    render();
  });
}
function handleSubmitScore(form){
  var workId = form.getAttribute('data-work');
  var complete = state.config.criteria.every(function(c){ return typeof currentScores[c.key]==='number'; });
  if(!complete) return;
  var norm = normName(getMyName());
  var payload = {
    id: workId + '__' + norm,
    workId: workId,
    reviewerNorm: norm,
    scores: JSON.parse(JSON.stringify(currentScores)),
    createdAt: Date.now()
  };
  currentScores = {};
  loading = true; render();
  apiPost('addReview', payload).then(function(json){
    loading = false;
    state = json;
    setToast('success', '評分已送出，謝謝！');
    render();
  }).catch(function(e){
    loading = false;
    setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。');
    render();
  });
}
function handleSaveConfig(form){
  var n = Math.max(1, Math.min(50, parseInt(form.querySelector('#cfg_n').value,10) || 1));
  var lines = form.querySelector('#cfg_criteria').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  if(!lines.length) lines = state.config.criteria.map(function(c){ return c.label; });
  var pass = form.querySelector('#cfg_pass').value.trim() || state.config.teacherPasscode;
  var newCriteria = lines.map(function(label, i){
    var existing = state.config.criteria[i];
    return { key: existing ? existing.key : 'c' + (i+1) + '_' + uid(''), label: label };
  });
  var payload = { criteria:newCriteria, reviewsPerStudent:n, teacherPasscode:pass };
  loading = true; render();
  apiPost('updateConfig', payload).then(function(json){
    loading = false;
    state = json;
    setToast('success', '設定已儲存');
    render();
  }).catch(function(e){
    loading = false;
    setToast('error', '儲存失敗（'+e.message+'），請檢查網路連線或稍後再試。');
    render();
  });
}
function csvCell(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function handleExportCsv(){
  var rows = state.submissions.map(function(s){ return { s:s, st: statsFor(state, s.id) }; });
  rows.sort(function(a,b){
    var av = a.st.overall==null ? -1 : a.st.overall;
    var bv = b.st.overall==null ? -1 : b.st.overall;
    return bv-av;
  });
  var header = ['排名','編號','姓名','作品名稱'].concat(state.config.criteria.map(function(c){ return c.label; })).concat(['總平均','份數']);
  var lines = [header.map(csvCell).join(',')];
  rows.forEach(function(r,i){
    var cells = [i+1, r.s.workCode, r.s.studentName, r.s.title||''].concat(
      state.config.criteria.map(function(c){ var v=r.st.perCrit[c.key]; return v==null?'':v.toFixed(2); })
    ).concat([r.st.overall==null?'':r.st.overall.toFixed(2), r.st.count]);
    lines.push(cells.map(csvCell).join(','));
  });
  var csv = '﻿' + lines.join('\r\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '評分總表.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function attachHandlers(){
  var root = document.getElementById('app');
  root.onclick = function(e){
    var navBtn = e.target.closest('[data-nav]');
    if(navBtn){
      var r = navBtn.getAttribute('data-nav');
      if(r==='teacher' && !isTeacherAuthed()){
        var pass = prompt('請輸入教師密語：');
        if(pass===null) return;
        if(pass !== state.config.teacherPasscode){ alert('密語不對喔'); return; }
        sessionStorage.setItem('crit.teacherAuthed','1');
      }
      setRole(r);
      render();
      return;
    }
    var dot = e.target.closest('.score-dot');
    if(dot){
      var key = dot.getAttribute('data-key');
      var val = parseInt(dot.getAttribute('data-val'),10);
      currentScores[key] = val;
      var row = dot.closest('.criterion');
      row.querySelectorAll('.score-dot').forEach(function(b){ b.classList.remove('active'); });
      dot.classList.add('active');
      updateSubmitEnabled(dot.closest('form'));
      return;
    }
    if(e.target.closest('#wantMore')){
      var norm2 = normName(getMyName());
      var done2 = state.reviews.filter(function(r){ return r.reviewerNorm===norm2; }).length;
      sessionStorage.setItem('crit.extraTarget', String(done2+5));
      render();
      return;
    }
    if(e.target.closest('#exportCsv')){ handleExportCsv(); return; }
    if(e.target.closest('#refreshData')){
      loading = true; render();
      apiGet().then(function(json){ loading=false; state=json; render(); })
        .catch(function(e){ loading=false; setToast('error','重新整理失敗：'+e.message); render(); });
      return;
    }
  };
  root.onsubmit = function(e){
    var form = e.target;
    if(form.id==='submitForm'){ e.preventDefault(); handleSubmitWork(form); }
    else if(form.id==='nameForm'){
      e.preventDefault();
      var v = form.querySelector('#r_name').value.trim();
      if(!v) return;
      setMyName(v);
      render();
    }
    else if(form.id==='scoreForm'){ e.preventDefault(); handleSubmitScore(form); }
    else if(form.id==='teacherConfigForm'){ e.preventDefault(); handleSaveConfig(form); }
  };
}

function init(){
  render();
  if(setupNeeded) return;
  apiGet().then(function(json){
    state = json;
    render();
  }).catch(function(e){
    setToast('error', '無法連上資料庫，請確認網路連線正常，或稍後再試。（'+e.message+'）');
    render();
  });
}
init();
})();
</script>
</body>
