<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名評圖牆</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#EEF0EC;
  --surface:#FFFFFF;
  --surface-2:#F7F8F5;
  --ink:#1F2421;
  --ink-soft:#5B615C;
  --line:#CBCFC6;
  --accent:#2C5F6F;
  --accent-strong:#204652;
  --accent-soft:#DCEAEB;
  --good:#3F7D4F;
  --warn:#B9860A;
  --low:#B4483B;
  --low-soft:#F5E1DE;
  --focus:#2C5F6F;
  --radius:10px;
  --shadow:0 1px 2px rgba(31,36,33,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --surface:#1C2224; --surface-2:#222A2C; --ink:#E9EBE6; --ink-soft:#A9AFA9;
    --line:#333B3A; --accent:#7FC2CF; --accent-strong:#9FD3DE; --accent-soft:#203238;
    --good:#6FBF7E; --warn:#E0B23D; --low:#E2796A; --low-soft:#3A2420; --focus:#7FC2CF;
    --shadow:0 1px 2px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --surface:#1C2224; --surface-2:#222A2C; --ink:#E9EBE6; --ink-soft:#A9AFA9;
  --line:#333B3A; --accent:#7FC2CF; --accent-strong:#9FD3DE; --accent-soft:#203238;
  --good:#6FBF7E; --warn:#E0B23D; --low:#E2796A; --low-soft:#3A2420; --focus:#7FC2CF;
  --shadow:0 1px 2px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html{color-scheme:light dark;scroll-behavior:smooth;}
[id^="section-"]{scroll-margin-top:112px;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,textarea{font-family:inherit;}

.shell{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:0 40px;min-height:100vh;display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;background:var(--paper);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;z-index:5;border-bottom:1px solid var(--line);}
.topbar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;}
.brand-mark{color:var(--accent);font-size:1.3rem;}
.identity-badge{background:none;border:none;color:var(--ink-soft);font-size:0.72rem;padding:2px 4px;cursor:pointer;white-space:nowrap;}
.tabs{display:flex;gap:8px;}
.navbtn{flex:1;padding:10px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:0.85rem;font-weight:500;cursor:pointer;}
.navbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.navbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.content{padding-top:20px;display:flex;flex-direction:column;gap:16px;}
.screen-title{font-family:'Noto Serif TC',serif;font-size:1.4rem;margin:0;text-wrap:balance;}

.hero h1{font-family:'Noto Serif TC',serif;font-size:1.6rem;margin:0 0 6px;text-wrap:balance;}
.lede{color:var(--ink-soft);margin:0 0 4px;}
.stat-row{display:flex;gap:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.stat-num{display:block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--accent-strong);}
.stat-label{display:block;font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}
.cta-row{display:flex;gap:10px;margin:4px 0;}
.steps{margin:4px 0 0;padding-left:1.2em;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;font-size:0.9rem;}
.footer{margin-top:auto;padding-top:24px;text-align:center;display:flex;gap:14px;justify-content:center;}
.footer-link{color:var(--ink-soft);font-size:0.8rem;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}

.btn{border:none;border-radius:999px;padding:12px 18px;font-size:0.95rem;font-weight:700;cursor:pointer;flex:1;}
a.btn{text-decoration:none;text-align:center;display:inline-block;}
a.navbtn{text-decoration:none;text-align:center;display:inline-block;}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-accent{background:var(--accent-soft);color:var(--accent-strong);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);padding:16px;box-shadow:var(--shadow);}
.form{display:flex;flex-direction:column;gap:12px;}
.field{display:flex;flex-direction:column;gap:6px;font-size:0.85rem;color:var(--ink-soft);}
.field input,.field textarea,.field select{width:100%;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.assignment-pick{display:flex;flex-direction:column;gap:8px;}
.field input:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
.hint{font-size:0.8rem;color:var(--ink-soft);margin:0;}

.upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;background:var(--surface-2);}
.upload-box input[type=file]{display:block;margin:0 auto;max-width:100%;}
.upload-preview{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--surface);}
.upload-preview img{display:block;width:100%;max-height:220px;object-fit:contain;}
.or-sep{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:0.75rem;}
.or-sep::before,.or-sep::after{content:'';flex:1;height:1px;background:var(--line);}

.mine-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
.mine-list .code{font-family:'JetBrains Mono',monospace;background:var(--accent-soft);color:var(--accent-strong);padding:2px 8px;border-radius:6px;margin-right:8px;font-weight:700;}
.mine-item{display:flex;align-items:center;gap:10px;}
.mine-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);flex-shrink:0;}
.mine-thumb-empty{display:inline-block;}
.thumb-zoomable{cursor:zoom-in;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(10,12,11,0.92);z-index:65;display:flex;align-items:center;justify-content:center;padding:24px;}
.lightbox-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:2rem;line-height:1;cursor:pointer;padding:4px 10px;}
.mine-info{flex:1;min-width:0;}
.mine-del{border:1px solid var(--low);background:none;color:var(--low);border-radius:999px;padding:6px 12px;font-size:0.8rem;font-weight:700;cursor:pointer;flex-shrink:0;}
.mine-item-clickable{cursor:pointer;border-radius:8px;padding:6px;margin:-6px;}
.mine-item-clickable:hover{background:var(--surface-2);}
.mine-item-active{background:var(--accent-soft);}
.mine-item-detail{padding-left:12px;}

.progress{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink-soft);margin:0;font-size:0.85rem;}
.work-card{display:flex;flex-direction:column;gap:12px;}
.work-code{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:0.05em;color:var(--accent-strong);background:var(--accent-soft);align-self:flex-start;padding:4px 10px;border-radius:6px;}
.preview-frame{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);}
.preview-frame iframe,.preview-frame img{width:100%;height:100%;border:0;object-fit:contain;background:var(--surface-2);}
.work-title{margin:0;font-style:italic;color:var(--ink-soft);}

.criterion{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line);}
.criterion:last-of-type{border-bottom:none;}
.crit-label{flex:1;min-width:140px;font-size:0.9rem;}
.score-dots{display:flex;gap:6px;}
.score-dot{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.score-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.score-dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.done-card{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;}
.big-check{font-size:1.1rem;font-weight:700;margin:0;}

.toast{border-radius:8px;padding:10px 14px;font-size:0.9rem;}
.toast-success{background:var(--accent-soft);color:var(--accent-strong);}
.toast-error{background:var(--low-soft);color:var(--low);}

.table-wrap{overflow-x:auto;padding:0;}
.grade-table{border-collapse:collapse;width:100%;font-size:0.85rem;min-width:620px;}
.grade-table th,.grade-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.grade-table thead th{position:sticky;top:0;background:var(--surface);font-weight:700;color:var(--ink-soft);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;}
.grade-table td.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;}
.grade-table td.mono{font-family:'JetBrains Mono',monospace;}
.grade-table td.strong{font-weight:700;color:var(--accent-strong);}
.grade-table tbody tr:first-child td{background:var(--accent-soft);}

.config-card summary{cursor:pointer;font-weight:700;padding:2px 0;}
.config-card .form{margin-top:12px;}
.config-card textarea{min-height:120px;resize:vertical;}
.setup-banner{background:var(--low-soft);color:var(--low);border-radius:8px;padding:12px 14px;font-size:0.85rem;}
.setup-banner code{background:rgba(0,0,0,0.08);padding:1px 5px;border-radius:4px;word-break:break-all;}
.readonly-field{font-family:'JetBrains Mono',monospace;font-size:0.8rem;word-break:break-all;}
.divider{border:none;border-top:1px solid var(--line);margin:4px 0;}

.gallery-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
.gallery-controls #startSlideshow{flex:0 0 auto;white-space:nowrap;}
.gallery-controls .field{flex:1 1 160px;}
.gallery-controls select{width:100%;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.gallery-toggles{display:flex;flex-direction:column;gap:6px;font-size:0.85rem;}
.toggle-row{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-soft);}
.toggle-row input{width:16px;height:16px;}
.gallery-grid{column-count:2;column-gap:12px;}
.gallery-card{break-inside:avoid;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-left-style:solid;border-radius:calc(var(--radius) + 2px);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
.gallery-img{width:100%;background:var(--surface-2);}
.gallery-img img{width:100%;display:block;}
.gallery-img iframe{width:100%;height:200px;border:0;display:block;}
.gallery-meta{padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:0.78rem;}
.gallery-name{color:var(--ink-soft);}
.gallery-score{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:1px 6px;border-radius:6px;}
.gallery-assignment-chip{color:#fff;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;}
@media (min-width:600px){ .gallery-grid{column-count:3;} }

.slideshow-overlay{position:fixed;inset:0;background:rgba(10,12,11,0.96);z-index:50;--slide-scale:1;}
.slide-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:2rem;line-height:1;cursor:pointer;padding:4px 10px;z-index:3;}
.slide-body{position:absolute;top:10px;left:10px;right:10px;bottom:10px;display:flex;gap:16px;align-items:stretch;min-height:0;}
.slide-stage{flex:3;min-width:0;display:flex;align-items:center;justify-content:center;}
.slide-stage img{width:100%;height:100%;border-radius:6px;object-fit:contain;}
.slide-stage iframe{width:100%;height:100%;border:0;border-radius:6px;background:#fff;}
.slide-radar{flex:1;min-width:220px;max-width:380px;display:flex;align-items:center;justify-content:center;}
/* 所有資訊、控制項都用絕對定位疊在畫面上，不佔版面空間，讓作品圖片盡量放到最大。 */
.slide-meta-overlay{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:calc(6px * var(--slide-scale));z-index:2;pointer-events:none;}
.slide-meta{color:#fff;display:flex;gap:calc(8px * var(--slide-scale));align-items:center;font-size:calc(1.8rem * var(--slide-scale));flex-wrap:wrap;justify-content:flex-end;}
.slide-meta .code{font-family:'JetBrains Mono',monospace;background:var(--accent-soft);color:var(--accent-strong);padding:0.15em 0.6em;border-radius:0.4em;font-weight:700;}
.slide-meta .gallery-score{font-size:1em;padding:0.15em 0.6em;}
.slide-pos{color:rgba(255,255,255,0.7);font-family:'JetBrains Mono',monospace;font-size:calc(1.3rem * var(--slide-scale));}
.slide-font-controls{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;}
.slide-font-controls .btn{flex:none;width:48px;padding:10px 0;}
.slide-controls-bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;z-index:2;}
/* 窄螢幕（手機）用固定字級疊層位置，避免投影用的放大字級在小螢幕上互相重疊。 */
@media (max-width:800px){
  .slide-body{flex-direction:column;}
  .slide-stage{flex:1.3;}
  .slide-radar{flex:1;min-width:0;max-height:34vh;}
  .slide-font-controls{left:8px;top:8px;bottom:auto;transform:none;flex-direction:row;}
  .slide-font-controls .btn{width:38px;padding:6px 0;}
  .slide-meta-overlay{right:8px;bottom:64px;}
  .slide-meta{font-size:1.05rem;gap:6px;}
  .slide-pos{font-size:0.8rem;}
  .slide-controls-bottom{bottom:8px;}
}

.equip-current{text-align:center;}
.equip-turn-label{margin:6px 0 2px;color:var(--ink-soft);font-size:0.85rem;}
.equip-turn-name{font-family:'Noto Serif TC',serif;font-size:1.4rem;font-weight:700;margin:0 0 8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.equip-timer{font-family:'JetBrains Mono',monospace;font-size:2.6rem;font-weight:700;color:var(--accent-strong);margin:6px 0;font-variant-numeric:tabular-nums;}
.equip-swatch{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,0.15);flex-shrink:0;}
.equip-order-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
.equip-order-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;}
.equip-order-list li.equip-active{background:var(--accent-soft);font-weight:700;}
.equip-order-edit{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.equip-order-edit-row{display:flex;align-items:center;gap:8px;font-size:0.9rem;}
.equip-order-edit-row select{margin-left:auto;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
.equip-absent{opacity:0.5;text-decoration:line-through;}
.rotation-track{position:relative;display:flex;height:64px;border-radius:10px;overflow:hidden;margin-top:12px;}
.rotation-segment{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;min-width:0;color:#fff;font-weight:700;position:relative;opacity:0.7;}
.rotation-segment.rotation-seg-active{opacity:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,0.85);}
.rotation-segment+.rotation-segment{border-left:1px solid rgba(255,255,255,0.35);}
.rotation-seat{white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:1.15rem;}
.rotation-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px;font-size:0.75rem;font-weight:500;}
.rotation-playhead{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,0.6);transform:translateX(-50%);border-radius:2px;}
.float-pause-btn{position:fixed;right:16px;bottom:16px;z-index:60;padding:12px 18px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,0.35);cursor:pointer;font-size:0.9rem;}
.equip-mini{padding-top:2px;}
.equip-mini-label{font-size:0.72rem;color:var(--ink-soft);margin-bottom:4px;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rotation-track-compact{height:48px;border-radius:6px;margin-top:0;}
.rotation-track-compact .rotation-seat{font-size:0.95rem;}
.rotation-track-compact .rotation-name{font-size:0.62rem;}

@media (max-width:400px){
  .cta-row{flex-direction:column;}
  .score-dot{width:34px;height:34px;font-size:0.85rem;}
}
</style>
</head>
<body>
<div id="app"><div class="shell"><main class="content"><p class="hint">載入中...</p></main></div></div>
<iframe name="uploadTarget" id="uploadTarget" style="display:none" aria-hidden="true" title="上傳處理（不會顯示內容）"></iframe>
<script>
(function(){
'use strict';

var TITLE = '匿名評圖牆';
var MAX_ORIGINAL_BYTES = 15 * 1024 * 1024; // 15MB 原始檔案上限
var RESIZE_MAX_DIM = 1600;
var RESIZE_QUALITY = 0.82;
// 「快速切換身分」預設帶兩組、每組三人，方便老師一個人測試分組相關的功能（例如器材輪值）；
// 這份清單跟開關都只存在老師自己這台裝置的 localStorage，不會同步到學生看到的資料庫。
var DEFAULT_QUICK_IDENTITY_TEXT = '第一組\n01 陳大文\n02 林小華\n03 黃美玲\n\n第二組\n04 張志豪\n05 吳佳蓉\n06 劉建宏';

// ---------- API 連線位址（不用改原始碼，改在「連接設定」畫面貼上即可） ----------
function getApiUrl(){
  try{
    var params = new URLSearchParams(location.search);
    var fromQuery = params.get('api');
    if(fromQuery){
      localStorage.setItem('crit.apiUrl', fromQuery);
      history.replaceState({}, '', location.pathname);
    }
  }catch(e){}
  return localStorage.getItem('crit.apiUrl') || '';
}
function setApiUrl(u){ localStorage.setItem('crit.apiUrl', u); apiUrl = u; }

var apiUrl = getApiUrl();
var homeStats = null;
var mySubs = null;
var reviewView = null;
var teacherView = null;
var loading = false;
var currentScores = {};
var pendingImage = null; // { dataUrl, base64, mime }
var submitTargetAssignment = null; // 點了「作業繳交狀況」裡哪一個項目，交作品的表單才會在底下展開
var galleryData = null; // { rows, criteria, assignments }
var gallerySort = 'overall';
var galleryShowNames = false;
var galleryShowScores = false;
var galleryNamesTouched = false; // 使用者有沒有自己手動點過「顯示姓名」——沒點過的話，只要老師開放了就預設直接顯示
var galleryScoresTouched = false; // 同上，對應「顯示分數」
var galleryAssignment = null; // null = 還沒選，選過之後固定成某個作業名稱或 '' (全部)
var lightboxSrc = null; // 點小縮圖放大看清楚用的，跟播放展示的全螢幕輪播是分開的功能
var slideshowIndex = null;
var slideshowPlaying = true;
var slideshowTimer = null;
var identityEditing = false;
var assignmentsList = []; // 從 home/gallery/teacherFetch 回應同步過來
var reviewAssignment = null; // null = 還沒選要評哪個作業
var teacherAssignmentFilter = '';
var galleryViewMode = 'grid'; // 'grid' | 'table'
var equipmentData = null; // { roster, leader, order, perPersonMinutes, currentIndex, turnStartedAt, running }
var equipmentTickTimer = null;
var equipmentPollTimer = null;
// 這組順序跟色號是照老師提供的參考圖由左到右排的（共 8 種顏色，比原本的 7 色多一個），
// 從照片沒辦法百分之百還原色號，是盡量挑接近的顏色，如果哪個顏色看起來不夠準，
// 之後可以再單獨微調。這裡改了名字或順序，記得 Code.gs 的 RAINBOW 陣列也要跟著改，
// 兩邊的顏色名稱要完全對得上，不然舊資料存的名稱在這裡會找不到對應的色號。
var RAINBOW_ORDER = ['金黃','橄欖','藍綠','靛藍','紫','綠','藍','粉'];
var RAINBOW_COLORS = {'金黃':'#C9A227','橄欖':'#A67C3D','藍綠':'#3D9B8F','靛藍':'#3D6B7D','紫':'#6B4FA0','綠':'#4C8C4A','藍':'#3E6FB5','粉':'#B85C7C'};

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }
/** 時間軸色塊裡的座號故意去掉補零的前導 0（例如「02」顯示成「2」），
 * 因為等寬字體的「0」在小色塊裡縮小後很容易看成「8」。 */
function stripLeadingZero(seat){ return String(seat==null?'':seat).replace(/^0+(?=\d)/, ''); }
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function normSeat(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,''); }
// 作業名稱要正規化過再比較，理由跟後端 Code.gs 裡的 normAssignment 一樣：
// Google 試算表會把 "01" 這種看起來像數字的文字自動存成數字 1，兩邊格式對不起來
// 的話，作業繳交狀況、作品牆篩選、教師總表篩選全部都會找不到對應的資料。
function normAssignment(a){ var s = String(a==null?'':a).trim(); if(s!=='' && !isNaN(Number(s))) return String(Number(s)); return s; }
/** 判斷某份作業目前有沒有開放姓名，邏輯跟後端 Code.gs 的 isNamesRevealedFor 一致（含舊版設定相容）。 */
function isNamesRevealedFor(cfg, a){
  var map = cfg.namesRevealedByAssignment;
  if(map && typeof map==='object'){
    var target = normAssignment(a);
    for(var k in map){ if(map.hasOwnProperty(k) && normAssignment(k)===target) return !!map[k]; }
    return false;
  }
  return !!cfg.namesRevealed;
}
function safeUrl(u){
  u = String(u||'').trim();
  if(/^https?:\/\//i.test(u)) return u;
  return '';
}
function toEmbed(u){
  u = safeUrl(u);
  if(!u) return null;
  if(/\/thumbnail\?/i.test(u) || /[?&]export=view/i.test(u) || /\.(png|jpe?g|gif|webp|avif)(\?[^\s]*)?$/i.test(u)) return { kind:'image', src:u };
  var m = u.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || u.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if(m) return { kind:'drive', src:'https://drive.google.com/file/d/'+m[1]+'/preview' };
  return { kind:'link', src:u };
}
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

 * 跟座號姓名分開存的一組隨機代碼，交作品時偷偷夾帶送出，畫面上完全不會顯示、
 * 學生也看不到。跟座號姓名不一樣，這組代碼不會因為修改身分而跟著變，換了

 * 共用設備上本來就會有好幾個人共用同一組代碼，換一台裝置或清瀏覽器資料
 * 也能讓代碼重新產生，不是完全防不了的機制。
 */

// 注意：讀取跟一般寫入動作都刻意用 GET 呼叫（把資料放進網址參數）。
// 瀏覽器對 Google Apps Script 的 POST 有已知的重新導向/跨網域問題，
// 會讓 fetch() 出現「Failed to fetch」，改用 GET 就不會遇到。
function apiGet(action, payload){
  var qs = 'action=' + encodeURIComponent(action || 'home');
  if(payload) qs += '&payload=' + encodeURIComponent(JSON.stringify(payload));
  return fetch(apiUrl + '?' + qs, { method:'GET' }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(json){
    if(json && Array.isArray(json.assignments) && json.assignments.length) assignmentsList = json.assignments;
    return json;
  });
}
// 只用在「上傳圖片」：資料量太大塞不進網址，用 fetch 的 no-cors POST
// 在 Apps Script 的重新導向機制上會整個卡住，改用最老牌的做法——
// 用一個隱藏表單直接送出到隱藏的 iframe，這跟直接在網址列打開網址
// 一樣不受跨網域限制，缺點是讀不到回應內容。不等 iframe 的 load
// 事件（那個訊號不準，常常要等很久甚至不觸發），送出後就馬上開始
// 用 apiGet 輪詢確認資料有沒有真的存進去，靠輪詢的重試機制來處理時間差。
function postFormNoRead(action, payload){
  var form = document.createElement('form');
  form.method = 'POST';
  form.action = apiUrl;
  form.target = 'uploadTarget';
  form.style.display = 'none';
  function addField(name, value){
    var inp = document.createElement('input');
    inp.type = 'hidden'; inp.name = name; inp.value = value;
    form.appendChild(inp);
  }
  addField('action', action);
  addField('payload', JSON.stringify(payload));
  document.body.appendChild(form);
  form.submit();
  setTimeout(function(){ if(form.parentNode) form.parentNode.removeChild(form); }, 1000);
}

// ---------- 圖片壓縮（避免整張原始照片直接傳給 Apps Script）----------
function resizeImageFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, RESIZE_MAX_DIM / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl = canvas.toDataURL('image/jpeg', RESIZE_QUALITY);
        resolve(dataUrl);
      };
      img.onerror = function(){ reject(new Error('圖片讀取失敗')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('檔案讀取失敗')); };
    reader.readAsDataURL(file);
  });
}

function assignmentSelectHtml(id, includeAll, selected){
  var opts = (includeAll ? '<option value="">全部作業</option>' : '') +
    assignmentsList.map(function(a){
      var isSelected = selected!=null && normAssignment(a)===normAssignment(selected);
      return '<option value="'+escapeAttr(a)+'"'+(isSelected?' selected':'')+'>'+escapeHtml(a)+'</option>';
    }).join('');
  return '<select id="'+id+'">'+opts+'</select>';
}

function checklistHtml(){
  if(mySubs === null) return '';
  var byAssignment = {};
  mySubs.forEach(function(s){ var a = normAssignment(s.assignment); (byAssignment[a] = byAssignment[a] || []).push(s); });
  var rows = (assignmentsList.length ? assignmentsList : ['']).map(function(a){
    var subsForA = byAssignment[normAssignment(a)] || [];
    var isOpen = submitTargetAssignment!=null && normAssignment(submitTargetAssignment)===normAssignment(a);
    var summaryThumb, summaryStatus;
    if(subsForA.length){
      var firstEmbed = toEmbed(subsForA[0].driveLink);
      summaryThumb = firstEmbed && firstEmbed.kind==='image' ? '<img class="mine-thumb" src="'+escapeAttr(firstEmbed.src)+'" alt="">' : '<span class="mine-thumb mine-thumb-empty"></span>';
      summaryStatus = '<span class="code">已交 '+subsForA.length+' 件</span>（點這裡可以再交一件）';
    } else {
      summaryThumb = '<span class="mine-thumb mine-thumb-empty"></span>';
      summaryStatus = '<span class="hint">尚未交（點這裡繳交）</span>';
    }
    // 縮圖、作業名稱、已交/未交狀態這一整排都可以點，點下去會在下面展開交作品的表單，
    // 預設會帶入這個作業，但表單裡還是可以改選別的作業。
    var summaryRow = '<li class="mine-item mine-item-clickable'+(isOpen?' mine-item-active':'')+'" data-open-assignment="'+escapeAttr(a)+'">' + summaryThumb +
      '<span class="mine-info">'+escapeHtml(a||'（未分類）')+'：'+summaryStatus+'</span>' +
    '</li>';
    var detailRows = subsForA.map(function(s){
      var embed = toEmbed(s.driveLink);
      var thumb = embed && embed.kind==='image' ? '<img class="mine-thumb thumb-zoomable" data-full="'+escapeAttr(embed.src)+'" src="'+escapeAttr(embed.src)+'" alt="">' : '<span class="mine-thumb mine-thumb-empty"></span>';
      return '<li class="mine-item mine-item-detail">' + thumb +
        '<span class="mine-info">'+escapeHtml(s.title||'')+'</span>' +
        '<button type="button" class="mine-del" data-del="'+escapeAttr(s.id)+'">刪除</button>' +
      '</li>';
    }).join('');
    return summaryRow + detailRows;
  }).join('');
  return (
    '<div class="card"><h2 class="screen-title" style="font-size:1rem">作業繳交狀況</h2><ul class="mine-list">'+rows+'</ul>' +
    (mySubs.length ? '<button type="button" class="btn btn-accent" id="downloadBundle" style="width:100%;margin-top:10px" '+(loading?'disabled':'')+'>打包下載我的所有作品</button>' : '') +
    '</div>'
  );
}

function sortedGalleryRows(){
  if(!galleryData) return [];
  var key = gallerySort;
  function val(r){ return key==='overall' ? r.overall : r.perCrit[key]; }
  var rows = galleryData.rows.slice();
  if(galleryAssignment) rows = rows.filter(function(r){ return normAssignment(r.assignment)===normAssignment(galleryAssignment); });
  rows.sort(function(a,b){
    var av = val(a), bv = val(b);
    av = av==null ? -1 : av; bv = bv==null ? -1 : bv;
    return bv - av;
  });
  return rows;
}
/** 依作業在清單裡的位置，從器材輪值那組 8 色色盤挑一個固定顏色，讓同一份作業在整個作品牆裡顏色都一樣。 */
function assignmentColorFor(assignments, a){
  // 一定要用 normAssignment 比對，不能直接 indexOf——作業名稱如果是「01」這種
  // 看起來像數字的文字，試算表會把它存成數字 1，直接比對永遠對不起來，
  // 結果每一列都會落到「找不到、預設用第一色」，變成畫面上全部作品都同一個顏色
  // （跟之前作業繳交狀況、輪值順序踩到的是同一種問題）。
  var target = normAssignment(a);
  var idx = -1;
  (assignments||[]).forEach(function(x, i){ if(idx<0 && normAssignment(x)===target) idx = i; });
  if(idx < 0) idx = 0;
  var name = RAINBOW_ORDER[idx % RAINBOW_ORDER.length];
  return RAINBOW_COLORS[name];
}
/**
 * 投影時用的雷達圖，一題一軸，SVG 畫的，字體大小跟著 slideFontScale 一起放大，
 * 確保坐最後一排的人也看得清楚。分數用滿分 5 分當作最外圈。
 */
function radarChartSvg(criteria, perCrit, size, fontScale){
  var n = criteria.length;
  if(!n) return '';
  var cx = size/2, cy = size/2, r = size*0.34, maxVal = 5;
  function pointFor(i, val){
    var angle = (Math.PI*2*i/n) - Math.PI/2;
    var rad = r * (Math.max(0,val)/maxVal);
    return [cx + rad*Math.cos(angle), cy + rad*Math.sin(angle)];
  }
  var rings = [1,2,3,4,5].map(function(level){
    var pts = criteria.map(function(c,i){ return pointFor(i, level).join(','); }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>';
  }).join('');
  var axes = criteria.map(function(c,i){
    var p = pointFor(i, maxVal);
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>';
  }).join('');
  var dataPts = criteria.map(function(c,i){ return pointFor(i, perCrit[c.key]==null?0:perCrit[c.key]).join(','); }).join(' ');
  var dots = criteria.map(function(c,i){
    if(perCrit[c.key]==null) return '';
    var p = pointFor(i, perCrit[c.key]);
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(4*fontScale)+'" fill="#7FC2CF"/>';
  }).join('');
  var labelR = r * 1.3;
  var labels = criteria.map(function(c,i){
    var angle = (Math.PI*2*i/n) - Math.PI/2;
    var lx = cx + labelR*Math.cos(angle), ly = cy + labelR*Math.sin(angle);
    var cosA = Math.cos(angle);
    var anchor = Math.abs(cosA)<0.3 ? 'middle' : (cosA>0?'start':'end');
    return '<text x="'+lx+'" y="'+ly+'" fill="#fff" font-size="'+(size*0.05*fontScale)+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+escapeHtml(c.label)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="100%">' +
    rings + axes +
    '<polygon points="'+dataPts+'" fill="rgba(127,194,207,0.35)" stroke="#7FC2CF" stroke-width="'+(2.5*fontScale)+'"/>' +
    dots + labels +
  '</svg>';
}

}

/**
 * 缺席的人不能真的「消失」在點名系統裡（回來還要能點名回來），但今天輪值時
 * 就是要整個跳過他，讓輪值只在「今天有出席」的人之間轉，不要空等一個沒來的人。
 * 這裡只過濾要拿去算「現在輪到誰」的順序，group.order 本身、器材輪值管理裡
 * 顏色指定的編輯畫面都還是照全部組員顯示，缺席只是暫時不讓他排進今天的轉圈。
 */
function presentOrderFor(group){
  var presentBySeat = {};
  (group.members||[]).forEach(function(m){ presentBySeat[normSeat(m.seat)] = m.present !== false; });
  return (group.order||[]).filter(function(p){
    var v = presentBySeat[normSeat(p.seat)];
    return v !== false; // 找不到組員資料時保守當作有出席，避免資料沒同步時整組憑空消失
  });
}
/** 組長不再是另外抽的，就是今天出席、輪值順序排第一位的那個人。 */
function leaderSeatFor(group){
  var order = presentOrderFor(group || {});
  return order.length ? order[0].seat : null;
}
/**
 * 從全班共用的時間軸，算出某一組現在輪到第幾個人、進度多少、還剩多少時間
 * （只算今天有出席的人）。故意不用單純的 % 讓它無限繞圈——排到最後一個人
 * 用完就結束，不會自動跳回第一個人重新開始，跟現實中「輪完一輪就結束」
 * 的用法一致，需要再跑一輪的話由老師自己按「重新排定順序」重新開始。
 */
function equipGroupState(eq, group){
  var order = presentOrderFor(group || {});
  var n = order.length;
  if(!n || !eq.startedAt) return { active:false, order:order };
  var perMs = eq.perPersonMinutes*60000;
  var now = eq.pausedAt ? eq.pausedAt : Date.now();
  var elapsed = Math.max(0, now - eq.startedAt - (eq.pausedTotalMs||0));
  var cycleMs = perMs*n;
  if(elapsed >= cycleMs){
    return {
      active:true, done:true, order:order,
      currentIndex: n-1, progress:1, remainingMs:0,
      paused: !!eq.pausedAt
    };
  }
  var currentIndex = Math.floor(elapsed/perMs);
  return {
    active:true, done:false,
    order:order,
    currentIndex: currentIndex,
    progress: elapsed/cycleMs,
    remainingMs: perMs - (elapsed % perMs),
    paused: !!eq.pausedAt
  };
}
function timelineHtml(state, compact){
  var order = state.order||[];
  if(!order.length) return '';
  var segs = order.map(function(p,i){
    return '<div class="rotation-segment'+(state.active && i===state.currentIndex?' rotation-seg-active':'')+'" style="background:'+RAINBOW_COLORS[p.color]+'">' +
      '<span class="rotation-seat">'+escapeHtml(stripLeadingZero(p.seat))+'號</span>' +
      '<span class="rotation-name">'+escapeHtml(p.name)+'</span>' +
    '</div>';
  }).join('');
  var playhead = state.active ? '<div class="rotation-playhead" style="left:'+(state.progress*100)+'%"></div>' : '';
  return '<div class="rotation-track'+(compact?' rotation-track-compact':'')+'">'+segs+playhead+'</div>';
}

function findMyGroup(eq){

function parseGroupsText(text){
  var blocks = text.split(/\n\s*\n/).map(function(b){ return b.trim(); }).filter(Boolean);
  return blocks.map(function(block){
    var lines = block.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    var name = lines[0] || '未命名分組';
    var members = lines.slice(1).map(function(l){
      var m = l.match(/^(\S+)\s+(.+)$/);
      if(m) return { seat: m[1], name: m[2] };
      return { seat: '', name: l };
    }).filter(function(m){ return m.name; });
    return { name: name, members: members };
  });
}

function loadHome(){
  if(!apiUrl){ homeStats=null; render(); return; }
  homeStats = null; render();
  apiGet('home').then(function(json){ homeStats = json; render(); })
    .catch(function(e){ setToast('error','無法連上資料庫：'+e.message); render(); });
}
function loadMySubs(){
  if(!hasIdentity() || !apiUrl){ mySubs = []; render(); return; }
  mySubs = null; render();
  apiGet('getMySubmissions', { studentNorm: identityNorm() }).then(function(res){
    mySubs = res.submissions || []; render();
  }).catch(function(e){ mySubs = []; setToast('error','載入失敗：'+e.message); render(); });
}
function loadReviewView(){
  if(!hasIdentity() || !apiUrl || !reviewAssignment) { render(); return; }
  reviewView = null; render();
  apiGet('getNextWork', { reviewerNorm: identityNorm(), assignment: reviewAssignment, extraTarget: getExtraTarget() }).then(function(res){
    reviewView = res; render();
  }).catch(function(e){ setToast('error','載入失敗：'+e.message); render(); });
}
function loadTeacherView(){
  if(!apiUrl){ setToast('error','請先到「連接設定」貼上資料庫網址。'); setRole('connect'); render(); return; }
  var pass = teacherAuthPasscode();
  if(!pass){
    var input = prompt('請輸入教師密語：');
    if(input===null){ setRole('home'); render(); return; }
    pass = input;
    setTeacherAuthPasscode(input);
  }
  teacherView = null; render();
  apiGet('teacherFetch', { passcode: pass }).then(function(res){
    if(!res.ok){
      clearTeacherAuth();
      setToast('error', '密語不對，請重新點教師專區輸入一次。');
      setRole('home');
      render();
      return;
    }
    teacherView = res;
    render();
    if(!equipmentData) loadEquipment(); else ensureEquipmentTicking();
    if(localStorage.getItem('crit.teacherAutoRefresh')==='1') setTeacherAutoRefresh(true);
  }).catch(function(e){ setToast('error','連線失敗：'+e.message); setRole('home'); render(); });
}
var teacherAutoRefreshTimer = null;
/**
 * 自動重新整理故意不走 loadTeacherView() 那套「先清空、顯示載入中」的做法，
 * 那樣每 20 秒背景重畫一次會整頁閃一下、很煩；改成資料抓回來以前畫面完全不動，
 * 抓到才悄悄換新資料，而且如果老師正在教師設定裡打字，這次就先跳過、下一輪再試，
 * 不會把打到一半的字蓋掉。
 */
function refreshTeacherViewSilently(){
  if(!apiUrl || !teacherAuthPasscode() || getRole()!=='teacher' || isEditingFormField()) return;
  apiGet('teacherFetch', { passcode: teacherAuthPasscode() }).then(function(res){
    if(!res.ok || isEditingFormField()) return;
    teacherView = res;
    render();
  }).catch(function(){});
}
function setTeacherAutoRefresh(on){
  localStorage.setItem('crit.teacherAutoRefresh', on ? '1' : '0');
  if(on && !teacherAutoRefreshTimer){
    teacherAutoRefreshTimer = setInterval(refreshTeacherViewSilently, 20000);
  } else if(!on && teacherAutoRefreshTimer){
    clearInterval(teacherAutoRefreshTimer);
    teacherAutoRefreshTimer = null;
  }
}

function loadGallery(){
  if(!apiUrl){ galleryData=null; render(); return; }
  galleryData = null; render();
  apiGet('gallery').then(function(res){ galleryData = res; render(); })
    .catch(function(e){ setToast('error','載入失敗：'+e.message); render(); });
}

function goTo(role){
  if(role !== 'gallery' && slideshowIndex != null){ stopSlideTimer(); slideshowIndex = null; }
  if(role !== 'teacher' && teacherAutoRefreshTimer){ clearInterval(teacherAutoRefreshTimer); teacherAutoRefreshTimer = null; }
  setRole(role);
  if(role==='home') loadHome();
  else if(role==='submit') loadMySubs();
  else if(role==='review'){
    if(hasIdentity()){
      if(!reviewAssignment && assignmentsList.length===1) reviewAssignment = assignmentsList[0];
      if(reviewAssignment) loadReviewView(); else render();
    } else render();
  }
  else if(role==='gallery') loadGallery();
  else if(role==='equipment') loadEquipment();
  else if(role==='teacher') loadTeacherView();
  else render();
}

function updateSubmitEnabled(form){
  if(!form) return;
  var btn = form.querySelector('#scoreSubmit');
  if(!btn || !reviewView || reviewView.done) return;
  var complete = reviewView.criteria.every(function(c){ return typeof currentScores[c.key]==='number'; });
  btn.disabled = !complete;
}

function handleFileChange(input){
  var file = input.files && input.files[0];
  if(!file) return;
  if(file.size > MAX_ORIGINAL_BYTES){
    alert('圖片檔案太大，請選 15MB 以下的照片。');
    input.value = '';
    return;
  }
  resizeImageFile(file).then(function(dataUrl){
    var base64 = dataUrl.split(',')[1];
    pendingImage = { dataUrl: dataUrl, base64: base64, mime: 'image/jpeg', name: file.name };
    render();
  }).catch(function(e){
    alert('圖片處理失敗：'+e.message);
  });
}

function pollForSubmission(id, attempt){
  var delay = attempt === 0 ? 400 : 500; // 給表單送出一點點頭彩時間，之後密集檢查
  return new Promise(function(resolve){ setTimeout(resolve, delay); }).then(function(){
    return apiGet('getMySubmissions', { studentNorm: identityNorm() });
  }).then(function(res){
    var found = (res.submissions||[]).filter(function(s){ return s.id===id; })[0];
    if(found) return found;
    if(attempt >= 8) return null;
    return pollForSubmission(id, attempt+1);
  });
}

function handleSubmitWork(form){
  var assignment = form.querySelector('#f_assignment').value;
  var title = form.querySelector('#f_title').value.trim();
  var link = form.querySelector('#f_link').value.trim();
  if(!hasIdentity()) return;
  if(!assignment){ alert('請選擇這是哪一份作業'); return; }
  if(!pendingImage && !link){ alert('請上傳一張圖片，或貼上圖片網址。'); return; }
  if(link && !safeUrl(link)){ alert('請貼上以 http:// 或 https:// 開頭的網址連結'); return; }
  var payload = { id: uid('s_'), studentName:getMyName(), studentSeat:getMySeat(), studentNorm:identityNorm(), title:title, assignment:assignment, createdAt:Date.now(), deviceId:getDeviceId() };
  loading = true; render();
  if(pendingImage){
    // 圖片資料塞不進網址，用隱藏表單送出、讀不到回應，
    // 送出後改用 apiGet 輪詢確認有沒有存成功、順便拿到伺服器配的作品編號。
    payload.imageBase64 = pendingImage.base64;
    payload.imageMime = pendingImage.mime;
    pendingImage = null;
    postFormNoRead('addSubmission', payload);
    pollForSubmission(payload.id, 0).then(function(sub){
      loading = false;
      submitTargetAssignment = null;
      if(sub){
        setToast('success', '已送出！同學評分時不會看到你的名字。');
      } else {
        setToast('success', '已送出，圖片處理中，稍後重新整理「交作品」頁面就會看到。');
      }
      loadMySubs();
    }).catch(function(e){
      loading = false;
      setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。');
      render();
    });
  } else {
    payload.driveLink = link;
    apiGet('addSubmission', payload).then(function(res){
      loading = false;
      submitTargetAssignment = null;
      setToast('success', '已送出！同學評分時不會看到你的名字。');
      loadMySubs();
    }).catch(function(e){
      loading = false;
      setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。');
      render();
    });
  }
}
function handleSubmitScore(form){
  if(!reviewView || reviewView.done) return;
  var workId = form.getAttribute('data-work');
  var complete = reviewView.criteria.every(function(c){ return typeof currentScores[c.key]==='number'; });
  if(!complete) return;
  var norm = identityNorm();
  var payload = {
    id: workId + '__' + norm,
    workId: workId,
    reviewerNorm: norm,
    scores: JSON.parse(JSON.stringify(currentScores)),
    createdAt: Date.now()
  };
  currentScores = {};
  loading = true; render();
  apiGet('addReview', payload).then(function(){
    loading = false;
    setToast('success', '評分已送出，謝謝！');
    loadReviewView();
  }).catch(function(e){
    loading = false;
    setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。');
    render();
  });
}
function handleSaveConfig(form){
  var n = Math.max(1, Math.min(50, parseInt(form.querySelector('#cfg_n').value,10) || 1));
  var lines = form.querySelector('#cfg_criteria').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var oldCriteria = teacherView.config.criteria;
  if(!lines.length) lines = oldCriteria.map(function(c){ return c.label; });
  var passNew = form.querySelector('#cfg_pass').value.trim() || teacherView.config.teacherPasscode;
  var newCriteria = lines.map(function(label, i){
    var existing = oldCriteria[i];
    return { key: existing ? existing.key : 'c' + (i+1) + '_' + uid(''), label: label };
  });
  var namesRevealedByAssignment = {};
  form.querySelectorAll('.cfg-names-toggle').forEach(function(cb){
    namesRevealedByAssignment[cb.getAttribute('data-assignment')] = cb.checked;
  });
  var scoreThreshold = Math.max(0, parseInt(form.querySelector('#cfg_scoreThreshold').value,10) || 0);
  var newAssignments = form.querySelector('#cfg_assignments').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var authPass = teacherAuthPasscode();
  // 注意：這裡故意不呼叫 render()，因為教師畫面的表單會照「目前存的設定」重畫，
  // 存檔還沒回來之前重畫會把剛剛打的內容蓋回舊的、看起來就像「打完字按儲存就消失」。
  // 改成直接操作按鈕本身當作提示，等真的存好了再讓 loadTeacherView() 正常重畫。
  var btn = form.querySelector('button[type="submit"]');
  if(btn){ btn.disabled = true; btn.textContent = '儲存中...'; }
  apiGet('teacherUpdateConfig', { passcode:authPass, criteria:newCriteria, reviewsPerStudent:n, teacherPasscode:passNew, namesRevealedByAssignment:namesRevealedByAssignment, scoreRevealThreshold:scoreThreshold, assignments:newAssignments }).then(function(res){
    if(!res.ok){
      alert('儲存失敗：密語不對或權限有問題，請重新登入教師專區再試一次。');
      clearTeacherAuth();
      setRole('home');
      render();
      return;
    }
    setTeacherAuthPasscode(passNew);
    setToast('success', '設定已儲存');
    loadTeacherView();
  }).catch(function(e){
    if(btn){ btn.disabled = false; btn.textContent = '儲存設定'; }
    alert('儲存失敗：'+e.message+'，請再試一次。');
  });
}
/**
 * 危險操作：永久刪除所有作品和評分。這裡故意做兩層確認——
 * 除了教師密語本身之外，還要在畫面上「再打一次密語」才會送出，
 * 加上一個瀏覽器原生的 confirm() 對話框，避免誤觸。
 */
function handleExportReportsToSheet(){
  var btn = document.getElementById('exportReportsToSheet');
  if(btn){ btn.disabled = true; btn.textContent = '處理中...'; }
  apiGet('exportReportsToSheet', { passcode: teacherAuthPasscode() }).then(function(res){
    if(!res.ok){
      alert('更新失敗：'+(res.error||'unknown'));
      if(btn){ btn.disabled = false; btn.textContent = '更新試算表報表'; }
      return;
    }
    setToast('success', '已更新試算表：評分未達標名單 '+res.shortfallCount+' 筆、作業繳交狀況 '+res.rosterCount+' 人。');
    render();
  }).catch(function(e){
    if(btn){ btn.disabled = false; btn.textContent = '更新試算表報表'; }
    alert('更新失敗：'+e.message);
  });
}
function handleResetAllData(){
  var input = document.getElementById('reset_confirm_pass');
  var typed = input ? input.value.trim() : '';
  var authPass = teacherAuthPasscode();
  if(!typed){ alert('請在上面欄位再輸入一次教師密語，確認要執行這個動作。'); return; }
  if(typed !== authPass){ alert('密語不對，為了安全沒有執行。'); return; }
  if(!confirm('確定要永久刪除全部作品和評分嗎？這個動作沒辦法復原！')) return;
  var btn = document.getElementById('resetAllDataBtn');
  if(btn){ btn.disabled = true; btn.textContent = '處理中...'; }
  apiGet('resetAllData', { passcode: authPass, confirmPasscode: typed }).then(function(res){
    if(!res.ok){
      alert('還原失敗：'+(res.error||'unknown'));
      if(btn){ btn.disabled = false; btn.textContent = '永久刪除所有作品與評分，還原成初始狀態'; }
      return;
    }
    setToast('success','已經還原成初始狀態，所有作品和評分都清空了。');
    if(input) input.value = '';
    loadTeacherView();
    if(equipmentData) loadEquipment();
  }).catch(function(e){
    if(btn){ btn.disabled = false; btn.textContent = '永久刪除所有作品與評分，還原成初始狀態'; }
    alert('還原失敗：'+e.message);
  });
}
function csvCell(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function handleExportCsv(){
  if(!teacherView) return;
  var criteria = teacherView.config.criteria;
  var rows = teacherAssignmentFilter ? teacherView.rows.filter(function(r){ return normAssignment(r.assignment)===normAssignment(teacherAssignmentFilter); }) : teacherView.rows;
  var header = ['排名','座號','姓名','作業','作品名稱'].concat(criteria.map(function(c){ return c.label; })).concat(['總平均','份數','裝置代碼']);
  var lines = [header.map(csvCell).join(',')];
  rows.forEach(function(r,i){
    var cells = [i+1, r.studentSeat, r.studentName, r.assignment||'', r.title||''].concat(
      criteria.map(function(c){ var v=r.perCrit[c.key]; return v==null?'':v.toFixed(2); })
    ).concat([r.overall==null?'':r.overall.toFixed(2), r.count, r.deviceId||'']);
    lines.push(cells.map(csvCell).join(','));
  });
  var csv = '﻿' + lines.join('\r\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = (teacherAssignmentFilter ? teacherAssignmentFilter+'_' : '') + '評分總表.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function handleSaveConnection(form){
  var url = form.querySelector('#conn_url').value.trim();
  if(!url){ alert('請貼上網址'); return; }
  setApiUrl(url);
  setToast('success', '連線已儲存');
  render();
  loadHome();
}
function handleCopyShare(){
  var input = document.getElementById('conn_share');
  if(!input || !input.value) return;
  var done = function(){ setToast('success','已複製，貼給學生就可以了'); render(); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(input.value).then(done).catch(function(){ fallbackCopy(input, done); });
  } else {
    fallbackCopy(input, done);
  }
}
function fallbackCopy(input, done){
  try{ input.removeAttribute('readonly'); input.select(); document.execCommand('copy'); input.setAttribute('readonly',''); done(); }
  catch(e){ alert('複製失敗，請手動選取文字複製。'); }
}
function handleDeleteSubmission(id){
  if(!confirm('確定要刪除這件作品嗎？已經收到的評分也會一併刪除，無法復原。')) return;
  apiGet('deleteSubmission', { id: id, studentNorm: identityNorm() }).then(function(res){
    if(!res.ok){ setToast('error','刪除失敗，請稍後再試。'); render(); return; }
    setToast('success','已刪除');
    loadMySubs();
  }).catch(function(e){ setToast('error','刪除失敗：'+e.message); render(); });
}
function handleDownloadBundle(){
  loading = true; render();
  apiGet('downloadBundle', { studentNorm: identityNorm(), studentName: getMyName() }).then(function(res){
    loading = false;
    if(!res.ok){
      setToast('error', res.error==='no_files' ? '目前沒有可以打包下載的作品檔案。' : '下載失敗，請稍後再試。');
      render();
      return;
    }
    var byteChars = atob(res.zipBase64);
    var byteNumbers = new Array(byteChars.length);
    for(var i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var blob = new Blob([new Uint8Array(byteNumbers)], { type:'application/zip' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = res.filename || '作品.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    render();
  }).catch(function(e){ loading=false; setToast('error','下載失敗：'+e.message); render(); });
}

function attachHandlers(){
  var root = document.getElementById('app');
  root.onclick = function(e){
    if(e.target.closest('#lightboxClose')){ lightboxSrc = null; render(); return; }
    if(e.target.id==='lightboxOverlay'){ lightboxSrc = null; render(); return; }
    var zoomThumb = e.target.closest('.thumb-zoomable');
    if(zoomThumb){ lightboxSrc = zoomThumb.getAttribute('data-full') || zoomThumb.src; render(); return; }
    var navBtn = e.target.closest('[data-nav]');
    if(navBtn){ goTo(navBtn.getAttribute('data-nav')); return; }
    var openA = e.target.closest('[data-open-assignment]');
    if(openA){
      var targetA = openA.getAttribute('data-open-assignment');
      var alreadyOpen = submitTargetAssignment!=null && normAssignment(submitTargetAssignment)===normAssignment(targetA);
      submitTargetAssignment = alreadyOpen ? null : targetA;
      pendingImage = null;
      render();
      return;
    }
    if(e.target.closest('#cancelSubmitForm')){ submitTargetAssignment = null; pendingImage = null; render(); return; }
    var dot = e.target.closest('.score-dot');
    if(dot){
      var key = dot.getAttribute('data-key');
      var val = parseInt(dot.getAttribute('data-val'),10);
      currentScores[key] = val;
      var row = dot.closest('.criterion');
      row.querySelectorAll('.score-dot').forEach(function(b){ b.classList.remove('active'); });
      dot.classList.add('active');
      updateSubmitEnabled(dot.closest('form'));
      return;
    }
    if(e.target.closest('#wantMore')){
      var done2 = reviewView ? reviewView.myDone : 0;
      sessionStorage.setItem('crit.extraTarget', String(done2+5));
      loadReviewView();
      return;
    }
    if(e.target.closest('#saveIdentity')){
      var seatVal = document.getElementById('id_seat').value.trim();
      var nameVal = document.getElementById('id_name').value.trim();
      if(!seatVal || !nameVal){ alert('座號和姓名都要填喔'); return; }
      setMySeat(seatVal); setMyName(nameVal);
      identityEditing = false;
      setToast('success','身分已設定');
      goTo(getRole());
      return;
    }
    var quickBtn = e.target.closest('[data-quick-seat]');
    if(quickBtn){
      setMySeat(quickBtn.getAttribute('data-quick-seat'));
      setMyName(quickBtn.getAttribute('data-quick-name'));
      identityEditing = false;
      setToast('success','已切換身分');
      render();
      return;
    }
    if(e.target.closest('#editIdentity')){ identityEditing = true; render(); return; }
    if(e.target.closest('#exportCsv')){ handleExportCsv(); return; }
    if(e.target.closest('#refreshData')){ loadTeacherView(); return; }
    if(e.target.closest('#saveConn')){ handleSaveConnection(document.getElementById('app')); return; }
    if(e.target.closest('#copyShare')){ handleCopyShare(); return; }
    if(e.target.closest('#toggleNames')){
      var hidden = localStorage.getItem('crit.hideNames')==='1';
      localStorage.setItem('crit.hideNames', hidden ? '0' : '1');
      render();
      return;
    }
    if(e.target.closest('#saveQuickIdentity')){
      var enabled = document.getElementById('quickIdentityEnabled').checked;
      var groupsText = document.getElementById('quickIdentityGroups').value;
      localStorage.setItem('crit.quickIdentityEnabled', enabled ? '1' : '0');
      localStorage.setItem('crit.quickIdentityGroups', groupsText);
      setToast('success','已儲存（只存在這台裝置）');
      render();
      return;
    }
    if(e.target.closest('#resetAllDataBtn')){ handleResetAllData(); return; }
    if(e.target.closest('#exportReportsToSheet')){ handleExportReportsToSheet(); return; }
    var delBtn = e.target.closest('[data-del]');
    if(delBtn){ handleDeleteSubmission(delBtn.getAttribute('data-del')); return; }
    if(e.target.closest('#downloadBundle')){ handleDownloadBundle(); return; }
    var pickA = e.target.closest('[data-pick-assignment]');
    if(pickA){ reviewAssignment = pickA.getAttribute('data-pick-assignment'); loadReviewView(); return; }
    if(e.target.closest('#switchAssignment')){ reviewAssignment = null; reviewView = null; render(); return; }
    if(e.target.closest('#galleryModeGrid')){ galleryViewMode = 'grid'; render(); return; }
    if(e.target.closest('#galleryModeTable')){ galleryViewMode = 'table'; render(); return; }
    if(e.target.closest('#startSlideshow')){
      // 預設不自動播放，要手動按暫停/播放按鈕才會開始輪播
      slideshowIndex = 0; slideshowPlaying = false; enterFullscreen(); render(); return;
    }
    var card = e.target.closest('.gallery-card');
    if(card){
      slideshowIndex = parseInt(card.getAttribute('data-idx'),10) || 0;
      slideshowPlaying = false; enterFullscreen(); render(); return;
    }
    if(e.target.closest('#slideClose')){ stopSlideTimer(); slideshowIndex = null; exitFullscreenIfActive(); render(); return; }
    var fontBtn = e.target.closest('[data-slide-font]');
    if(fontBtn){ handleSlideFontScale(parseInt(fontBtn.getAttribute('data-slide-font'),10)*0.1); return; }
    if(e.target.closest('#slidePrev')){ slideshowIndex = (slideshowIndex||0) - 1; if(slideshowPlaying) startSlideTimer(); render(); return; }
    if(e.target.closest('#slideNext')){ slideshowIndex = (slideshowIndex||0) + 1; if(slideshowPlaying) startSlideTimer(); render(); return; }
    if(e.target.closest('#slidePlayPause')){
      slideshowPlaying = !slideshowPlaying;
      if(slideshowPlaying) startSlideTimer(); else stopSlideTimer();
      render();
      return;
    }
    if(e.target.closest('#equipSaveGroups')){ handleEquipSaveGroups(); return; }
    if(e.target.closest('#equipSaveAttendance')){ handleEquipSaveAttendance(); return; }
    if(e.target.closest('#equipBuildOrder')){ handleEquipBuildOrder(); return; }
    var durBtn = e.target.closest('.equip-duration-btn');
    if(durBtn){ handleEquipQuickDuration(parseInt(durBtn.getAttribute('data-delta'),10)); return; }
    if(e.target.closest('#equipStart')){ handleEquipStart(); return; }
    if(e.target.closest('#equipPauseToggle') || e.target.closest('#floatPauseBtn')){ handleEquipPauseToggle(); return; }
  };
  root.onchange = function(e){
    if(e.target.id==='f_file'){ handleFileChange(e.target); return; }
    if(e.target.id==='gallerySort'){ gallerySort = e.target.value; render(); return; }
    if(e.target.id==='galleryAssignment'){ galleryAssignment = e.target.value; render(); return; }
    if(e.target.id==='toggleGalleryNames'){ galleryShowNames = e.target.checked; galleryNamesTouched = true; render(); return; }
    if(e.target.id==='toggleGalleryScores'){ galleryShowScores = e.target.checked; galleryScoresTouched = true; render(); return; }
    if(e.target.id==='teacherAssignmentFilter'){ teacherAssignmentFilter = e.target.value; render(); return; }
    if(e.target.id==='teacherAutoRefreshToggle'){ setTeacherAutoRefresh(e.target.checked); return; }
    if(e.target.classList && e.target.classList.contains('equip-color-select')){
      handleEquipSetColorFor(e.target.getAttribute('data-group'), parseInt(e.target.getAttribute('data-index'),10), e.target.value);
      return;
    }
  };
  root.onsubmit = function(e){
    var form = e.target;
    if(form.id==='submitForm'){ e.preventDefault(); handleSubmitWork(form); }
    else if(form.id==='scoreForm'){ e.preventDefault(); handleSubmitScore(form); }
    else if(form.id==='teacherConfigForm'){ e.preventDefault(); handleSaveConfig(form); }
  };
}

function init(){
  if(!apiUrl){ setRole('connect'); render(); return; }
  var role = getRole();
  if(role==='connect') role = 'home';
  goTo(role);
  if(role!=='equipment' && role!=='teacher') loadEquipment();
  // 系統記得上次停在哪一頁，重新整理常常直接落在「交作品」或「我要評分」，
  // 但作業清單只有 home/gallery/teacherFetch 這幾個 API 才會回傳；
  // 沒先補抓一次的話，這兩頁的作業下拉選單會是空的（看起來像「看不到作業項目」）。
  if(role!=='home' && role!=='gallery' && role!=='teacher'){
    apiGet('home').then(function(){ render(); }).catch(function(){});
  }
}
init();
})();
</script>
