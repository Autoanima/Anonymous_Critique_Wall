          escapeHtml(name)+'　已回報（'+escapeHtml(st.reportedBySeat)+'號 '+escapeHtml(st.reportedByName)+'）' +
        '</label>';
      }
      return '<div class="equip-confirm-row">'+escapeHtml(name)+'　尚未回報</div>';
    }).join('');
    var allDone = statuses.length>0 && statuses.every(function(st){ return st.confirmed; });
    var anyPendingOrMissing = statuses.some(function(st){ return !st.confirmed; });
    return (
      '<div class="card" style="margin-top:10px'+(allDone?';border-color:var(--good)':(anyPendingOrMissing?';border-color:var(--warn)':''))+'">' +
        '<h3 class="screen-title" style="font-size:0.95rem">'+escapeHtml(g.name)+
          '　組長：'+escapeHtml(leaderSeat?(leaderSeat+' 號'):'—')+
          '　最後輪值：'+escapeHtml(lastUser?(lastUser.seat+' 號 '+lastUser.name):'—')+
        '</h3>' +
        itemRows +
        (pendingCount>0 ? '<button type="button" class="btn btn-primary equip-confirm-btn" data-group="'+escapeAttr(g.name)+'" style="width:100%;margin-top:8px">確認勾選的項目已收到</button>' : '') +
        (allDone ? '<p class="hint" style="color:var(--good);font-weight:700">已全部歸還並確認</p>' : '') +
      '</div>'
    );
  }).join('');
}
function parseGroupsText(text){
  var blocks = text.split(/\n\s*\n/).map(function(b){ return b.trim(); }).filter(Boolean);
  return blocks.map(function(block){
    var lines = block.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    var name = lines[0] || '未命名分組';
    var members = lines.slice(1).map(function(l){
      var m = l.match(/^(\S+)\s+(.+)$/);
      if(m) return { seat: m[1], name: m[2] };
      return { seat: '', name: l };
    }).filter(function(m){ return m.name; });
    return { name: name, members: members };
  });
}
/**
 * 獨立、放在明顯位置的點名區塊，跟開始/暫停按鈕放在一起——這是老師每次上課
 * 都要用的動作，不應該埋在下面「器材輪值管理」那些設定一次就好的東西裡面。
 * 缺席的人一存檔，就會立刻從器材輪值的轉圈名單裡消失（見 presentOrderFor）；
 * 遲到的人只要回來這裡重新勾選「有來」再存一次，就會馬上排回輪值順序，
 * 不需要重新排定順序或做任何其他操作。

/** 點名名單一律依座號排。 */

}
/** 點名加分用的座號 key：去掉前面的 0（01 跟 1 算同一個人），跟伺服器 canonSeatServer 一致。 */
function attKey(seat){ return toHalfWidth(String(seat==null?'':seat)).replace(/\s+/g,'').toLowerCase().replace(/^0+(?=\d)/,''); }
function attBonusPoints(seat){
  var map = teacherView && teacherView.config && teacherView.config.attendanceBonus;
  var rec = map && map[attKey(seat)];
  return rec ? (rec.points||0) : 0;

function attBonusInnerHtml(seat, name){

  return (pts!==0 ? '<span class="award-tag att-total'+(pts<0?' att-total-neg':'')+'" title="這位同學目前累計的點名加扣分">'+(total>0?'＋':'−')+Math.abs(total)+'</span>' : '') +
    '<button type="button" class="btn btn-accent att-minus" data-att-bonus="-1" data-seat="'+escapeAttr(seat)+'" data-name="'+escapeAttr(name)+'">扣分</button>' +

/** 只更新這位同學那一格的加分區，不整頁重畫——不然老師已經勾了還沒按「儲存點名結果」的出缺席會被洗掉。 */
function updateAttBonusDom(seat, name){
  var key = attKey(seat);
  document.querySelectorAll('.att-bonus').forEach(function(el){
    if(el.getAttribute('data-att-seat')===key) el.innerHTML = attBonusInnerHtml(seat, name);
  });
}
var attBonusPending = 0;
/**
 * 點名區幫同學加分（或撤回）：畫面先加，馬上看到累計；再送到伺服器記錄。
 * 連續快按時，伺服器回來的數字可能亂序，所以等所有請求都回來了才用伺服器的累計為準。
 */
function handleAttendanceBonus(seat, name, delta){
  var pass = teacherAuthPasscode();
  if(!pass){ alert('教師密語已失效，請重新登入教師專區。'); return; }
  if(!teacherView || !teacherView.config){ alert('資料還在載入，請稍後再按。'); return; }
  // 每一次加分、扣分都要寫原因（會一起記錄到試算表）；原因欄位的內容會記在這台裝置，下次不用重打
  var reasonEl = document.getElementById('attReason');
  var reason = reasonEl ? reasonEl.value.trim() : (localStorage.getItem('crit.attReason') || '').trim();
  if(!reason){ alert('請先在上方「加扣分原因」欄位填寫原因，才能加分或扣分。'); if(reasonEl) reasonEl.focus(); return; }
  try{ localStorage.setItem('crit.attReason', reason); }catch(e){}
  var key = attKey(seat);
  var map = teacherView.config.attendanceBonus = teacherView.config.attendanceBonus || {};
  var rec = map[key] || { seat: seat, name: name, points: 0 };
  rec.points = (rec.points||0) + delta;
  if(rec.points !== 0) map[key] = rec; else delete map[key];
  attBonusPending++;
  updateAttBonusDom(seat, name);
  apiGet('teacherAttendanceBonus', { passcode: pass, seat: seat, name: name, delta: delta, reason: reason }).then(function(res){
    if(!res || !res.ok) throw new Error(res && res.error==='unauthorized' ? '教師密語不對' : '伺服器沒有存成功（請確認 Code.gs 已經重新部署最新版）');
    attBonusPending--;
    if(attBonusPending===0 && typeof res.points==='number'){
      var m2 = teacherView.config.attendanceBonus = teacherView.config.attendanceBonus || {};
      if(res.points !== 0) m2[key] = { seat: seat, name: name, points: res.points }; else delete m2[key];
      updateAttBonusDom(seat, name);
    }
  }).catch(function(e){
    attBonusPending--;
    // 失敗就把這一次改回去
    var m3 = teacherView.config.attendanceBonus = teacherView.config.attendanceBonus || {};
    var r3 = m3[key] || { seat: seat, name: name, points: 0 };
    r3.points = (r3.points||0) - delta;
    if(r3.points !== 0) m3[key] = r3; else delete m3[key];
    updateAttBonusDom(seat, name);
    alert('點名'+(delta>0?'加分':'扣分')+'沒有存成功，已改回：' + e.message);
  });
}

      '<div class="att-cols">' +

        '<div class="att-col"><p class="att-col-title">依座號</p>' +
          '<label class="att-reason"><span>加扣分原因（必填，會連同日期記錄）</span><input id="attReason" type="text" maxlength="60" value="'+escapeAttr(localStorage.getItem('crit.attReason') || '課堂表現良好')+'" placeholder="例如：課堂發言、忘記帶作業"></label>' +

/**
 * 教師模式最上面那條固定不動的列，放在標題右邊、盡量窄。所有組別共用同一條
 * 時間軸，同一秒算出來的「剩多少時間」本來就完全一樣，不需要每組分開顯示一次，
 * 隨便挑一組有排順序的來算就好；詳細「現在輪到誰」還是要看「器材輪值總覽」。
 */
function teacherEquipMiniHtml(eq){
  if(!eq || !eq.groups || !eq.groups.length) return '';
  var candidates = eq.groups.filter(function(gr){ return (gr.order||[]).length; });
  if(!candidates.length) return '';
  // 各組總時間都以人數最多的組為準，所以會同時結束；但每組目前輪到的人、剩餘時間不一樣，
  // 這裡挑「還在跑」的第一組當代表；全部組別都跑完了就說跑完了。
  var states = candidates.map(function(g){ return equipGroupState(eq, g); });
  var running = states.filter(function(s){ return s.active && !s.done; })[0];
  if(running) return '<span class="hint" style="font-size:0.8rem;font-family:\'JetBrains Mono\',monospace;white-space:nowrap">剩 '+fmtTime(running.remainingMs)+(running.paused?'（暫停）':'')+'</span>';
  var anyStarted = states.some(function(s){ return s.active; });
  if(!anyStarted) return '<span class="hint" style="font-size:0.75rem">尚未開始計時</span>';
  return '<span class="hint" style="font-size:0.75rem;color:var(--good)">全部組別已跑完</span>';
}

/** 從雲端硬碟讀名單，填進分組名單欄位（不會自動儲存，讓老師先檢查）。 */
// ---------- 手機上的名單檔案：在手機上直接讀（CSV／文字檔／Excel），不用先傳到雲端硬碟 ----------
// 解析規則和 Code.gs 的 rosterFromRows 完全一樣：標題列有「座號／姓名／組別」就照標題，沒有就當第一欄座號、第二欄姓名、第三欄組別。
function rosterSeatClient(v){
  var t = toHalfWidth(String(v == null ? '' : v)).replace(/\s+/g, '').replace(/號$/, '');
  if(!t) return '';
  return /^\d+$/.test(t) ? cleanSeat(String(parseInt(t, 10))) : t;
}
function rosterTextToRowsClient(text){
  var delim = text.indexOf('\t') >= 0 ? 'tab' : (/[,，]/.test(text) ? 'comma' : 'space');
  return String(text).split(/\r?\n/).map(function(line){
    line = line.trim();
    if(!line) return [];
    if(delim === 'tab') return line.split('\t');
    if(delim === 'comma') return line.split(/[,，]/);
    return line.split(/\s+/);
  });
}
function rosterFromRowsClient(rows){
  rows = rows.map(function(r){ return r.map(function(c){ return String(c == null ? '' : c).trim(); }); }).filter(function(r){ return r.some(function(c){ return c; }); });
  var SEAT_RE = /座號|座位|號碼|學號|^號$|^no\.?$/i, NAME_RE = /姓名|名字|學生|^name$/i, GROUP_RE = /組別|分組|小組|^組$|^group$/i;
  var seatCol = -1, nameCol = -1, groupCol = -1, start = 0;
  for(var i = 0; i < Math.min(6, rows.length) && seatCol < 0; i++){
    var sc = -1, nc = -1, gc = -1;
    rows[i].forEach(function(c, j){ if(sc < 0 && SEAT_RE.test(c)) sc = j; else if(nc < 0 && NAME_RE.test(c)) nc = j; else if(gc < 0 && GROUP_RE.test(c)) gc = j; });
    if(sc >= 0 && nc >= 0){ seatCol = sc; nameCol = nc; groupCol = gc; start = i + 1; }
  }
  if(seatCol < 0){
    seatCol = 0; nameCol = 1;
    var withThird = rows.filter(function(r){ return r[2]; }).length;
    groupCol = (rows.length && withThird >= rows.length / 2) ? 2 : -1;
  }
  var groups = [], byName = {}, seen = {}, skipped = 0, warnings = [];
  rows.slice(start).forEach(function(r){
    var seat = rosterSeatClient(r[seatCol]), name = String(r[nameCol] || '').trim();
    if(!seat || !name){ skipped++; return; }
    var key = normSeat(seat);
    if(seen[key]){ warnings.push('座號 ' + seat + ' 重複（' + seen[key] + '、' + name + '），只保留前面那一位'); return; }
    seen[key] = name;
    var gname = groupCol >= 0 ? (r[groupCol] || '未分組') : '全班';
    if(!byName[gname]){ byName[gname] = { name: gname, members: [] }; groups.push(byName[gname]); }
    byName[gname].members.push({ seat: seat, name: name });
  });
  groups.forEach(function(g){ g.members.sort(function(a, b){ return (parseInt(a.seat, 10) || 0) - (parseInt(b.seat, 10) || 0); }); });
  if(skipped) warnings.push(skipped + ' 列缺少座號或姓名，已略過');
  if(groupCol < 0) warnings.push('檔案裡沒有「組別」欄位，全部放在「全班」一組；要分組請之後自己在名單裡調整');
  var count = groups.reduce(function(a, g){ return a + g.members.length; }, 0);
  var groupsText = groups.map(function(g){ return g.name + '\n' + g.members.map(function(m){ return m.seat + ' ' + m.name; }).join('\n'); }).join('\n\n');
  return { groups: groups, count: count, warnings: warnings, groupsText: groupsText };
}
/** 讀文字檔：先當 UTF-8，如果出現亂碼符號就改用 Big5（台灣的 Excel 常存成 Big5 的 CSV）。 */
function readFileAsTextSmart(file){
  return file.arrayBuffer().then(function(buf){
    var utf8 = new TextDecoder('utf-8').decode(buf);
    if(utf8.indexOf('�') >= 0){ try{ return new TextDecoder('big5').decode(buf); }catch(e){} }
    return utf8.replace(/^﻿/, '');
  });
}
var XLSX_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
/** 要讀 Excel 檔才會載入讀取工具（平常不載入，不拖慢網頁）。 */
function loadExcelReader(){
  return new Promise(function(resolve, reject){
    if(window.XLSX) return resolve(window.XLSX);
    var sc = document.createElement('script');
    sc.src = XLSX_CDN; sc.async = true;
    sc.onload = function(){ window.XLSX ? resolve(window.XLSX) : reject(new Error('excel_reader_missing')); };
    sc.onerror = function(){ reject(new Error('excel_reader_failed')); };
    document.head.appendChild(sc);
  });
}
/** 讀手機上選的名單檔案，回傳和雲端硬碟匯入一樣的結果格式（{ok, fileName, fileType, count, groups, groupsText, warnings}）。 */
function parseLocalRosterFile(file){
  var name = file.name || '檔案';
  if(/\.(xlsx|xlsm|xls)$/i.test(name)){
    return Promise.all([loadExcelReader(), file.arrayBuffer()]).then(function(parts){
      var XLSX = parts[0];
      var wb = XLSX.read(parts[1], { type: 'array' });
      var pick = wb.SheetNames[0];
      for(var i = 0; i < wb.SheetNames.length; i++){ if(/名單|座號|roster/i.test(wb.SheetNames[i])){ pick = wb.SheetNames[i]; break; } }
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[pick], { header: 1, raw: false, defval: '' });
      return finishLocalRoster(name, 'Excel', rows);
    }).catch(function(e){
      if(e && /excel_reader/.test(e.message)) return { ok: false, error: 'excel_reader_failed', fileName: name };
      return { ok: false, error: 'read_failed', detail: e && e.message, fileName: name };
    });
  }
  if(/\.(csv|txt|tsv)$/i.test(name) || /^text\//.test(file.type || '')){
    return readFileAsTextSmart(file).then(function(text){ return finishLocalRoster(name, '文字檔', rosterTextToRowsClient(text)); })
      .catch(function(e){ return { ok: false, error: 'read_failed', detail: e && e.message, fileName: name }; });
  }
  return Promise.resolve({ ok: false, error: 'unsupported_local', detail: file.type || name, fileName: name });
}
function finishLocalRoster(fileName, fileType, rows){
  var r = rosterFromRowsClient(rows);
  if(!r.count) return { ok: false, error: 'no_students', fileName: fileName };
  r.ok = true; r.fileName = fileName; r.fileType = fileType; r.groupCount = r.groups.length;
  return r;
}
function rosterErrorText(res){
  var d = res.detail ? '（' + res.detail + '）' : '';
  switch(res.error){
    case 'no_file': return '請先貼上檔案連結或輸入檔名。';
    case 'file_not_found': return '找不到這個檔案。請確認：檔案在你登入 Google 的這個雲端硬碟裡（或有分享給你），連結完整，或檔名沒有打錯。' + d;
    case 'unsupported_type': return '這種檔案讀不了（' + (res.detail || '') + '）。Excel、Word、PDF 請先在雲端硬碟用 Google 試算表開啟，另存成 Google 試算表，再貼新的連結。';
    case 'no_students': return '檔案「' + (res.fileName || '') + '」裡讀不到學生。請確認有「座號」和「姓名」兩欄。';
    case 'unsupported_local': return '這種檔案讀不了（' + (res.fileName || res.detail || '') + '）。請選 CSV、文字檔或 Excel（.xlsx、.xls）；Word、PDF 請先轉成 Excel 或 CSV。';
    case 'read_failed': return '讀取檔案失敗：' + (res.detail || '');
    case 'excel_reader_failed': return '需要網路才能讀 Excel 檔（要先載入讀取工具），現在載入失敗。請確認網路，或把檔案另存成 CSV 再選一次。';
    case 'unauthorized': return '教師密語不對。';
    default: return '讀取失敗：' + (res.error || 'unknown') + '（也可能是 Code.gs 還沒更新到最新版）';
  }
}

function handleEquipReportReturned(group){

  var items = (equipmentData && equipmentData.itemTypes) || [];

    if(res.ok){
      equipmentData = res.equipment;

}
function seatNumFor(seat){ var n = parseInt(String(seat==null?'':seat).replace(/\D/g,''),10); return isNaN(n) ? 0 : n; }
/**
 * 兩張表共用的排序邏輯：欄位標題當按鈕，第一次點某欄位用該欄位型態預設的方向
 * （數字類分數由高到低、文字類由字母/筆畫排序由小到大），再點同一欄就反過來；
 * 換點別的欄位就重新從那一欄的預設方向開始。沒點過任何欄位時固定用座號排序。
 */
function sortRows(rows, key, dir, valueFns, defaultSeatKey){
  if(!key) return rows.slice().sort(function(a,b){ return seatNumFor(a[defaultSeatKey]) - seatNumFor(b[defaultSeatKey]); });
  var fn = valueFns[key];
  return rows.slice().sort(function(a,b){
    var av = fn(a), bv = fn(b);
    if(typeof av==='string' || typeof bv==='string'){ return dir * String(av).localeCompare(String(bv),'zh-Hant'); }
    return dir * (av - bv);
  });
}
function sortTh(label, table, key, curKey, curDir, extraClass){
  var active = curKey===key;
  var arrow = active ? (curDir===1?' ▲':' ▼') : '';
  // 標題字太長會被 CSS 截斷成省略號（見 .crit-th／.title-cell），
  // 所以順便把完整文字放進 data-full-label，點的時候用 toast 彈出來給老師看。
  var needsFull = extraClass && (extraClass.indexOf('crit-th')>=0 || extraClass.indexOf('title-cell')>=0);
  return '<th class="th-sort'+(extraClass?' '+extraClass:'')+(active?' th-sort-active':'')+'" data-sort-table="'+table+'" data-sort-key="'+escapeAttr(key)+'"'+(needsFull?' data-full-label="'+escapeAttr(label)+'"':'')+'>'+escapeHtml(label)+arrow+'</th>';
}
function handleHeaderSortClick(table, key){
  if(table==='grade'){
    if(teacherSortKey===key) teacherSortDir = -teacherSortDir;
    else { teacherSortKey = key; teacherSortDir = (key==='name'||key==='assignment'||key==='title'||key==='device') ? 1 : -1; }
  } else if(table==='reviewer'){
    if(reviewerSortKey===key) reviewerSortDir = -reviewerSortDir;
    else { reviewerSortKey = key; reviewerSortDir = (key==='name'||key==='submitted') ? 1 : -1; }
  }
  render();
}

  // 老師想切回學生視角測試，就按「離開教師模式」回首頁，那邊有「快速切換身分」可以用。
  if(role==='teacher'){

    // 是 sticky 的——往下滑頁面時會一直貼在最上面，不用滑回頂端才能點。
    return '<header class="topbar topbar-teacher">' +
      '<div class="topbar-top teacher-bar">' +
        '<div class="teacher-bar-left"><span class="brand-mark">&#9686;</span><button type="button" class="teacher-mode-btn" data-nav="home" title="點一下回到學生模式">教師模式</button>' +
          '<span id="equipDurationQuickSlot">' + equipDurationQuickHtml(equipmentData) + '</span>' +

        '<div id="teacherEquipMiniSlot" style="flex:none">' + teacherEquipMiniHtml(equipmentData) + '</div>' +
      '</div>' +
      // 分頁選單 + 最右邊固定的「開始／暫停」（常用，不跟著選單捲走）
      '<div class="teacher-tabs-row">' +
        '<nav class="tabs tabs-scroll">' +
          TEACHER_TABS.map(function(t){
            return '<button type="button" class="navbtn'+(teacherTab===t.id?' active':'')+'" data-teacher-tab="'+t.id+'">'+t.label+'</button>';
          }).join('') +

      '</div>' +
    '</header>';
  }
  // 老師登入過教師模式的裝置，在學生模式測試時，畫面要跟學生看到的一模一樣，唯一的差別是
  // 左上角的標題可以點，一點就切回教師模式（不用再輸入密語）——所以只是在原本的標題上多一個點擊目標，
  // 外觀完全不變；學生的裝置沒登入過教師模式，這個標題就只是文字。
  var teacherCanReturn = !!teacherAuthPasscode();
  var brandHtml = '<div class="brand"'+(teacherCanReturn ? ' data-nav="teacher" role="button" style="cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none"' : '')+'><span class="brand-mark">&#9686;</span>'+escapeHtml(TITLE)+(classNameText() ? '<span class="brand-class">· '+escapeHtml(classNameText())+'</span>' : '')+'</div>';
  return '<header class="topbar"><div class="topbar-top">'+brandHtml+identityBadgeHtml()+'</div><nav class="tabs">'+btn('home','首頁')+btn('submit','交作品')+btn('review','評分')+btn('gallery','作品牆')+btn('equipment','借器材')+'</nav><div id="equipMiniBarSlot">'+equipMiniBarHtml()+'</div></header>';

/** 每次重畫選單的捲動位置都會歸零，手機上選單列要橫向滑，所以把「目前這個分頁」捲到選單列中間，才看得到自己在哪。 */
function centerActiveTeacherTab(){
  var nav = document.querySelector('.tabs-scroll');
  var active = nav && nav.querySelector('.navbtn.active');
  if(active){
    // 用實際座標算（不能用 offsetLeft：選單不是定位的容器，橫放時它本身已經離左邊很遠，會算偏）
    var navLeft = nav.getBoundingClientRect().left, aRect = active.getBoundingClientRect();
    nav.scrollLeft = nav.scrollLeft + (aRect.left - navLeft) - (nav.clientWidth - aRect.width) / 2;
  }
}

/** 作業要求說明的文字在「首頁」那支 API 裡；直接落在交作品頁（沒經過首頁）的時候補抓一次。 */
function ensureHomeStats(){

/** 啟動時在背景先把「自己交過的作品」抓好，之後點進「交作品」頁面就不用再等一次來回。 */

function loadReviewView(){

/** 伺服器順便告訴我們「評完這件之後大概是哪一件」，先把圖載進瀏覽器快取，學生按下送出後下一張就幾乎是秒開。 */

/** 選作業畫面／評分中都會用到：每份作業各自評了幾件，用來提示還沒評夠的作業。 */

/**
 * 「連接設定」一旦已經連過線（apiUrl 有值），就要跟教師專區一樣輸入教師密語才能打開／修改，

 * 還沒連過線的時候（第一次設定）就不擋，不然沒有網址根本沒辦法驗證密語。
 */
function loadConnectScreen(){

  if(teacherAuthPasscode()){ render(); return; }
  var input = prompt('這個網頁已經連接資料庫了，要修改連接設定請先輸入教師密語：');
  if(input===null){ setRole('home'); render(); return; }

      setRole('home');

var teacherAutoRefreshTimer = null;
/**
 * 自動重新整理故意不走 loadTeacherView() 那套「先清空、顯示載入中」的做法，
 * 那樣每 20 秒背景重畫一次會整頁閃一下、很煩；改成資料抓回來以前畫面完全不動，
 * 抓到才悄悄換新資料，而且如果老師正在教師設定裡打字，這次就先跳過、下一輪再試，
 * 不會把打到一半的字蓋掉。
 */
function refreshTeacherViewSilently(){
  if(!apiUrl || !teacherAuthPasscode() || getRole()!=='teacher' || isEditingFormField()) return;
  apiGet('teacherFetch', { passcode: teacherAuthPasscode() }).then(function(res){
    if(!res.ok || isEditingFormField()) return;
    teacherView = res;
    render();
  }).catch(function(){});
}
function setTeacherAutoRefresh(on){
  localStorage.setItem('crit.teacherAutoRefresh', on ? '1' : '0');
  if(on && !teacherAutoRefreshTimer){
    teacherAutoRefreshTimer = setInterval(refreshTeacherViewSilently, 20000);
  } else if(!on && teacherAutoRefreshTimer){
    clearInterval(teacherAutoRefreshTimer);
    teacherAutoRefreshTimer = null;
  }
}

  if(!galleryData){

function goTo(role){
  if(role !== 'gallery' && slideshowIndex != null){ stopSlideTimer(); slideshowIndex = null; }
  if(role !== 'teacher' && teacherAutoRefreshTimer){ clearInterval(teacherAutoRefreshTimer); teacherAutoRefreshTimer = null; }
  setRole(role);
  if(role==='home') loadHome();
  else if(role==='submit'){ loadMySubs(); ensureHomeStats(); }
  else if(role==='review'){
    if(hasIdentity()){
      if(!reviewAssignment && assignmentsList.length===1) reviewAssignment = assignmentsList[0];
      // 評分最優先：先送出「要評哪一件」的請求，其次才是進度統計
      if(reviewAssignment){ loadReviewView(); loadMyReviewProgress(); }
      else { loadMyReviewProgress(); render(); }
    } else render();
  }
  else if(role==='gallery') loadGallery();
  else if(role==='equipment') loadEquipment();
  else if(role==='teacher') loadTeacherView();
  else if(role==='connect') loadConnectScreen();
  else render();
}

function handleFileChange(input){

var SUBMIT_POLL_BUDGET_MS = 45000; // 每一輪最多等多久（全班同時交的時候，後面的人要排隊）
function updateSubmitWaitNote(waitedMs, retried){
  var el = document.querySelector('.submit-overlay-msg');
  if(!el) return;
  var sec = Math.round(waitedMs / 1000);
  el.textContent = sec < 6 ? (retried ? '還在處理中，已自動重送一次，請稍候…' : '正在上傳中，請稍候…')
    : '同學很多人同時在交，排隊處理中（已等 '+sec+' 秒），請不要關閉或重新整理…';
}
function pollForSubmission(id, attempt, startedAt, retried){
  startedAt = startedAt || Date.now();
  var delay = attempt === 0 ? 400 : (attempt < 8 ? 600 : 1500); // 先密集查，等久了就放慢
  return new Promise(function(resolve){ setTimeout(resolve, delay); }).then(function(){
    // 輪詢中網路抖一下不算失敗，繼續等
    return apiGet('getMySubmissions', { studentNorm: identityNorm() }).catch(function(){ return { submissions: [] }; });
  }).then(function(res){
    var found = (res.submissions||[]).filter(function(s){ return s.id===id; })[0];
    if(found) return found;
    var waited = Date.now() - startedAt;
    if(waited >= SUBMIT_POLL_BUDGET_MS || submitCancelled) return null;
    updateSubmitWaitNote(waited, retried);
    return pollForSubmission(id, attempt+1, startedAt, retried);
  });
}

function handleSubmitWork(form){
  var assignment = form.querySelector('#f_assignment').value;
  var title = form.querySelector('#f_title').value.trim();
  if(!hasIdentity()) return;
  if(!assignment){ alert('請選擇這是哪一份作業'); return; }
  if(!pendingImage){ alert('請先選一張要繳交的圖片。'); return; }
  var imageHash = pendingImage.hash;
  var sameAssignmentSubs = (mySubs||[]).filter(function(s){ return normAssignment(s.assignment)===normAssignment(assignment); });
  if(sameAssignmentSubs.some(function(s){ return s.imageHash && s.imageHash===imageHash; })){
    alert('這件作品你已經在這份作業交過了（內容一模一樣），不用重複交。如果想換一張，請先刪掉舊的那件。');
    return;
  }
  if(sameAssignmentSubs.length && !confirm('你在這份作業已經交過作品了。再交一件的話，同學評分時每個人只會評到你這份作業的其中一件，確定還要再交嗎？')) return;
  var payload = { id: uid('s_'), studentName:getMyName(), studentSeat:getMySeat(), studentNorm:identityNorm(), title:title, assignment:assignment, createdAt:Date.now(), deviceId:getDeviceId(), imageHash:imageHash };
  loading = true; submittingWork = true; submitCancelled = false; render();
  // 圖片資料塞不進網址，用隱藏表單送出、讀不到回應，
  // 送出後改用 apiGet 輪詢確認有沒有存成功、順便拿到伺服器配的作品編號。
  payload.imageBase64 = pendingImage.base64;
  payload.imageMime = pendingImage.mime;
  payload.token = getToken(); // 隱藏表單不是走 apiGet，要自己帶登入 token
  if(teacherAuthPasscode()) payload.teacherPass = teacherAuthPasscode();
  var savedPending = pendingImage; // 留著，萬一最後還是沒送成功，讓學生再按一次送出，不用重新選圖
  pendingImage = null;
  postFormNoRead('addSubmission', payload);
  function hasSameImage(res){
    return (res.submissions||[]).some(function(s){ return s.imageHash===payload.imageHash && normAssignment(s.assignment)===normAssignment(assignment); });
  }
  pollForSubmission(payload.id, 0).then(function(sub){
    if(sub || submitCancelled) return sub;
    // 第一輪沒等到：先確認是不是「內容一模一樣所以沒新增」；不是的話自動重送一次
    // （伺服器用同一個編號去重，萬一第一次其實還在排隊，也不會重複新增）
    return apiGet('getMySubmissions', { studentNorm: identityNorm() }).then(function(res){
      var found = (res.submissions||[]).filter(function(s){ return s.id===payload.id; })[0];
      if(found) return found;
      if(hasSameImage(res)) return { dup: true };
      updateSubmitWaitNote(0, true);
      postFormNoRead('addSubmission', payload, true);
      return pollForSubmission(payload.id, 0, null, true);
    });
  }).then(function(sub){
    loading = false; submittingWork = false;
    if(submitCancelled) return;
    if(sub && sub.dup){
      submitTargetAssignment = null;
      setToast('info', '這件作品你之前已經交過了（內容一模一樣），沒有重複新增。');
      loadMySubs();
      return;
    }
    if(sub){
      submitTargetAssignment = null;
      setToast('success', '已送出！同學評分時不會看到你的名字。');
      loadMySubs();
      return;
    }
    // 兩輪都沒等到：圖片還在，請學生再按一次送出（已經送到的話不會重複新增）
    pendingImage = savedPending;
    setToast('error', '這件作品好像還沒送出成功（可能很多人同時在交）。圖片還在，請再按一次「送出作品」；如果其實已經送到，不會重複新增。');
    render();
  }).catch(function(e){
    loading = false; submittingWork = false;
    if(submitCancelled) return;
    pendingImage = savedPending;
    setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。圖片還在，可以直接再按一次「送出作品」。');
    render();
  });
}
function handleSubmitScore(form){
  if(!reviewView || reviewView.done) return;
  var workId = form.getAttribute('data-work');
  var complete = reviewView.criteria.every(function(c){ return typeof currentScores[c.key]==='number'; });
  if(!complete) return;
  var norm = identityNorm();
  var payload = {
    id: workId + '__' + norm,
    workId: workId,
    reviewerNorm: norm,
    scores: JSON.parse(JSON.stringify(currentScores)),
    createdAt: Date.now(),
    assignment: reviewAssignment,
    extraTarget: getExtraTarget()
  };
  currentScores = {};
  loading = true; render();
  apiGet('addReview', payload).then(function(res){
    loading = false;
    setToast('success', '評分已送出，謝謝！');
    // 伺服器在回應裡直接附上下一件要評的作品，不用再多打一次 getNextWork；
    // 沒附（例如舊版後端）才退回原本的做法。
    if(res && res.next && res.next.criteria){
      reviewView = res.next; preloadUpcomingWork(res.next); render();
    } else {
      loadReviewView();
    }
    loadMyReviewProgress();
  }).catch(function(e){
    loading = false;
    setToast('error', '送出失敗（'+e.message+'），請檢查網路連線或稍後再試。');
    render();
  });
}
function handleSaveConfig(form){
  var n = Math.max(1, Math.min(50, parseInt(form.querySelector('#cfg_n').value,10) || 1));
  var lines = form.querySelector('#cfg_criteria').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var oldCriteria = teacherView.config.criteria;
  if(!lines.length) lines = oldCriteria.map(function(c){ return c.label; });
  var passNew = form.querySelector('#cfg_pass').value.trim() || teacherView.config.teacherPasscode;
  var newCriteria = lines.map(function(label, i){
    var existing = oldCriteria[i];
    return { key: existing ? existing.key : 'c' + (i+1) + '_' + uid(''), label: label };
  });
  var namesRevealedByAssignment = {};
  form.querySelectorAll('.cfg-names-toggle').forEach(function(cb){
    namesRevealedByAssignment[cb.getAttribute('data-assignment')] = cb.checked;
  });
  var assignmentDescriptions = {};
  form.querySelectorAll('.cfg-desc-textarea').forEach(function(ta){
    assignmentDescriptions[ta.getAttribute('data-assignment')] = ta.value;
  });
  var revealMinReviewers = Math.max(0, parseInt(form.querySelector('#cfg_revealMinReviewers').value,10) || 0);
  var revealMinReviews = Math.max(1, parseInt(form.querySelector('#cfg_revealMinReviews').value,10) || 1);
  var newAssignments = form.querySelector('#cfg_assignments').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var authPass = teacherAuthPasscode();
  // 注意：這裡故意不呼叫 render()，因為教師畫面的表單會照「目前存的設定」重畫，
  // 存檔還沒回來之前重畫會把剛剛打的內容蓋回舊的、看起來就像「打完字按儲存就消失」。
  // 改成直接操作按鈕本身當作提示，等真的存好了再讓 loadTeacherView() 正常重畫。

function csvCell(v){

function handleExportCsv(){
  if(!teacherView) return;
  var criteria = teacherView.config.criteria;
  var rows = teacherAssignmentFilter ? teacherView.rows.filter(function(r){ return normAssignment(r.assignment)===normAssignment(teacherAssignmentFilter); }) : teacherView.rows;
  var csvValueFns = {
    seat: function(r){ return seatNumFor(r.studentSeat); },
    name: function(r){ return r.studentName||''; },
    assignment: function(r){ return r.assignment||''; },
    title: function(r){ return r.title||''; },
    overall: function(r){ return r.overall==null?-1:r.overall; },
    count: function(r){ return r.count||0; },
    device: function(r){ return r.deviceId||''; }
  };
  criteria.forEach(function(c){ csvValueFns['crit:'+c.key] = function(r){ return r.perCrit[c.key]==null?-1:r.perCrit[c.key]; }; });
  rows = sortRows(rows, teacherSortKey, teacherSortDir, csvValueFns, 'studentSeat');
  // 匯出的欄位順序跟畫面上目前的排序、欄位順序保持一致，方便直接對照。
  var header = ['排名','座號','姓名','作業','作品名稱'].concat(criteria.map(function(c){ return c.label; })).concat(['總平均','份數','裝置代碼','教師加分','退回原因','榮譽加分','含榮譽總分']);
  var lines = [header.map(csvCell).join(',')];
  rows.forEach(function(r,i){
    var cells = [i+1, r.studentSeat, r.studentName, r.assignment||'', r.title||''].concat(
      criteria.map(function(c){ var v=r.perCrit[c.key]; return v==null?'':v.toFixed(2); })
    ).concat([r.overall==null?'':r.overall.toFixed(2), r.count, r.deviceId||'', r.bonus||'', r.returned ? r.returned.reason : '', r.award>0 ? (r.awardKind+' ＋'+r.award) : '', r.overall==null ? '' : (r.overall+(r.award||0)).toFixed(2)]);
    lines.push(cells.map(csvCell).join(','));
  });
  var csv = '﻿' + lines.join('\r\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = (teacherAssignmentFilter ? teacherAssignmentFilter+'_' : '') + '評分總表.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

 * 順便清掉這支裝置上暫存的首頁／作品牆資料（那是「先顯示舊資料」用的），登入、座號姓名、教師登入都不會被清掉。

  }catch(e){}
  var url = new URL(location.href);
  url.searchParams.set('_r', String(Date.now()));
  location.replace(url.toString());
}
function handleLoginSubmit(){
  if(!loginStep) return;
  var step = loginStep;
  var reg = step.mode==='register';
  var pw = document.getElementById('id_pw').value;
  if(normalizePassword(pw).length < 4){ alert('密碼至少要 4 個字。'); return; }
  if(reg){
    var pw2 = document.getElementById('id_pw2').value;
    if(normalizePassword(pw) !== normalizePassword(pw2)){ alert('兩次輸入的密碼不一樣，請再確認一次。'); return; }
  }
  var btn = document.getElementById('loginSubmit');
  if(btn){ btn.disabled = true; btn.textContent = '處理中...'; }
  pwHashFor(step.rawSeat, pw).then(function(hash){
    return apiGet(reg ? 'register' : 'login', { seat: step.rawSeat, pwHash: hash });
  }).then(function(res){
    if(res.ok){
      setMySeat(step.rawSeat); setMyName(step.name); setToken(res.token);
      loginStep = null; identityEditing = false;
      setToast('success', reg ? '密碼設定好了，已登入。' : '登入成功。');
      goTo(getRole());
      return;
    }
    if(res.error==='bad_password') step.error = '密碼不對，請再試一次'+(res.left!=null ? '（還可以試 '+res.left+' 次）' : '')+'。忘記的話請找老師重設。';
    else if(res.error==='locked') step.error = '輸入錯誤太多次了，請過 10 分鐘再試，或找老師重設密碼。';
    else if(res.error==='exists'){ step.mode = 'login'; step.error = '這個座號已經設定過密碼了，請直接輸入密碼登入。'; }
    else if(res.error==='no_account'){ step.mode = 'register'; step.error = '這個座號還沒有設定密碼，請先設定一組。'; }
    else if(res.error==='not_in_roster') step.error = '名單上找不到這個座號，請跟老師確認。';
    else step.error = '登入失敗（'+(res.error||'unknown')+'），請稍後再試。';
    render();
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = reg ? '設定並登入' : '登入'; }
    alert('登入失敗：'+err.message);
  });
}
function handleResetPassword(){
  var input = document.getElementById('resetPwSeat');
  var seat = input ? input.value.trim() : '';
  if(!seat){ alert('請先輸入要重設密碼的座號。'); return; }
  var member = rosterLookup(seat);
  var who = member ? (cleanSeat(member.seat)+' 號 '+String(member.name||'')) : (seat+' 號');
  if(!confirm('要重設 '+who+' 的密碼嗎？他現有的登入會全部失效，下次登入要重新設定密碼。')) return;
  apiGet('resetPassword', { passcode: teacherAuthPasscode(), seat: seat }).then(function(res){
    if(!res.ok){ alert('重設失敗：'+(res.error||'unknown')); return; }
    setToast(res.removed ? 'success' : 'info', res.removed ? who+' 的密碼已經重設，他下次登入會重新設定。' : who+' 目前還沒有設定過密碼，不用重設。');
    render();
  }).catch(function(e){ alert('重設失敗：'+e.message); });
}
function handleDeleteSubmission(id){
  if(!confirm('確定要刪除這件作品嗎？已經收到的評分也會一併刪除，無法復原。')) return;
  apiGet('deleteSubmission', { id: id, studentNorm: identityNorm(), deviceId: getDeviceId() }).then(function(res){
    if(!res.ok){
      setToast('error', res.error==='returned' ? '這件作品已經被老師退回，不能自己刪除，請直接再交一件新的。' : res.error==='wrong_device'
        ? '這件作品不是用這台裝置交的，為了避免誤刪別人的作品，只能用原本交作品的那支手機／電腦刪除；如果真的要刪，請找老師幫忙。'
        : '刪除失敗，請稍後再試。');
      render(); return;
    }
    setToast('success','已刪除');
    loadMySubs();
  }).catch(function(e){ setToast('error','刪除失敗：'+e.message); render(); });
}
function handleDownloadBundle(){
  loading = true; render();
  apiGet('downloadBundle', { studentNorm: identityNorm(), studentName: getMyName() }).then(function(res){
    loading = false;
    if(!res.ok){
      setToast('error', res.error==='no_files' ? '目前沒有可以打包下載的作品檔案。' : '下載失敗，請稍後再試。');
      render();
      return;
    }
    var byteChars = atob(res.zipBase64);
    var byteNumbers = new Array(byteChars.length);
    for(var i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var blob = new Blob([new Uint8Array(byteNumbers)], { type:'application/zip' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = res.filename || '作品.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    render();
  }).catch(function(e){ loading=false; setToast('error','下載失敗：'+e.message); render(); });
}

}

function init(){
  if(!apiUrl){ setRole('connect'); render(); return; }
  var role = getRole();
  if(role==='connect') role = 'home';
  // 載入順序：「交作品」需要的東西（作業清單 + 自己交過的作品）最優先，
  // 器材進度條、作品牆預載、圖片預載都排在這兩個回來之後（最晚 3 秒就放行，避免其中一個卡住拖累全部）。
  setTimeout(flushAfterCritical, 3000);
  // 上次看到的作業清單先拿來用，「交作品」的作業下拉選單一打開就有選項，不用等網路回來。
  var cachedHome = swrLoad('home');
  if(cachedHome){
    if(!homeStats) homeStats = cachedHome;
    if(!assignmentsList.length && Array.isArray(cachedHome.assignments)) assignmentsList = cachedHome.assignments;
  }
  goTo(role);
  // 系統記得上次停在哪一頁，重新整理常常直接落在「交作品」或「我要評分」，
  // 但作業清單只有 home/gallery/teacherFetch 這幾個 API 才會回傳；
  // 沒先補抓一次的話，這兩頁的作業下拉選單會是空的（看起來像「看不到作業項目」）。
  if(role==='home'){
    // loadHome 自己會抓作業清單
  } else if(role==='gallery' || role==='teacher'){
    markCritical('home'); // 這兩頁的主要 API 本身就會帶回作業清單
  } else {
    apiGet('home').then(function(json){ if(json && json.assignments){ homeStats = json; swrSave('home', json); } markCritical('home'); render(); }).catch(function(){ markCritical('home'); });
  }
  if(role!=='submit') prefetchMySubs(); // 人在交作品頁的話，goTo 已經會抓，不重複
  if(role!=='equipment' && role!=='teacher'){
    // 還沒登入的人需要班級名單才能登入，名單馬上抓；已經登入的人排在優先功能後面
    if(hasIdentity()) afterCritical(loadEquipment); else loadEquipment();
  }
}
init();
})();
</script>
</body>
</html>
