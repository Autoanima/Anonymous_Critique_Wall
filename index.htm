<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名評圖牆</title>
<link rel="icon" href="icon_192.png" type="image/png">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="apple-touch-icon" href="icon_192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#EEF0EC;
  --surface:#FFFFFF;
  --surface-2:#F7F8F5;
  --ink:#1F2421;
  --ink-soft:#5B615C;
  --line:#CBCFC6;
  --accent:#2C5F6F;
  --accent-strong:#204652;
  --accent-soft:#DCEAEB;
  --good:#3F7D4F;
  --warn:#B9860A;
  --low:#B4483B;
  --low-soft:#F5E1DE;
  --focus:#2C5F6F;
  --radius:10px;
  --shadow:0 1px 2px rgba(31,36,33,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --surface:#1C2224; --surface-2:#222A2C; --ink:#E9EBE6; --ink-soft:#A9AFA9;
    --line:#333B3A; --accent:#7FC2CF; --accent-strong:#9FD3DE; --accent-soft:#203238;
    --good:#6FBF7E; --warn:#E0B23D; --low:#E2796A; --low-soft:#3A2420; --focus:#7FC2CF;
    --shadow:0 1px 2px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --surface:#1C2224; --surface-2:#222A2C; --ink:#E9EBE6; --ink-soft:#A9AFA9;
  --line:#333B3A; --accent:#7FC2CF; --accent-strong:#9FD3DE; --accent-soft:#203238;
  --good:#6FBF7E; --warn:#E0B23D; --low:#E2796A; --low-soft:#3A2420; --focus:#7FC2CF;
  --shadow:0 1px 2px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html{color-scheme:light dark;scroll-behavior:smooth;}
[id^="section-"]{scroll-margin-top:112px;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,textarea{font-family:inherit;}

.shell{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:0 40px;min-height:100vh;display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;background:var(--paper);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;z-index:5;border-bottom:1px solid var(--line);}
.topbar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;}
.brand-mark{color:var(--accent);font-size:1.3rem;}
.identity-badge{background:none;border:none;color:var(--ink-soft);font-size:0.72rem;padding:2px 4px;cursor:pointer;white-space:nowrap;}
.tabs{display:flex;gap:8px;}
.navbtn{flex:1;padding:10px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:0.85rem;font-weight:500;cursor:pointer;}
.navbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.navbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
/* 整排按鈕固定一行，不換行：字不換行、窄螢幕就縮小間距和字級 */
.tabs{flex-wrap:nowrap;}
.navbtn{white-space:nowrap;}
@media (max-width:400px){
  .tabs{gap:5px;}
  .navbtn{padding:10px 2px;font-size:0.8rem;}
}
.tabs-scroll{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs-scroll::-webkit-scrollbar{display:none;}
.tabs-scroll .navbtn{flex:none;white-space:nowrap;padding:10px 16px;}
/* 教師模式的頂端列要盡量矮（手機上它是 sticky，佔掉的高度會一直蓋住內容）：第一排一行放完、按鈕縮小 */
.topbar-teacher{gap:6px;padding-block:8px 6px;}
.teacher-bar{flex-wrap:nowrap;gap:8px;white-space:nowrap;}
.teacher-bar-left{display:flex;align-items:center;gap:8px;min-width:0;font-size:0.8rem;}
.teacher-bar-left .brand-mark{font-size:1.1rem;}
.teacher-mode-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:0.8rem;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap;}
.teacher-mode-btn:active{background:var(--accent-soft);}
.topbar-teacher .tabs-scroll .navbtn{padding:6px 14px;font-size:0.82rem;}
.topbar-teacher .tabs .navbtn{padding:6px 8px;font-size:0.82rem;}
.teacher-tabs-row{display:flex;align-items:center;gap:8px;}
.teacher-tabs-row .tabs-scroll{flex:1;min-width:0;}
.teacher-tabs-row #equipStartPauseToggle{flex:none;padding:6px 14px;font-size:0.82rem;background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent);font-weight:700;white-space:nowrap;}
.settings-fold{margin-top:10px;}
.settings-fold>summary{cursor:pointer;font-weight:700;padding:4px 0;}
.navbtn-select{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.content{padding-top:20px;display:flex;flex-direction:column;gap:16px;}
.screen-title{font-family:'Noto Serif TC',serif;font-size:1.4rem;margin:0;text-wrap:balance;}

.hero h1{font-family:'Noto Serif TC',serif;font-size:1.6rem;margin:0 0 6px;text-wrap:balance;}
.lede{color:var(--ink-soft);margin:0 0 4px;}
.stat-row{display:flex;gap:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;}
.stat-num{display:block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--accent-strong);}
.stat-label{display:block;font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}
.cta-row{display:flex;gap:10px;margin:4px 0;}
.steps{margin:4px 0 0;padding-left:1.2em;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;font-size:0.9rem;}
.footer{margin-top:auto;padding-top:24px;text-align:center;display:flex;gap:14px;justify-content:center;}
.footer-link{color:var(--ink-soft);font-size:0.8rem;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}

.btn{border:none;border-radius:999px;padding:12px 18px;font-size:0.95rem;font-weight:700;cursor:pointer;flex:1;}
a.btn{text-decoration:none;text-align:center;display:inline-block;}
a.navbtn{text-decoration:none;text-align:center;display:inline-block;}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-accent{background:var(--accent-soft);color:var(--accent-strong);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);padding:16px;box-shadow:var(--shadow);}
.form{display:flex;flex-direction:column;gap:12px;}
.field{display:flex;flex-direction:column;gap:6px;font-size:0.85rem;color:var(--ink-soft);}
.field input,.field textarea,.field select{width:100%;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.assignment-pick{display:flex;flex-direction:column;gap:8px;}
.assignment-progress-badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:0.72rem;font-weight:700;background:rgba(255,255,255,0.18);vertical-align:middle;}
.assignment-progress-warn{background:var(--warn);color:#1a1a1a;}
.field input:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
.hint{font-size:0.8rem;color:var(--ink-soft);margin:0;}

.upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;background:var(--surface-2);}
.upload-box input[type=file]{display:block;margin:0 auto;max-width:100%;}
.upload-preview{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--surface);}
.upload-preview img{display:block;width:100%;max-height:220px;object-fit:contain;}
.or-sep{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:0.75rem;}
.or-sep::before,.or-sep::after{content:'';flex:1;height:1px;background:var(--line);}

.mine-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
.mine-list .code{font-family:'JetBrains Mono',monospace;background:var(--accent-soft);color:var(--accent-strong);padding:2px 8px;border-radius:6px;margin-right:8px;font-weight:700;}
.mine-item{display:flex;align-items:center;gap:10px;}
.mine-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);flex-shrink:0;}
.mine-thumb-empty{display:inline-block;}
.thumb-zoomable{cursor:zoom-in;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(10,12,11,0.92);z-index:65;display:flex;align-items:center;justify-content:center;padding:24px;}
.lightbox-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:2rem;line-height:1;cursor:pointer;padding:4px 10px;}
.submit-overlay{position:fixed;inset:0;background:rgba(10,12,11,0.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.submit-overlay-card{background:var(--surface);border-radius:14px;padding:26px 22px;max-width:320px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.35);}
.submit-overlay-msg{font-weight:700;font-size:1.05rem;margin:0 0 8px;}
.spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.mine-info{flex:1;min-width:0;}
.mine-del{border:1px solid var(--low);background:none;color:var(--low);border-radius:999px;padding:6px 12px;font-size:0.8rem;font-weight:700;cursor:pointer;flex-shrink:0;}
.mine-item-clickable{cursor:pointer;border-radius:8px;padding:6px;margin:-6px;}
.mine-item-clickable:hover{background:var(--surface-2);}
.mine-item-active{background:var(--accent-soft);}
.mine-item-detail{padding-left:12px;}

.progress{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink-soft);margin:0;font-size:0.85rem;}
.work-card{display:flex;flex-direction:column;gap:12px;}
.work-code{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:0.05em;color:var(--accent-strong);background:var(--accent-soft);align-self:flex-start;padding:4px 10px;border-radius:6px;}
.preview-frame{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);}
.preview-frame iframe,.preview-frame img{width:100%;height:100%;border:0;object-fit:contain;background:var(--surface-2);}
.work-title{margin:0;font-style:italic;color:var(--ink-soft);}

.criterion{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line);}
.criterion:last-of-type{border-bottom:none;}
.crit-label{flex:1;min-width:140px;font-size:0.9rem;}
.score-dots{display:flex;gap:6px;}
.score-dot{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.score-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.score-dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.done-card{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;}
.big-check{font-size:1.1rem;font-weight:700;margin:0;}

.toast{border-radius:8px;padding:10px 14px;font-size:0.9rem;}
.toast-success{background:var(--accent-soft);color:var(--accent-strong);}
.toast-error{background:var(--low-soft);color:var(--low);}
.toast-info{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}

.table-wrap{overflow-x:auto;padding:0;}
.grade-table{border-collapse:collapse;width:100%;font-size:0.85rem;min-width:620px;}
.grade-table th,.grade-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.grade-table thead th{position:sticky;top:0;background:var(--surface);font-weight:700;color:var(--ink-soft);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;}
.grade-table td.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;}
.grade-table td.mono{font-family:'JetBrains Mono',monospace;}
.grade-table td.strong{font-weight:700;color:var(--accent-strong);}
.grade-table th.th-sort{cursor:pointer;user-select:none;}
.grade-table th.th-sort:hover{color:var(--ink);}
.grade-table th.th-sort-active{color:var(--accent-strong);}
.grade-table th.crit-th,.grade-table td.title-cell{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 首頁榮譽榜：頒獎台＋人氣獎 */
.honors{overflow:hidden;}
.honors-title{display:flex;align-items:center;gap:8px;font-family:'Noto Serif TC',serif;font-size:1.15rem;font-weight:700;margin:0 0 8px;}
.honors-sub{margin:0 0 6px;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:14px 0 6px;}
.podium-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;--c:#C5CBD3;--h:46px;--d:.35s;}
.podium-r1{--c:#F2C14E;--h:72px;--d:.65s;flex-grow:1.2;}
.podium-r2{--c:#C5CBD3;--h:50px;--d:.35s;}
.podium-r3{--c:#CD8B55;--h:34px;--d:.05s;}
.podium-medal{font-size:1.7rem;line-height:1;animation:medalPop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--d) + .5s);}
.podium-r1 .podium-medal{font-size:2.3rem;}
.podium-img{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:2px solid var(--c);margin:6px 0;background:var(--surface-2);font-size:2rem;color:var(--ink-soft);cursor:zoom-in;}
.podium-r1 .podium-img{box-shadow:0 0 0 3px var(--c),0 8px 26px rgba(242,193,78,0.38);}
.podium-name{font-weight:700;font-size:0.85rem;line-height:1.35;overflow-wrap:anywhere;}
.podium-score{font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--accent-strong);}
.podium-base{display:flex;align-items:flex-start;justify-content:center;width:100%;height:var(--h);margin-top:8px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--c),rgba(0,0,0,0.12));transform-origin:bottom;animation:podiumRise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d);color:#1a1a1a;font-weight:800;font-size:1.3rem;padding-top:6px;}
.podium-mystery .podium-medal{opacity:0.45;filter:grayscale(1);}
.podium-mystery .podium-img{border-style:dashed;}
.award-tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:#F2C14E;color:#1a1a1a;font-size:0.72rem;font-weight:800;vertical-align:middle;white-space:nowrap;}
.honors-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
.honors-row .podium-img{width:48px;margin:0;border-radius:10px;font-size:1.2rem;}
.honors-row-medal{font-size:1.6rem;flex:none;}
.popular{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:14px;border:1px solid #ff8a65;background:linear-gradient(90deg,rgba(255,138,101,0.16),rgba(255,138,101,0.03));animation:medalPop .6s ease both;animation-delay:1s;}
.popular .podium-img{width:64px;margin:0;border-color:#ff8a65;flex:none;}
.popular-badge{font-weight:800;color:#ff8a65;font-size:0.95rem;}
.honors-lock{text-align:center;}
.honors-progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px;}
.honors-progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#F2C14E);transition:width .6s ease;}
@keyframes podiumRise{from{transform:scaleY(0);opacity:0;}to{transform:scaleY(1);opacity:1;}}
@keyframes medalPop{from{transform:scale(0) rotate(-25deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
@media (prefers-reduced-motion: reduce){ .podium-base,.podium-medal,.popular{animation:none;} }
/* 點名區：左右兩欄（左＝分組狀況，右＝依座號＋加分按鈕），座號姓名放大 */
.att-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;margin-top:8px;}
.att-col{min-width:0;}
.att-col-title{margin:0 0 4px;font-weight:700;color:var(--ink-soft);font-size:0.85rem;}
.att-group{margin-top:0;margin-bottom:8px;padding:8px 10px;}
.att-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:7px 0;border-bottom:1px solid var(--line);}
.att-row:last-child{border-bottom:none;}
.att-label{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;font-size:1.2rem;font-weight:700;line-height:1.3;cursor:pointer;overflow-wrap:anywhere;}
.att-name{cursor:default;display:block;}
.att-seat-row .att-name{flex:1 1 100%;}
.att-seat-row .att-bonus{margin-left:0;justify-content:flex-start;width:100%;}
.att-label input{width:22px;height:22px;flex:none;}
.att-absent{color:var(--ink-soft);font-weight:500;font-size:0.8rem;white-space:nowrap;}
.att-bonus{flex:none;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-left:auto;}
.att-bonus .btn{flex:none;padding:8px 12px;min-width:56px;font-size:1rem;font-weight:700;touch-action:manipulation;}
.att-bonus .att-minus{background:#b3261e;color:#fff;border-color:#b3261e;}
.att-total-neg{background:#b3261e;color:#fff;}
.att-reason{display:block;margin:0 0 8px;font-size:0.8rem;color:var(--ink-soft);}
.att-reason input{display:block;width:100%;margin-top:3px;padding:8px 10px;font-size:1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);box-sizing:border-box;}
.att-total{min-width:2.6em;text-align:center;}
@media (max-width:420px){
  .att-label{font-size:1.05rem;}
  .att-bonus{gap:4px;}
  .att-bonus .btn{padding:6px 8px;min-width:44px;font-size:0.9rem;}
  .att-bonus .award-tag{font-size:0.7rem;padding:0 5px;}
}
.brand-class{display:inline-block;max-width:8em;margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;font-size:0.72em;font-weight:500;color:var(--ink-soft);}
.assignment-chip-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:2px 14px;}
.assignment-chip-scroll::-webkit-scrollbar{height:4px;}
.assignment-chip{flex:none;scroll-snap-align:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:0.9rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.assignment-chip-active{background:var(--accent);color:#fff;border-color:var(--accent);}
/* 手機橫放時盡量整張總表都塞進螢幕寬度，不用再左右滑動——欄位多的時候
   靠縮小字級、留白跟縮圖，比欄寬硬性下限更重要，所以這裡把下限拿掉。
   螢幕比較窄的橫向（手機）繼續把長標題／作品名稱截斷成省略號；
   螢幕比較寬的橫向（大手機、平板）容得下，就讓標題整段換行完整顯示。 */
@media (orientation:landscape) and (max-width:1000px){
  .grade-table{min-width:0;font-size:0.72rem;}
  .grade-table th,.grade-table td{padding:4px 6px;}
  .grade-table thead th{font-size:0.64rem;}
  .grade-table .mine-thumb{width:26px;height:26px;border-radius:5px;}
  .grade-table th.crit-th,.grade-table td.title-cell{max-width:72px;}
}
@media (orientation:landscape) and (max-width:760px){
  .grade-table .col-device{display:none;}
}

<script>
(function(){
'use strict';

var TITLE = '匿名評圖牆';
function classNameText(){ return (homeStats && homeStats.className) ? String(homeStats.className) : ''; }
var MAX_ORIGINAL_BYTES = 15 * 1024 * 1024; // 15MB 原始檔案上限
var RESIZE_MAX_DIM = 1600;
var RESIZE_QUALITY = 0.82;
// 「快速切換身分」預設帶兩組、每組三人，方便老師一個人測試分組相關的功能（例如器材輪值）；
// 這份清單跟開關都只存在老師自己這台裝置的 localStorage，不會同步到學生看到的資料庫。
var DEFAULT_QUICK_IDENTITY_TEXT = '第一組\n01 陳大文\n02 林小華\n03 黃美玲\n\n第二組\n04 張志豪\n05 吳佳蓉\n06 劉建宏';

// ---------- API 連線位址（不用改原始碼，改在「連接設定」畫面貼上即可） ----------
/**
 * 身分、登入狀態、教師密語記憶這些「屬於某一個班」的資料，存的時候在 key 後面加上這個班的後端網址雜湊，
 * 同一支手機打開不同班級的連結，各班各記各的，不會把 A 班的身分帶到 B 班。
 * （作品清單快取 swr 本來就有分班；裝置代碼、字級、目前分頁這些跟班級無關的設定不分。）
 */
function sk(key){ return key + '@' + hashString((apiUrl || '') + (clsId ? '#' + clsId : '')); }
/** 舊版的身分資料沒有分班：第一次執行新版時，全部歸給「這支手機原本連的那個班」，其他班一律從頭開始。 */
function migrateScopedKeys(oldUrl){
  try{
    if(localStorage.getItem('crit.scopedV1')) return;
    localStorage.setItem('crit.scopedV1', '1');
    if(!oldUrl) return;
    var suffix = '@' + hashString(oldUrl);
    ['crit.myName','crit.mySeat','crit.token','crit.tokenSeat','crit.teacherAuthSaved','crit.quickIdentityGroups','crit.quickIdentityEnabled','crit.simEquip'].forEach(function(k){
      var v = localStorage.getItem(k);
      if(v != null){ localStorage.setItem(k + suffix, v); localStorage.removeItem(k); }
    });
  }catch(e){}
}
var memApi = '', memCls = ''; // 瀏覽器不讓網頁儲存資料時（無痕／私密瀏覽、封鎖網站資料），連結裡的網址只能記在這次開啟的頁面裡
/** 這個瀏覽器目前能不能儲存網頁資料（記住資料庫網址、登入狀態都靠它）。 */
function storageWorks(){
  try{ localStorage.setItem('crit.__t', '1'); var ok = localStorage.getItem('crit.__t') === '1'; localStorage.removeItem('crit.__t'); return ok; }catch(e){ return false; }
}
/** 是不是從「加到主畫面」的圖示開啟的（這種模式的儲存空間和瀏覽器是分開的）。 */
function isStandalone(){
  try{ return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }catch(e){ return false; }
}
function getApiUrl(){
  migrateScopedKeys(localStorage.getItem('crit.apiUrl') || ''); // 一定要在套用網址參數 ?api= 之前，不然會把舊身分歸給新的那個班
  try{
    var params = new URLSearchParams(location.search);
    var fromQuery = params.get('api');
    if(fromQuery){
      var saved = false;
      try{
        localStorage.setItem('crit.apiUrl', fromQuery);
        localStorage.setItem('crit.cls', params.get('cls') || ''); // 學生連結帶 &cls=班級代號；沒帶就是原本的那一班
        saved = localStorage.getItem('crit.apiUrl') === fromQuery;
      }catch(e){}
      if(!saved){ memApi = fromQuery; memCls = params.get('cls') || ''; } // 存不起來：這次先連得上（網址本來就留在網址列，重新整理也還在）
    } else if(params.has('cls')){
      localStorage.setItem('crit.cls', params.get('cls') || '');
    } else if(params.has('_r')){
      // 「強制重新整理」帶來的一次性參數（網址不同，瀏覽器和 CDN 才不會拿舊檔），載入後把它從網址列拿掉
      params.delete('_r');
      history.replaceState({}, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
    }
  }catch(e){}
  try{ return localStorage.getItem('crit.apiUrl') || memApi; }catch(e){ return memApi; }
}

/**
 * 網址列永遠保持「網頁網址＋?api=資料庫網址＋&cls=班級代號」的完整樣子。
 * 原因：iPhone「加入主畫面」記的是加入當下的網址，而主畫面圖示有自己獨立的儲存空間——
 * 如果網址列是乾淨的，圖示打開就是一片空白、連不到資料庫；有了完整網址，圖示第一次打開就會自己連上。
 */
function syncUrlQuery(){
  try{
    var q = apiUrl ? '?api=' + encodeURIComponent(apiUrl) + (clsId ? '&cls=' + encodeURIComponent(clsId) : '') : '';
    var now = location.search;
    if(q !== now) history.replaceState({}, '', location.pathname + q);
  }catch(e){}
}
syncUrlQuery();
function setApiUrl(u, cls){
  try{ localStorage.setItem('crit.apiUrl', u); }catch(e){}
  apiUrl = u;
  if(cls !== undefined){ clsId = cls || ''; try{ localStorage.setItem('crit.cls', clsId); }catch(e){} }
  syncUrlQuery();
}
/** 貼上的可以是完整的「學生連結」（網頁網址?api=...&cls=...），也可以只是資料庫網址（.../exec）。 */
function parseConnectInput(text){
  var t = String(text || '').trim();
  var m = t.match(/[?&]api=([^&#\s]+)/);
  if(m){
    var c = t.match(/[?&]cls=([^&#\s]*)/);
    var api = '', cls = '';
    try{ api = decodeURIComponent(m[1]); cls = c ? decodeURIComponent(c[1]) : ''; }catch(e){ api = m[1]; cls = c ? c[1] : ''; }
    return { api: api, cls: cls };
  }
  return { api: t, cls: undefined };
}
function looksLikeApiUrl(u){ return /^https:\/\/script\.google\.com\/.+\/exec$/.test(String(u || '').trim()); }

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }
/** 時間軸色塊裡的座號故意去掉補零的前導 0（例如「02」顯示成「2」），
 * 因為等寬字體的「0」在小色塊裡縮小後很容易看成「8」。 */
function stripLeadingZero(seat){ return String(seat==null?'':seat).replace(/^0+(?=\d)/, ''); }
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
// 座號可能被輸入成「 1 」「01」「１」（全形），這幾個都是同一個人：
// cleanSeat 給「顯示／儲存」用（半形、去空白、純數字不足兩位補 0，例如 1 → 01）；
// normSeat 給「比對」用（再把純數字的前導零去掉，所以 01 跟 1 比對起來是同一個）。
// 後端 Code.gs 有同一套規則（canonSeatServer／padSeat），舊資料不用改也能對得上。
function toHalfWidth(s){
  return String(s==null?'':s).replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xfee0); }).replace(/　/g,' ');
}
function cleanSeat(s){ var t = toHalfWidth(s).replace(/\s+/g,''); return (/^\d+$/.test(t) && t.length<2) ? '0'+t : t; }
function normSeat(s){ var t = toHalfWidth(s).replace(/\s+/g,'').toLowerCase(); return /^\d+$/.test(t) ? t.replace(/^0+(?=\d)/,'') : t; }
// 作業名稱要正規化過再比較，理由跟後端 Code.gs 裡的 normAssignment 一樣：
// Google 試算表會把 "01" 這種看起來像數字的文字自動存成數字 1，兩邊格式對不起來
// 的話，作業繳交狀況、作品牆篩選、教師總表篩選全部都會找不到對應的資料。
/** 表格欄位放不下完整作業名稱（例如「01高速快門」）時的簡短標示：開頭的編號，沒有編號就取前 3 個字。完整名稱放在 title 裡。 */
function shortAssignment(a){
  var s = String(a==null?'':a).trim();
  var m = /^\d+/.exec(s);
  return m ? m[0] : s.slice(0, 3);
}
function normAssignment(a){ var s = String(a==null?'':a).trim(); if(s!=='' && !isNaN(Number(s))) return String(Number(s)); return s; }
/** 判斷某份作業目前有沒有開放姓名，邏輯跟後端 Code.gs 的 isNamesRevealedFor 一致（含舊版設定相容）。 */
/** 依 normAssignment 比對從 { 作業名稱: 文字 } 這種對照表裡找值，跟 isNamesRevealedFor 用同一套比對邏輯。 */
function textMapLookup(map, a){
  if(!map || typeof map!=='object') return '';
  var target = normAssignment(a);
  for(var k in map){ if(map.hasOwnProperty(k) && normAssignment(k)===target) return map[k]||''; }
  return '';
}
function isNamesRevealedFor(cfg, a){
  var map = cfg.namesRevealedByAssignment;
  if(map && typeof map==='object'){
    var target = normAssignment(a);
    for(var k in map){ if(map.hasOwnProperty(k) && normAssignment(k)===target) return !!map[k]; }
    return false;
  }
  return !!cfg.namesRevealed;
}
function safeUrl(u){
  u = String(u||'').trim();
  if(/^https?:\/\//i.test(u)) return u;
  return '';
}
function toEmbed(u){
  u = safeUrl(u);
  if(!u) return null;
  if(/\/thumbnail\?/i.test(u) || /[?&]export=view/i.test(u) || /\.(png|jpe?g|gif|webp|avif)(\?[^\s]*)?$/i.test(u)) return { kind:'image', src:u };
  var m = u.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || u.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if(m) return { kind:'drive', src:'https://drive.google.com/file/d/'+m[1]+'/preview' };
  return { kind:'link', src:u };
}
/**
 * 自己上傳的圖片存的是 Google 的縮圖服務網址（.../thumbnail?id=...&sz=w1600），
 * 縮圖尺寸是網址參數，可以直接改。同一張圖在小格子（作品牆格狀縮圖、總表小圖）
 * 用小尺寸、在投影/燈箱放大看用大尺寸，瀏覽器才不用每張都下載滿版的 1600px圖——
 * 學生自己貼的外部圖片網址就沒有這個參數可以改，原樣輸出。
 */
function driveThumbSrc(url, size){
  if(!url || !/\/thumbnail\?/i.test(url)) return url;
  if(/[?&]sz=/i.test(url)) return url.replace(/([?&]sz=)[^&]*/i, '$1w'+size);
  return url + (url.indexOf('?')>=0 ? '&' : '?') + 'sz=w'+size;
}

// 登入 token：登入成功後伺服器發的，綁定座號，換座號就失效。用班級名單登入的情況下，沒有 token 就視為還沒登入。
function getToken(){

  if(!t) return '';
  return localStorage.getItem(sk('crit.tokenSeat'))===normSeat(getMySeat()) ? t : '';
}

var accountsSupported = true; // 後端還沒更新到有密碼功能的版本時會變 false，退回不用密碼的舊流程
function authRequired(){ return accountsSupported && rosterReady(); } // 有班級名單的時候才要求登入密碼；沒名單（或名單載入失敗）退回舊的自己打姓名
function hasIdentity(){ return !!(getMySeat() && getMyName()) && (!authRequired() || !!getToken()); }

// 密碼（身分證字號）：全形轉半形、去空白、英文一律大寫，所以大小寫、全半形都不影響；
// 在這支手機上先轉成 SHA-256 亂碼才送出，伺服器和試算表都看不到原文。
function normalizePassword(p){ return toHalfWidth(p).replace(/\s+/g,'').toUpperCase(); }
function sha256Hex(str){
  if(!(window.crypto && window.crypto.subtle)) return Promise.reject(new Error('這個瀏覽器不支援安全的密碼處理，請改用最新版的 Chrome 或 Safari，並確認網址是 https 開頭。'));
  return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  });
}
function pwHashFor(seat, pw){ return sha256Hex('crit-v1|'+normSeat(seat)+'|'+normalizePassword(pw)); }

var TEACHER_AUTH_HOURS = 12;
function teacherAuthPasscode(){
  var s = sessionStorage.getItem(sk('crit.teacherAuth'));
  if(s) return s;
  try{
    var saved = JSON.parse(localStorage.getItem(sk('crit.teacherAuthSaved')) || 'null');
    if(saved && saved.p && Date.now() - saved.t < TEACHER_AUTH_HOURS * 3600000){
      sessionStorage.setItem(sk('crit.teacherAuth'), saved.p);
      return saved.p;
    }
  }catch(e){}
  return '';
}
function setTeacherAuthPasscode(p){
  sessionStorage.setItem(sk('crit.teacherAuth'), p);
  try{ localStorage.setItem(sk('crit.teacherAuthSaved'), JSON.stringify({ p:p, t:Date.now() })); }catch(e){}
}

}

// 注意：讀取跟一般寫入動作都刻意用 GET 呼叫（把資料放進網址參數）。
// 瀏覽器對 Google Apps Script 的 POST 有已知的重新導向/跨網域問題，
// 會讓 fetch() 出現「Failed to fetch」，改用 GET 就不會遇到。
function apiGet(action, payload){
  // 這台裝置還沒設定資料庫網址就不要送出請求：網址是空的時候 Safari 會丟出看不懂的
  // 「The string did not match the expected pattern」，改成直接告訴使用者該怎麼做。
  if(!apiUrl) return Promise.reject(new Error('這台裝置還沒連接資料庫。請先到頁面最下面的「連接設定」貼上資料庫網址，或用老師給的學生連結重新開啟。'));
  // 學生端動作（帶 studentNorm / reviewerNorm 的）自動附上登入 token；
  // 老師已經解鎖教師專區的話也附上密語，方便老師用「快速切換身分」測試。
  if(payload && (payload.studentNorm || payload.reviewerNorm)){
    var tk = getToken();
    if(tk) payload.token = tk;
    var tp = teacherAuthPasscode();
    if(tp) payload.teacherPass = tp;
  }
  var qs = 'action=' + encodeURIComponent(action || 'home');
  if(clsId) qs += '&cls=' + encodeURIComponent(clsId);
  if(payload) qs += '&payload=' + encodeURIComponent(JSON.stringify(payload));
  return fetch(apiUrl + '?' + qs, { method:'GET' }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(json){
    if(json && json.ok===false && json.error==='no_such_class') throw new Error('找不到這個班級（連結可能打錯了，請向老師確認）');
    if(json && json.ok===false && json.error==='auth'){
      handleAuthFailure();
      throw new Error('請重新登入');
    }
    if(json && Array.isArray(json.assignments) && json.assignments.length) assignmentsList = json.assignments;
    return json;
  });
}
/** 伺服器說「這個座號設過密碼，你的 token 不對或過期了」：清掉 token，畫面會自動回到登入。 */

  clearToken();
  loginStep = null;
  setToast('error', '請重新登入（輸入密碼）。');

}
// 只用在「上傳圖片」：資料量太大塞不進網址，用 fetch 的 no-cors POST
// 在 Apps Script 的重新導向機制上會整個卡住，改用最老牌的做法——
// 用一個隱藏表單直接送出到隱藏的 iframe，這跟直接在網址列打開網址
// 一樣不受跨網域限制，缺點是讀不到回應內容。不等 iframe 的 load
// 事件（那個訊號不準，常常要等很久甚至不觸發），送出後就馬上開始
// 用 apiGet 輪詢確認資料有沒有真的存進去，靠輪詢的重試機制來處理時間差。
function postFormNoRead(action, payload, freshTarget){
  var form = document.createElement('form');
  form.method = 'POST';
  form.action = apiUrl;
  form.target = 'uploadTarget';
  if(freshTarget){
    var fr = document.createElement('iframe');
    fr.name = 'uploadTarget_' + Date.now(); fr.style.display = 'none';
    document.body.appendChild(fr);
    form.target = fr.name;
    setTimeout(function(){ if(fr.parentNode) fr.parentNode.removeChild(fr); }, 180000);
  }
  form.style.display = 'none';
  function addField(name, value){
    var inp = document.createElement('input');
    inp.type = 'hidden'; inp.name = name; inp.value = value;
    form.appendChild(inp);
  }
  addField('action', action);
  if(clsId) addField('cls', clsId);
  addField('payload', JSON.stringify(payload));
  document.body.appendChild(form);
  form.submit();
  setTimeout(function(){ if(form.parentNode) form.parentNode.removeChild(form); }, 1000);
}

// 字串雜湊（cyrb53）：用在「同一個人重複交一模一樣的圖」的比對，以及快取資料的 key，不是用來防駭。
function hashString(str){
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(var i=0, ch; i<str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36);
}

// ---------- 載入優先順序 + 背景悄悄預載 ----------
// 「交作品」和「評分」是最重要的功能，一律最優先：
// 1. 一打開網頁，先載入交作品需要的東西（作業清單、自己交過的作品），
//    器材進度條、作品牆資料、圖片預載這些「錦上添花」的東西全部排在後面。
// 2. 學生人在交作品頁或評分頁、而且它們正在等回應（載入中、上傳中、送出評分中）的時候，
//    所有背景請求（預載、器材輪詢、作品牆預抓）一律暫停或往後延，不跟它們搶頻寬。
var criticalState = { home:false, subs:false, fired:false, queue:[] };
function isPriorityBusy(){
  if(submittingWork) return true;
  var role = getRole();
  if(role==='review') return (!!reviewAssignment && reviewView===null) || loading;
  if(role==='submit') return mySubs===null || loading;
  return false;
}
function runBackground(fn, tries){
  tries = tries || 0;
  if(isPriorityBusy() && tries < 10){ setTimeout(function(){ runBackground(fn, tries+1); }, 800); return; }
  try{ fn(); }catch(e){}
}
function flushAfterCritical(){
  if(criticalState.fired) return;
  criticalState.fired = true;
  var q = criticalState.queue; criticalState.queue = [];
  q.forEach(function(fn){ runBackground(fn); });
  scheduleBackgroundPreload();
}
function markCritical(k){ criticalState[k] = true; if(criticalState.home && criticalState.subs) flushAfterCritical(); }
function afterCritical(fn){ if(criticalState.fired) fn(); else criticalState.queue.push(fn); }

var GRID_THUMB_SIZE = 400;
var PRELOAD_THUMB_BUDGET = 90; // 縮圖預載整個使用期間最多幾張，避免吃光手機記憶體／流量
var preloadedUrls = {};
var preloadThumbCount = 0;
var preloadScheduled = false;
var lastGalleryPrefetch = 0;
// ownTask=true：這張圖就是「目前這個優先功能自己」要用的（例如評分頁的下一件），不受「優先功能忙碌中不預載」限制。
function canPreload(ownTask){
  if(document.hidden || submittingWork) return false;
  if(!ownTask){
    var role = getRole();
    if(!criticalState.fired || role==='submit' || role==='review' || isPriorityBusy()) return false;
  }
  var c = navigator.connection;
  if(c && (c.saveData || /(^|-)2g$/.test(c.effectiveType||''))) return false; // 省流量模式、很慢的網路就不偷載
  return true;
}
function preloadImages(urls, isThumb, ownTask){
  if(!canPreload(ownTask)) return;
  urls.forEach(function(u){
    if(!u || preloadedUrls[u]) return;
    if(isThumb){ if(preloadThumbCount >= PRELOAD_THUMB_BUDGET) return; preloadThumbCount++; }
    preloadedUrls[u] = 1;
    var img = new Image(); img.decoding = 'async'; img.src = u; // 不留參照，圖進瀏覽器快取後就能被回收，不佔記憶體
  });
}
function whenIdle(fn){
  if(window.requestIdleCallback) window.requestIdleCallback(fn, { timeout:3000 });
  else setTimeout(fn, 500);
}
function gridThumbUrl(r){
  var e = toEmbed(r.driveLink);
  return (e && e.kind==='image') ? driveThumbSrc(e.src, GRID_THUMB_SIZE) : null;
}
function scheduleBackgroundPreload(){
  if(preloadScheduled || !canPreload()) return;
  preloadScheduled = true;
  whenIdle(function(){
    preloadScheduled = false;
    try{ runBackgroundPreload(); }catch(e){}
  });
}
function runBackgroundPreload(){
  if(!canPreload(false)) return;
  var role = getRole();
  if(slideshowIndex != null && galleryData){
    // 展示播放：把接下來兩張的大圖先載好，換張的時候不會空白等待
    var rows = sortedGalleryRows();
    if(rows.length > 1){
      var urls = [];
      [1,2].forEach(function(k){
        var r = rows[(((slideshowIndex+k) % rows.length) + rows.length) % rows.length];
        var e = toEmbed(r.driveLink);
        if(e && e.kind==='image') urls.push(e.src);
      });
      preloadImages(urls, false);
    }
    return;
  }
  if(role==='gallery' && galleryData && galleryViewMode==='grid'){
    // 作品牆：把「載入更多」按下去會出現的下一批縮圖先載好
    var all = sortedGalleryRows();
    var from = Math.min(galleryVisibleCount, all.length);
    preloadImages(all.slice(from, from+GALLERY_PAGE_SIZE).map(gridThumbUrl), true);
    return;
  }
  if(role==='home' && apiUrl && Date.now()-lastGalleryPrefetch > 60000){
    // 人在首頁的時候，悄悄把作品牆資料和最上面幾張縮圖先抓好，點進作品牆就是秒開
    lastGalleryPrefetch = Date.now();
    apiGet('gallery').then(function(res){
      galleryData = res;
      swrSave('gallery2', res);
      preloadImages(sortedGalleryRows().slice(0, 8).map(gridThumbUrl), true);
    }).catch(function(){});
  }
}

// ---------- 圖片壓縮（避免整張原始照片直接傳給 Apps Script）----------
function resizeImageFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, RESIZE_MAX_DIM / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl = canvas.toDataURL('image/jpeg', RESIZE_QUALITY);
        resolve(dataUrl);
      };
      img.onerror = function(){ reject(new Error('圖片讀取失敗')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('檔案讀取失敗')); };
    reader.readAsDataURL(file);
  });
}

var rosterFailed = false; // 名單載入失敗（例如沒網路）時，退回讓學生自己打姓名，不能卡死在登入畫面
var loginStep = null;     // 輸入完座號、確認姓名之後的密碼步驟：{ rawSeat, seat, name, mode:'login'|'register', error }
function rosterMembers(){
  var out = [];
  if(equipmentData && equipmentData.groups){
    equipmentData.groups.forEach(function(g){
      (g.members||[]).forEach(function(m){ if(m && String(m.seat==null?'':m.seat).trim()) out.push(m); });
    });
  }
  return out;
}
function rosterReady(){ return rosterMembers().length > 0; }
function rosterLookup(seatInput){
  var want = normSeat(seatInput);
  if(!want) return null;
  var ms = rosterMembers();
  for(var i=0;i<ms.length;i++) if(normSeat(ms[i].seat)===want) return ms[i];
  return null;
}

  var pass = teacherAuthPasscode();

    if(res && res.error==='unknown_action'){ alert('後端 Code.gs 還沒更新到支援測試帳號的版本，請先重新部署。'); return; }
    if(!res.ok){ clearTeacherAuth(); alert('教師密語不對。'); return; }

/**

 */

    '<div class="card">' +

      '<p class="hint" style="margin-top:4px">這個面板只存在你這台裝置的瀏覽器，其他學生自己的手機/電腦不會看到；只是你自己測試完忘了關，才會在切回學生身分時還看得到。按「隱藏」或去「教師專區」關掉開關都可以。</p>' +

            }).join('') +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>'
  );
}

/**
 * 「交作品」頁最上面的作業要求說明：可以切換不同作業看各自的要求文字
 * （文字內容由老師在教師設定裡填寫），下面附一個「交作品」按鈕直接打開這份作業的繳交表單，
 * 不用自己再選一次。如果已經打開某份作業的表單，說明就跟著那份作業走。

function homeAssignmentDescriptionHtml(){
  if(!homeStats || !homeStats.assignments || !homeStats.assignments.length) return '';
  var assignments = homeStats.assignments;
  var stillValid = homeDescAssignment!=null && assignments.some(function(a){ return normAssignment(a)===normAssignment(homeDescAssignment); });
  if(!stillValid) homeDescAssignment = assignments[0];
  if(submitTargetAssignment && assignments.some(function(a){ return normAssignment(a)===normAssignment(submitTargetAssignment); })) homeDescAssignment = submitTargetAssignment;
  var current = homeDescAssignment;
  var formOpenForCurrent = submitTargetAssignment!=null && normAssignment(submitTargetAssignment)===normAssignment(current);
  var chips = assignments.map(function(a){
    var active = normAssignment(a)===normAssignment(current);
    return '<button type="button" class="assignment-chip'+(active?' assignment-chip-active':'')+'" data-home-desc-assignment="'+escapeAttr(a)+'">'+escapeHtml(a)+'</button>';
  }).join('');
  var descText = textMapLookup(homeStats.assignmentDescriptions, current);
  var descHtml = descText ? escapeHtml(descText).replace(/\n/g,'<br>') : '<span class="hint">老師還沒填寫這份作業的要求說明。</span>';
  return (
    '<div class="card">' +
      '<p class="hint">作業要求說明</p>' +
      '<div class="assignment-chip-scroll">'+chips+'</div>' +
      '<p style="margin-top:10px;line-height:1.7">'+descHtml+'</p>' +
      (formOpenForCurrent ? '' : '<button type="button" class="btn btn-primary" data-home-desc-submit="'+escapeAttr(current)+'" style="width:100%;margin-top:10px">交作品</button>') +
    '</div>'
  );
}
function honorsNameOf(w){ return (w.seat ? w.seat+'號 ' : '') + (w.name || ''); }
function honorsImgHtml(link, extraClass){
  var embed = toEmbed(link);
  if(embed && embed.kind==='image') return '<img class="podium-img thumb-zoomable '+(extraClass||'')+'" data-full="'+escapeAttr(embed.src)+'" src="'+escapeAttr(driveThumbSrc(embed.src,300))+'" alt="">';
  return '<div class="podium-img '+(extraClass||'')+'">🖼️</div>';
}
function honorsItemById(a){
  if(!honors || !honors.items) return null;
  for(var i=0;i<honors.items.length;i++) if(normAssignment(honors.items[i].assignment)===normAssignment(a)) return honors.items[i];
  return null;
}
/**
 * 首頁榮譽榜：選一份作業，已公布的顯示頒獎台（第 2、1、3 名由左到右，冠軍最高、有獎牌彈出動畫）＋人氣獎；
 * 還沒公布的顯示「封印中」的神祕頒獎台和解鎖進度條（還差幾位同學評完），讓大家有動力趕快評分。
 */
function honorsHtml(){
  if(!honors || !honors.items || !honors.items.length) return '';
  var items = honors.items;
  var valid = honorsAssignment!=null && items.some(function(it){ return normAssignment(it.assignment)===normAssignment(honorsAssignment); });
  if(!valid){
    var unlockedItems = items.filter(function(it){ return it.unlocked; });
    honorsAssignment = (unlockedItems.length ? unlockedItems[unlockedItems.length-1] : items[items.length-1]).assignment;
  }
  var cur = honorsItemById(honorsAssignment);
  var chips = items.map(function(it){
    var active = normAssignment(it.assignment)===normAssignment(honorsAssignment);
    return '<button type="button" class="assignment-chip'+(active?' assignment-chip-active':'')+'" data-honors-assignment="'+escapeAttr(it.assignment)+'">'+(it.unlocked?'🏆 ':'🔒 ')+escapeHtml(it.assignment)+'</button>';
  }).join('');
  var body;
  var MEDALS = { 1:'🥇', 2:'🥈', 3:'🥉' };
  function tag(w){ return w.awarded ? '<span class="award-tag" title="已登記榮譽榜加分">＋0.5</span>' : ''; }
  if(!cur.unlocked){
    var need = Math.max(0, (cur.need||0) - (cur.have||0));
    var pct = cur.need ? Math.min(100, Math.round(cur.have / cur.need * 100)) : 0;
    var mysteryCol = function(rank){
      return '<div class="podium-col podium-r'+rank+' podium-mystery"><div class="podium-medal">'+MEDALS[rank]+'</div><div class="podium-img">？</div><div class="podium-name">？？？</div><div class="podium-base">'+rank+'</div></div>';
    };
    body = '<div class="honors-lock">' +
      '<div class="podium">'+mysteryCol(2)+mysteryCol(1)+mysteryCol(3)+'</div>' +
      '<p style="margin:10px 0 0;font-weight:700">🎁 榜單還在封印中！</p>' +
      '<p class="hint" style="margin:4px 0">再有 <strong>'+need+'</strong> 位同學各評滿 '+(honors.revealMinReviews||5)+' 件，這份作業的前三名和人氣獎就揭曉</p>' +
      '<div class="honors-progress"><span style="width:'+pct+'%"></span></div>' +
      '<p class="hint" style="margin:0">解鎖進度 '+(cur.have||0)+' / '+(cur.need||0)+' 位</p>' +
    '</div>';
  } else {
    var top = cur.top || [];
    var isPodium = top.length===3 && top[0].rank===1 && top[1].rank===2 && top[2].rank===3;
    var topHtml;
    if(isPodium){
      var col = function(w){
        return '<div class="podium-col podium-r'+w.rank+'"><div class="podium-medal">'+MEDALS[w.rank]+'</div>' + honorsImgHtml(w.driveLink) +
          '<div class="podium-name">'+escapeHtml(honorsNameOf(w))+tag(w)+'</div><div class="podium-score">'+w.score.toFixed(2)+'</div>' +
          '<div class="podium-base">'+w.rank+'</div></div>';
      };
      topHtml = '<div class="podium">'+col(top[1])+col(top[0])+col(top[2])+'</div>';
    } else {
      topHtml = top.map(function(w){
        return '<div class="honors-row"><span class="honors-row-medal">'+MEDALS[w.rank]+'</span>' + honorsImgHtml(w.driveLink) +
          '<div><div class="podium-name">'+escapeHtml(honorsNameOf(w))+tag(w)+'</div><div class="podium-score">第 '+w.rank+' 名 · '+w.score.toFixed(2)+'</div></div></div>';
      }).join('') || '<p class="hint">這份作業還沒有作品有分數。</p>';
    }
    var pop = cur.popular
      ? '<div class="popular">' + honorsImgHtml(cur.popular.driveLink) +
          '<div><div class="popular-badge">🔥 人氣獎</div><div class="podium-name">'+escapeHtml(honorsNameOf(cur.popular))+tag(cur.popular)+'</div>' +
          '<div class="hint" style="margin:2px 0 0">「'+escapeHtml(cur.popular.label)+'」平均最高 '+cur.popular.score.toFixed(2)+'</div></div></div>'
      : '';
    body = topHtml + pop;
  }
  return (
    '<div class="card honors">' +
      '<p class="honors-title">🏆 榮譽榜</p>' +
      '<div class="assignment-chip-scroll" style="margin:0 -14px 4px">'+chips+'</div>' +
      body +
    '</div>'
  );
}
function loadHonors(){
  if(!apiUrl) return;
  if(!honors) honors = swrLoad('honors1');
  apiGet('honors').then(function(res){
    if(!res || !res.ok || !Array.isArray(res.items)) return;
    honors = res; swrSave('honors1', res);
    var role = getRole();
    if(role==='home' || role==='teacher') render();
  }).catch(function(){});
}
/**
 * 教師總表上方：登記榮譽榜加分。每份已公布的作業一列，列出目前榜上的得獎作者，
 * 確認後按「登記」→ 每位得獎作者額外加 0.5 分總分，並記錄到試算表「榮譽榜加分」分頁。
 */
function teacherAwardsCardHtml(){
  if(!teacherView || !teacherView.config) return '';
  var items = (honors && honors.items) ? honors.items.filter(function(it){ return it.unlocked; }) : [];
  var awards = teacherView.config.awardsByWork || {};
  var rows = items.map(function(it){
    var registered = Object.keys(awards).filter(function(c){ return normAssignment(awards[c].assignment)===normAssignment(it.assignment); });
    var names = (it.top||[]).map(function(w){ return w.rank<=3 ? ({1:'🥇',2:'🥈',3:'🥉'})[w.rank]+honorsNameOf(w) : ''; });
    if(it.popular) names.push('🔥'+honorsNameOf(it.popular));
    return '<div style="margin:10px 0;padding-top:8px;border-top:1px solid var(--line)">' +
      '<strong>'+escapeHtml(it.assignment)+'</strong>' +
      (registered.length ? ' <span class="award-tag">已登記 '+registered.length+' 位</span>' : ' <span class="hint">尚未登記</span>') +
      '<p class="hint" style="margin:4px 0 8px">'+escapeHtml(names.join('　'))+'</p>' +
      '<div class="cta-row">' +
        '<button type="button" class="btn btn-accent" data-award-register="'+escapeAttr(it.assignment)+'">'+(registered.length?'重新登記':'登記榮譽榜加分')+'</button>' +
        (registered.length ? '<button type="button" class="btn btn-accent" data-award-undo="'+escapeAttr(it.assignment)+'">取消登記</button>' : '') +
      '</div></div>';
  }).join('');
  return '<div class="card"><h2 class="screen-title" style="font-size:1rem">🏆 榮譽榜加分</h2>' +
    '<p class="hint">每份作業的前三名和人氣獎作者，每人額外加 0.5 分總分。榜單會隨評分變動，確定名單後按「登記」，會記錄到試算表「榮譽榜加分」分頁；加分另外計算，不會改變作品牆的總平均和名次。</p>' +
    (rows || '<p class="hint">目前還沒有作業公布榮譽榜（要等評完的同學達到門檻）。</p>') + '</div>';
}
function handleRegisterAwards(assignment, undo){
  var pass = teacherAuthPasscode();
  if(!pass){ alert('教師密語已失效，請重新登入教師專區。'); return; }
  function failText(res){
    if(res && res.error==='not_unlocked') return '這份作業還沒公布榮譽榜，不能登記。';
    if(res && res.error==='unauthorized') return '教師密語不對。';
    return '伺服器沒有處理成功（請確認 Code.gs 已經重新部署最新版）。';
  }
  var base = { passcode: pass, assignment: assignment, undo: !!undo };
  apiGet('teacherRegisterAwards', Object.assign({ dryRun: true }, base)).then(function(res){
    if(!res || !res.ok){ alert(failText(res)); return; }
    var lines = (res.winners||[]).map(function(w){ return w.kind+'　'+honorsNameOf(w); }).join('\n');
    var msg = undo
      ? '要取消「'+assignment+'」已登記的榮譽榜加分嗎？\n\n目前已登記：\n' + (res.previous||[]).map(function(w){ return w.kind+'　'+honorsNameOf(w); }).join('\n')
      : '要登記「'+assignment+'」的榮譽榜嗎？以下每位作者額外加 0.5 分總分：\n\n' + lines + ((res.previous||[]).length ? '\n\n（之前登記的 '+res.previous.length+' 位會先取消，再登記上面這份名單）' : '');
    if(!confirm(msg)) return;
    return apiGet('teacherRegisterAwards', base).then(function(done){
      if(!done || !done.ok){ alert(failText(done)); return; }
      alert(undo ? '已取消登記。' : '已登記 '+done.winners.length+' 位得獎作者，每人加 0.5 分。可以到試算表「榮譽榜加分」分頁查看。');
      return apiGet('teacherFetch', { passcode: pass }).then(function(t){ if(t && t.ok){ teacherView = t; } loadHonors(); render(); });
    });
  }).catch(function(e){ alert('操作沒有成功：'+e.message); });
}
/** 連不上資料庫時，依照這支裝置的實際狀況說明可能的原因（不用猜）。 */

  if(!storageWorks()) bits.push('<strong>這個瀏覽器目前不允許網頁儲存資料</strong>（常見原因：「無痕／私密瀏覽」，或封鎖了網站資料），所以記不住資料庫網址和登入狀態。請改用<strong>一般模式</strong>的 Safari 或 Chrome 打開學生連結；iPhone 也可以到「設定 → Safari」確認沒有開「阻擋所有 Cookie」。');
  if(isStandalone()) bits.push('<strong>你現在是從「主畫面圖示」開啟的</strong>，這種模式的資料和一般瀏覽器是分開的：直接在首頁的「連接資料庫」貼上老師給的學生連結，按「連線」就好（只要做一次）；或把主畫面圖示刪掉，先在 Safari 用學生連結開啟，再重新「加入主畫面」。');

function checklistHtml(){
  if(mySubs === null) return '';
  var byAssignment = {};
  mySubs.forEach(function(s){ var a = normAssignment(s.assignment); (byAssignment[a] = byAssignment[a] || []).push(s); });
  var rows = (assignmentsList.length ? assignmentsList : ['']).map(function(a){
    var subsForA = byAssignment[normAssignment(a)] || [];
    var isOpen = submitTargetAssignment!=null && normAssignment(submitTargetAssignment)===normAssignment(a);
    var summaryThumb, summaryStatus;
    if(subsForA.length){
      var firstEmbed = toEmbed(subsForA[0].driveLink);
      summaryThumb = firstEmbed && firstEmbed.kind==='image' ? '<img class="mine-thumb" src="'+escapeAttr(firstEmbed.src)+'" alt="">' : '<span class="mine-thumb mine-thumb-empty"></span>';
      summaryStatus = '<span class="code">已交 '+subsForA.length+' 件</span>（點這裡可以再交一件）';
    } else {
      summaryThumb = '<span class="mine-thumb mine-thumb-empty"></span>';
      summaryStatus = '<span class="hint">尚未交（點這裡繳交）</span>';
    }
    // 縮圖、作業名稱、已交/未交狀態這一整排都可以點，點下去會在下面展開交作品的表單，
    // 預設會帶入這個作業，但表單裡還是可以改選別的作業。
    var summaryRow = '<li class="mine-item mine-item-clickable'+(isOpen?' mine-item-active':'')+'" data-open-assignment="'+escapeAttr(a)+'">' + summaryThumb +
      '<span class="mine-info">'+escapeHtml(a||'（未分類）')+'：'+summaryStatus+'</span>' +
    '</li>';
    var detailRows = subsForA.map(function(s){
      var embed = toEmbed(s.driveLink);
      var thumb = embed && embed.kind==='image' ? '<img class="mine-thumb thumb-zoomable" data-full="'+escapeAttr(embed.src)+'" src="'+escapeAttr(driveThumbSrc(embed.src,100))+'" alt="">' : '<span class="mine-thumb mine-thumb-empty"></span>';
      return '<li class="mine-item mine-item-detail">' + thumb +
        (s.returned
          ? '<span class="mine-info"><span class="mine-returned">老師已退回這件作品</span><br>原因：'+escapeHtml(s.returned.reason||'')+'<br><span class="hint">請重新交一件自己的作品。</span></span>'
          : '<span class="mine-info">'+escapeHtml(s.title||'')+'</span>' +
            '<button type="button" class="mine-del" data-del="'+escapeAttr(s.id)+'">刪除</button>') +
      '</li>';
    }).join('');
    return summaryRow + detailRows;
  }).join('');
  return (

/** 這位評分者在某份作業已經評了幾件，配合 myReviewProgress 資料查（還沒載入就回傳 null）。 */
function myProgressFor(a){
  if(!myReviewProgress || !myReviewProgress.progress) return null;

function sortedGalleryRows(){
  if(!galleryData) return [];
  var key = gallerySort;
  function val(r){ return key==='overall' ? r.overall : r.perCrit[key]; }
  var rows = galleryData.rows.slice();
  if(galleryAssignment) rows = rows.filter(function(r){ return normAssignment(r.assignment)===normAssignment(galleryAssignment); });
  rows.sort(function(a,b){
    var av = val(a), bv = val(b);
    av = av==null ? -1 : av; bv = bv==null ? -1 : bv;
    return bv - av;
  });
  return rows;
}
// 作品牆的作業底色故意跟器材輪值那組彩色色盤完全分開，用無彩色的灰階——
// 兩邊都用彩色的話，看到顏色會下意識想比對「這是不是器材輪值的哪一色」，
// 容易搞混成兩件事。深淺特意拉開間距，確保鄰近的作業還是分得出來。
var GALLERY_GRAYS = ['#2E2E2E','#4A4A4A','#666666','#828282','#9E9E9E','#BABABA','#585858','#A8A8A8'];
var GALLERY_GRAY_TEXT = ['#fff','#fff','#fff','#fff','#1a1a1a','#1a1a1a','#fff','#1a1a1a'];
function galleryAssignmentIndexFor(assignments, a){
  // 一定要用 normAssignment 比對，不能直接 indexOf——作業名稱如果是「01」這種
  // 看起來像數字的文字，試算表會把它存成數字 1，直接比對永遠對不起來，
  // 結果每一列都會落到「找不到、預設用第一色」，變成畫面上全部作品都同一個顏色
  // （跟之前作業繳交狀況、輪值順序踩到的是同一種問題）。
  var target = normAssignment(a);
  var idx = -1;
  (assignments||[]).forEach(function(x, i){ if(idx<0 && normAssignment(x)===target) idx = i; });
  return idx < 0 ? 0 : idx;
}
/** 依作業在清單裡的位置，從灰階色盤挑一個固定顏色，讓同一份作業在整個作品牆裡顏色都一樣。 */
function assignmentColorFor(assignments, a){
  var idx = galleryAssignmentIndexFor(assignments, a);
  return GALLERY_GRAYS[idx % GALLERY_GRAYS.length];
}
/** 跟 assignmentColorFor 的底色配對用的文字顏色，確保淺灰底配深字、深灰底配白字。 */
function assignmentTextColorFor(assignments, a){
  var idx = galleryAssignmentIndexFor(assignments, a);
  return GALLERY_GRAY_TEXT[idx % GALLERY_GRAY_TEXT.length];
}
/**
 * 投影時用的雷達圖，一題一軸，SVG 畫的，字體大小跟著 slideFontScale 一起放大，
 * 確保坐最後一排的人也看得清楚。分數用滿分 5 分當作最外圈。
 */
function radarChartSvg(criteria, perCrit, size, fontScale){
  var n = criteria.length;
  if(!n) return '';
  var cx = size/2, cy = size/2, r = size*0.34, maxVal = 5;
  function pointFor(i, val){
    var angle = (Math.PI*2*i/n) - Math.PI/2;
    var rad = r * (Math.max(0,val)/maxVal);
    return [cx + rad*Math.cos(angle), cy + rad*Math.sin(angle)];
  }
  var rings = [1,2,3,4,5].map(function(level){
    var pts = criteria.map(function(c,i){ return pointFor(i, level).join(','); }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>';
  }).join('');
  var axes = criteria.map(function(c,i){
    var p = pointFor(i, maxVal);
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>';
  }).join('');
  var dataPts = criteria.map(function(c,i){ return pointFor(i, perCrit[c.key]==null?0:perCrit[c.key]).join(','); }).join(' ');
  var dots = criteria.map(function(c,i){
    if(perCrit[c.key]==null) return '';
    var p = pointFor(i, perCrit[c.key]);
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(4*fontScale)+'" fill="#7FC2CF"/>';
  }).join('');
  var labelR = r * 1.3;
  var labels = criteria.map(function(c,i){
    var angle = (Math.PI*2*i/n) - Math.PI/2;
    var lx = cx + labelR*Math.cos(angle), ly = cy + labelR*Math.sin(angle);
    var cosA = Math.cos(angle);
    var anchor = Math.abs(cosA)<0.3 ? 'middle' : (cosA>0?'start':'end');
    return '<text x="'+lx+'" y="'+ly+'" fill="#fff" font-size="'+(size*0.05*fontScale)+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+escapeHtml(c.label)+'</text>';
  }).join('');
  // 左右兩側的題目文字（例如「曝光平衡」）會伸出圓形範圍外，畫布左右要多留邊，不然窄的版面
  // （手機橫放、雷達圖區塊很窄）會把字切掉；留多少跟字級放大倍數成正比。
  var margin = Math.round(46 + 22*fontScale);
  return '<svg viewBox="'+(-margin)+' 0 '+(size+2*margin)+' '+size+'" width="100%" height="100%">' +
    rings + axes +
    '<polygon points="'+dataPts+'" fill="rgba(127,194,207,0.35)" stroke="#7FC2CF" stroke-width="'+(2.5*fontScale)+'"/>' +
    dots + labels +
  '</svg>';
}
function getSlideFontScale(){ return parseFloat(localStorage.getItem('crit.slideFontScale')) || 1; }
function handleSlideFontScale(delta){
  var next = Math.max(0.6, Math.min(2.5, Math.round((getSlideFontScale()+delta)*10)/10));
  localStorage.setItem('crit.slideFontScale', next);
  if(slideshowIndex != null) renderSlideshowOnly(); else render();
}
function galleryMetaHtml(r, scoreVal){
  var bits = [];
  if(galleryShowNames && r.studentName) bits.push('<span class="gallery-name">'+escapeHtml(r.studentSeat)+'號 '+escapeHtml(r.studentName)+'</span>');
  if(galleryShowScores) bits.push('<span class="gallery-score">'+(scoreVal==null?'—':scoreVal.toFixed(2))+'</span>');
  if(teacherGalleryActive && r.returned) bits.push('<span class="returned-chip" title="'+escapeAttr(r.returned.reason||'')+'">已退回</span>');
  return bits.join(' ');
}
/** grid=true 時是作品牆格狀縮圖，故意要小張一點；投影/單張顯示（grid 沒帶或 false）就要原本的大尺寸。 */
function galleryImageHtml(r, grid){
  var embed = toEmbed(r.driveLink);
  if(embed && embed.kind==='image'){
    var src = grid ? driveThumbSrc(embed.src, GRID_THUMB_SIZE) : embed.src;
    return '<img src="'+escapeAttr(src)+'" loading="lazy" alt="">';
  }
  if(embed && embed.kind==='drive') return '<iframe src="'+escapeAttr(embed.src)+'" loading="lazy"></iframe>';
  return '<p class="hint" style="padding:16px">（無法預覽）</p>';
}
function screenGallery(){
  if(!galleryData){
    return '<h1 class="screen-title">作品牆</h1><p class="hint">載入中...</p>';
  }
  if(galleryAssignment===null){
    galleryAssignment = ''; // 預設顯示所有作業，不自動挑第一份
  }
  var rows = sortedGalleryRows();
  // 姓名開放是每份作業分開設定的，分數則是滿一定評分人數才自動開放——
  // 伺服器已經照每一列自己的狀況決定要不要附姓名／分數，這裡只要看「目前篩選出來的
  // 這些作品」裡有沒有任何一筆真的帶了資料，就知道這兩個開關現在有沒有意義可以打開。
  // 門檻到了也不會自動勾起來，一律預設關閉，要學生自己主動點開關才會顯示；
  // 沒東西可顯示時（門檻還沒到）則強制關閉，避免顯示一個沒意義的勾選框。
  var revealed = rows.some(function(r){ return r.studentName != null; });
  if(!revealed) galleryShowNames = false;
  var scoresRevealed = rows.some(function(r){ return r.unlocked; });
  if(!scoresRevealed) galleryShowScores = false;
  var revealRuleText = '要有 '+galleryData.revealMinReviewers+' 位同學各評完 '+galleryData.revealMinReviews+' 件作品';
  if(galleryAssignment){
    var doneCount = (galleryData.revealProgress||{})[normAssignment(galleryAssignment)] || 0;
    revealRuleText += '，目前 '+doneCount+' / '+galleryData.revealMinReviewers+' 位';
  }
  var assignmentOptions = '<option value="">全部作業</option>' +
    (galleryData.assignments||[]).map(function(a){ return '<option value="'+escapeAttr(a)+'"'+(galleryAssignment===a?' selected':'')+'>'+escapeHtml(a)+'</option>'; }).join('');
  var sortOptions = '<option value="overall"'+(gallerySort==='overall'?' selected':'')+'>總平均（預設）</option>' +
    galleryData.criteria.map(function(c){ return '<option value="'+escapeAttr(c.key)+'"'+(gallerySort===c.key?' selected':'')+'>'+escapeHtml(c.label)+'</option>'; }).join('');
  // data-idx 一定要對應「完整排序結果」裡的位置，不能是切片後的相對位置，
  // 不然點卡片開投影展示會抓錯作品——所以先算好全部卡片，最後才切要顯示幾張。
  var allCards = rows.map(function(r, i){
    var scoreVal = gallerySort==='overall' ? r.overall : r.perCrit[gallerySort];
    var aColor = assignmentColorFor(galleryData.assignments, r.assignment);
    var aText = assignmentTextColorFor(galleryData.assignments, r.assignment);
    return '<div class="gallery-card" data-idx="'+i+'" style="border-left-color:'+aColor+'">' +
      '<div class="gallery-img">'+galleryImageHtml(r, true)+'</div>' +
      '<div class="gallery-meta"><span class="gallery-assignment-chip" style="background:'+aColor+';color:'+aText+'">'+escapeHtml(r.assignment||'未分類')+'</span>'+galleryMetaHtml(r, scoreVal)+'</div>' +
    '</div>';
  });
  var visibleCount = Math.min(galleryVisibleCount, allCards.length);
  var cards = allCards.slice(0, visibleCount).join('');
  var moreCount = allCards.length - visibleCount;
  var bodyHtml;
  if(galleryViewMode==='table'){
    bodyHtml = galleryTableHtml(rows);
  } else {
    bodyHtml = rows.length ? (
      '<div class="gallery-grid">'+cards+'</div>' +
      (moreCount>0 ? '<button type="button" class="btn btn-accent" id="galleryLoadMore" style="width:100%;margin-top:10px">載入更多（還有 '+moreCount+' 件）</button>' : '')
    ) : '<div class="card"><p class="hint">這份作業目前還沒有作品。</p></div>';
  }
  return (
    '<h1 class="screen-title">作品牆</h1>' +
    '<div class="gallery-controls card">' +
      '<label class="field"><span>哪一份作業</span><select id="galleryAssignment">'+assignmentOptions+'</select></label>' +
      '<label class="field"><span>排序依據</span><select id="gallerySort">'+sortOptions+'</select></label>' +
      '<div class="gallery-toggles">' +
        '<label class="toggle-row"><input type="checkbox" id="toggleGalleryNames" '+(galleryShowNames?'checked':'')+(revealed?'':' disabled')+'> 顯示姓名'+(revealed?'':'（'+revealRuleText+'，或老師開放這份作業，才能開啟顯示）')+'</label>' +
        '<label class="toggle-row"><input type="checkbox" id="toggleGalleryScores" '+(galleryShowScores?'checked':'')+(scoresRevealed?'':' disabled')+'> 顯示分數／雷達圖'+(scoresRevealed?'':'（'+revealRuleText+'才會開放）')+'</label>' +
      '</div>' +
      '<button type="button" class="btn btn-primary" id="startSlideshow" '+(rows.length?'':'disabled')+'>播放展示</button>' +
    '</div>' +
    '<div class="cta-row">' +
      '<button type="button" class="btn '+(galleryViewMode==='grid'?'btn-primary':'btn-accent')+'" id="galleryModeGrid">圖片牆</button>' +
      '<button type="button" class="btn '+(galleryViewMode==='table'?'btn-primary':'btn-accent')+'" id="galleryModeTable">總表與排名</button>' +
    '</div>' +
    bodyHtml
  );
}
function galleryTableHtml(rows){
  if(!rows.length) return '<div class="card"><p class="hint">這份作業目前還沒有作品。</p></div>';
  var head = galleryData.criteria.map(function(c){ return '<th>'+escapeHtml(c.label)+'</th>'; }).join('');
  var body = rows.map(function(r, i){
    var cells = galleryData.criteria.map(function(c){
      var v = r.perCrit[c.key];
      return '<td class="num">'+(galleryShowScores ? (v==null?'—':v.toFixed(1)) : '—')+'</td>';
    }).join('');
    var embed = toEmbed(r.driveLink);
    var thumb = embed && embed.kind==='image' ? '<img class="mine-thumb thumb-zoomable" data-full="'+escapeAttr(embed.src)+'" src="'+escapeAttr(driveThumbSrc(embed.src,100))+'" alt="">' : '<span class="mine-thumb mine-thumb-empty"></span>';
    var nameCell = (galleryShowNames && r.studentName) ? escapeHtml(r.studentSeat)+'號 '+escapeHtml(r.studentName) : '—';
    return '<tr>' +
      '<td class="num">'+(i+1)+'</td>' +
      '<td>'+thumb+'</td>' +
      '<td>'+nameCell+'</td>' +
      cells +
      '<td class="num strong">'+(galleryShowScores ? (r.overall==null?'—':r.overall.toFixed(2)) : '—')+'</td>' +
      '<td class="num">'+r.count+'</td>' +
    '</tr>';
  }).join('');
  return '<div class="table-wrap card"><table class="grade-table"><thead><tr>' +
    '<th>排名</th><th>圖片</th><th>姓名</th>' + head + '<th>總平均</th><th>份數</th>' +
  '</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function slideshowHtml(){
  var rows = sortedGalleryRows();
  if(slideshowIndex==null || !rows.length) return '';
  var idx = ((slideshowIndex % rows.length) + rows.length) % rows.length;
  var r = rows[idx];
  var scoreVal = gallerySort==='overall' ? r.overall : r.perCrit[gallerySort];
  var scale = getSlideFontScale();

/**
 * 教師作品牆播放時的「評分明細」面板：這件作品每位評分者的座號姓名、各題分數、平均、和其他人的差距。
 * 差距 1.5 分以上標紅、整份同一個分數標橘（最常見的隨便按），已登記過評分異常的標紫。
 * 面板開著的時候，上一張／下一張會跟著換成新作品的明細，方便一件一件檢查。
 */
function slideReviewsPanelHtml(r){
  if(!teacherGalleryActive || !slideReviewsOpen) return '';
  var data = workReviewsCache[r.workCode];
  var head = '<div class="slide-reviews-head"><b>評分明細</b><button type="button" class="btn btn-accent" data-reviews-toggle="1">關閉</button></div>';
  if(!data){
    if(!workReviewsLoading[r.workCode]) setTimeout(function(){ loadWorkReviews(r.workCode); }, 0);
    return '<div class="slide-reviews">'+head+'<p class="rv-legend">載入中...</p></div>';
  }
  if(data.error) return '<div class="slide-reviews">'+head+'<p class="rv-legend" style="color:#ffb4ab">'+escapeHtml(data.error)+'</p></div>';
  // 有舊資料就先顯示（馬上看得到），太舊的話同時在背景更新，更新好再悄悄換
  if(Date.now() - (data._at || 0) > WORK_REVIEWS_STALE_MS && !workReviewsLoading[r.workCode]) setTimeout(function(){ loadWorkReviews(r.workCode); }, 0);
  var list = data.reviews || [];
  var rows = list.map(function(x){
    var bad = x.gap != null && Math.abs(x.gap) >= 1.5;
    var tags = '';
    if(bad) tags += '<span class="rv-tag rv-t-gap">和其他人差距大</span>';
    if(x.allSame) tags += '<span class="rv-tag rv-t-same">全部同一個分數</span>';
    if(x.flagged) tags += '<span class="rv-tag rv-t-flagged">已登記</span>';
    return '<div class="rv-row'+(bad?' rv-bad':'')+(x.allSame?' rv-same':'')+'">' +
      '<span class="rv-who">'+escapeHtml(honorsNameOf(x))+'</span>' +
      '<span class="rv-scores">'+x.scores.map(function(v){ return v==null?'–':v; }).join(' ')+'</span>' +
      '<span class="rv-mean">'+(x.mean==null?'—':x.mean.toFixed(2))+'</span>' +
      '<span class="rv-gap">'+(x.gap==null?'—':(x.gap>0?'+':'')+x.gap.toFixed(2))+'</span>' +
      (tags ? '<span class="rv-tags">'+tags+'</span>' : '') +
    '</div>';
  }).join('');
  return '<div class="slide-reviews">' + head +
    '<p class="rv-legend">共 '+list.length+' 位評分者。每列依序：座號姓名｜各題分數（'+escapeHtml((data.criteria||[]).join('、'))+'）｜他的平均｜和其他人平均的差距。差距大的排最上面。</p>' +
    (rows || '<p class="rv-legend">這件作品還沒有人評分。</p>') +
  '</div>';
}
/**
 * 打開／關閉／更新評分明細時，只換掉面板本身，不重畫整個播放視窗——
 * 整個重畫會連照片、雷達圖一起重新建立，照片會閃一下（開面板時還會因為資料載入完再閃第二次）。
 */
function updateReviewsPanelDom(){
  var ov = document.querySelector('.slideshow-overlay');
  var rows = sortedGalleryRows();
  if(!ov || !rows.length || slideshowIndex == null){ return; }
  var r = rows[((slideshowIndex % rows.length) + rows.length) % rows.length];
  var holder = document.createElement('div');
  holder.innerHTML = slideReviewsPanelHtml(r);
  var neu = holder.firstElementChild;
  var old = ov.querySelector('.slide-reviews');
  if(old && neu) old.replaceWith(neu);
  else if(old) old.remove();
  else if(neu) ov.insertBefore(neu, ov.querySelector('.slide-font-controls'));
  var tb = ov.querySelector('.slide-bonus [data-reviews-toggle]');
  if(tb) tb.textContent = slideReviewsOpen ? '關閉明細' : '評分明細';
}
function loadWorkReviews(code){
  var pass = teacherAuthPasscode();
  if(!pass || workReviewsLoading[code]) return;
  workReviewsLoading[code] = true;
  apiGet('teacherWorkReviews', { passcode: pass, workCode: code }).then(function(res){
    if(res && res.ok){ res._at = Date.now(); workReviewsCache[code] = res; }
    else if(!workReviewsCache[code] || workReviewsCache[code].error){
      workReviewsCache[code] = { error: res && res.error==='unauthorized' ? '教師密語不對。' : '讀不到評分明細（請確認 Code.gs 已經重新部署最新版）。' };
    }
  }).catch(function(e){
    if(!workReviewsCache[code] || workReviewsCache[code].error) workReviewsCache[code] = { error: '讀取失敗：' + e.message };
  }).then(function(){
    delete workReviewsLoading[code];
    if(slideshowIndex != null && slideReviewsOpen && slideCurrentWork() === code) updateReviewsPanelDom();
  });
}
/**
 * 評分明細預載：教師一進作品牆，就在背景把「全部作品」的明細一次載好（一個請求），
 * 之後播放中往下滑／按「評分明細」是直接顯示，不用等。舊版 Code.gs 沒有一次載入的動作時，退回成「預載前後兩張」。
 */
function prefetchAllWorkReviews(){
  if(!teacherGalleryActive || workReviewsAll !== 'none') return;
  var pass = teacherAuthPasscode();
  if(!pass || !apiUrl) return;
  workReviewsAll = 'loading';
  apiGet('teacherAllReviews', { passcode: pass }).then(function(res){
    if(res && res.ok && res.works){
      var now = Date.now();
      Object.keys(res.works).forEach(function(code){
        workReviewsCache[code] = { ok: true, workCode: code, criteria: res.criteria, reviews: res.works[code], _at: now };
      });
      workReviewsAll = 'done';
      if(slideshowIndex != null && slideReviewsOpen) updateReviewsPanelDom();
    } else {
      workReviewsAll = (res && res.error === 'unknown_action') ? 'unsupported' : 'none';
      if(workReviewsAll === 'unsupported') prefetchNeighborReviews();
    }
  }).catch(function(){ workReviewsAll = 'none'; });
}
/** 一次載入不能用的時候的備案：播放中順便把前後兩張的明細先載好。 */
function prefetchNeighborReviews(){
  if(!teacherGalleryActive || slideshowIndex == null || workReviewsAll !== 'unsupported') return;
  var rows = sortedGalleryRows();
  if(rows.length < 2) return;
  [1, -1, 0].forEach(function(d){
    var r = rows[(((slideshowIndex + d) % rows.length) + rows.length) % rows.length];
    if(r && !workReviewsCache[r.workCode] && !workReviewsLoading[r.workCode]) loadWorkReviews(r.workCode);
  });
}
/** 老師加分列：只在教師模式的作品牆播放時出現。0＝不加分，1~3＝加幾分，總平均最高 5 分。 */
function slideBonusHtml(r){

  var btns = [0,1,2,3].map(function(n){
    return '<button type="button" class="btn '+(cur===n?'btn-primary':'btn-accent')+'" data-bonus="'+n+'" aria-pressed="'+(cur===n)+'">'+(n===0?'無':'＋'+n)+'</button>';
  }).join('');
  var ret = r.returned
    ? '<button type="button" class="btn btn-accent" data-return="undo">撤銷退回</button>'
    : '<button type="button" class="btn btn-return" data-return="1">退回</button>';
  var flag = '<button type="button" class="btn btn-accent" data-reviews-toggle="1">'+(slideReviewsOpen?'關閉明細':'評分明細')+'</button>' +
    '<button type="button" class="btn btn-accent" data-flag="1">評分異常</button>';
  var bonusReason = (cur > 0 && r.bonusNote) ? '<div class="slide-bonus-note" style="white-space:normal">加分原因：'+escapeHtml(r.bonusNote.reason||'')+(r.bonusNote.at ? '（'+new Date(r.bonusNote.at).toLocaleDateString('zh-TW')+'）' : '')+'</div>' : '';
  return '<div class="slide-bonus"><span>老師加分</span>'+btns+ret+flag+'</div>' + bonusReason +
    (r.returned ? '<div class="slide-return-reason">退回原因：'+escapeHtml(r.returned.reason||'')+'</div>' : '');
}
/** 有加分的作品，在分數旁邊註明原本幾分、加了幾分（只有教師模式看得到）。 */
function slideBonusNoteHtml(r){
  if(!teacherGalleryActive || !(r.bonus > 0 || r.returned)) return '';
  if(r.baseOverall == null) return '<span class="slide-bonus-note">還沒有評分，有評分後才計入</span>';
  return '<span class="slide-bonus-note">（原 '+r.baseOverall.toFixed(2)+(r.bonus>0 ? ' ＋'+r.bonus : '')+(r.returned ? ' －0.1 退回' : '')+(r.baseOverall + (r.bonus||0) > 5 ? '，最高 5 分' : '')+'）</span>';
}
/**
 * 老師在播放中直接幫目前這件作品加分。先在畫面上更新（馬上看到新分數），再送到伺服器存起來；
 * 存失敗就改回原本的分數並提醒。加分會改變總平均的排序，所以更新後要把播放位置跟著這件作品移到新的名次，
 * 不然下一眼會變成看到別件作品。
 */
function overallWithAdjustments(row){
  if(row.baseOverall == null) return row.overall;
  var o = row.bonus > 0 ? Math.min(5, row.baseOverall + row.bonus) : row.baseOverall;
  if(row.returned) o = Math.max(0, Math.round((o - 0.1) * 1e6) / 1e6);
  return o;
}
/** 在畫面上先更新某件作品的加分／退回狀態（教師作品牆和教師總表的資料都同步改），並讓播放位置跟著這件作品走。 */
function applyWorkLocal(workCode, patch){
  [galleryData && galleryData.rows, teacherView && teacherView.rows].forEach(function(list){
    (list||[]).forEach(function(row){
      if(row.workCode !== workCode) return;
      for(var k in patch) row[k] = patch[k];
      row.overall = overallWithAdjustments(row);
    });
  });
  var rows = sortedGalleryRows();
  for(var i = 0; i < rows.length; i++) if(rows[i].workCode === workCode){ slideshowIndex = i; break; }
  if(slideshowIndex != null) renderSlideshowOnly();
}
function applyBonusLocal(workCode, bonus){ applyWorkLocal(workCode, { bonus: bonus }); }
/**
 * 退回（或撤銷退回）目前這件作品：退回要輸入原因，總平均扣 0.1 分，原因和時間由伺服器記在試算表「退回紀錄」分頁。
 */
/**
 * 老師覺得這件作品被評的分數不合理：把「評分和其他人差距過大」或「全部評分者」登記到試算表的「評分異常紀錄」分頁，
 * 被登記的同學之後的評分畫面會看到「請認真評分」的提醒。先列出名單讓老師確認，確認後才真的登記。
 */
function handleSlideFlag(){
  if(!teacherGalleryActive || slideshowIndex == null) return;
  var rows = sortedGalleryRows();
  if(!rows.length) return;
  var r = rows[((slideshowIndex % rows.length) + rows.length) % rows.length];
  var pass = teacherAuthPasscode();
  if(!pass){ alert('教師密語已失效，請先關閉播放、重新登入教師模式再操作。'); return; }
  var who = (r.studentSeat ? r.studentSeat+'號 ' : '') + (r.studentName || r.workCode);
  var ans = prompt('「'+who+'」這件作品收到 '+(r.count||0)+' 份評分。\n\n評分不合理的同學要怎麼登記？\n1＝登記「評分和其他人差距過大」的同學\n2＝登記「這件作品全部的評分同學」\n3＝撤銷這件作品的異常登記\n\n請輸入 1、2 或 3：', '1');
  if(ans === null) return;
  var mode = { '1':'outliers', '2':'all', '3':'clear' }[String(ans).trim()];
  if(!mode){ alert('請輸入 1、2 或 3。'); return; }
  var gap = 1.5;
  if(mode === 'outliers'){
    var g = prompt('某位同學給這件作品的平均分，和其他同學給的平均分相差幾分以上就登記？\n（5 分制，建議 1.5；越小越嚴格）', '1.5');
    if(g === null) return;

  }
  if(slideshowPlaying){ slideshowPlaying = false; stopSlideTimer(); }
  var base = { passcode: pass, workCode: r.workCode, mode: mode, gap: gap };
  function line(c){
    return (c.seat ? c.seat+'號 ' : '') + c.name + (c.mean != null ? '（他給 '+c.mean.toFixed(2)+'，其他人 '+(c.othersMean==null?'—':c.othersMean.toFixed(2))+'，差 '+(c.gap==null?'—':(c.gap>0?'+':'')+c.gap.toFixed(2))+'）' : '');
  }
  function failText(res){
    if(res && res.error === 'too_few') return '這件作品只有 '+res.count+' 份評分，少於 3 份沒辦法比較差距。要登記的話可以改選 2（全部評分同學）。';
    if(res && res.error === 'unauthorized') return '教師密語不對。';
    return '伺服器沒有處理成功（請確認 Code.gs 已經重新部署最新版）。';
  }
  apiGet('teacherFlagReviews', Object.assign({ dryRun: true }, base)).then(function(res){
    if(!res || !res.ok){ alert(failText(res)); return; }
    var cs = res.candidates || [];
    if(!cs.length){ alert(mode === 'clear' ? '這件作品目前沒有異常登記。' : '沒有同學的差距達到 '+gap+' 分（這件作品共 '+res.reviewerCount+' 份評分）。'); return; }
    var fresh = cs.filter(function(c){ return !c.already; });
    if(mode !== 'clear' && !fresh.length){ alert('這些同學在這件作品都已經登記過了：\n\n' + cs.map(line).join('\n')); return; }
    var head = mode === 'clear' ? '要撤銷以下 '+cs.length+' 位同學在這件作品的異常登記嗎？' : '要登記以下 '+fresh.length+' 位同學嗎？\n（會寫進試算表「評分異常紀錄」，並在他們的評分畫面顯示提醒）';
    if(!confirm(head + '\n\n' + (mode === 'clear' ? cs : fresh).map(line).join('\n'))) return;
    return apiGet('teacherFlagReviews', base).then(function(done){
      if(!done || !done.ok){ alert(failText(done)); return; }
      alert(mode === 'clear' ? '已撤銷 '+done.cleared+' 位同學的登記。' : '已登記 '+done.added+' 位同學。可以到試算表的「評分異常紀錄」分頁查看。');
      delete workReviewsCache[r.workCode]; if(slideshowIndex != null && slideReviewsOpen) updateReviewsPanelDom();
    });
  }).catch(function(e){ alert('操作沒有成功：' + e.message); });
}
function handleSlideReturn(mode){
  if(!teacherGalleryActive || slideshowIndex == null) return;
  var rows = sortedGalleryRows();
  if(!rows.length) return;
  var r = rows[((slideshowIndex % rows.length) + rows.length) % rows.length];
  var pass = teacherAuthPasscode();

  var undo = mode === 'undo';
  var prev = r.returned || null;
  var who = (r.studentSeat ? r.studentSeat+'號 ' : '') + (r.studentName || r.workCode);
  var reason = '';
  if(undo){
    var undoInput = prompt('撤銷「'+who+'」這件作品的退回。\n扣的 0.1 分會還原，作品也會重新出現在作品牆。\n原因和日期會記錄在試算表。\n\n請輸入撤銷的原因：', '');
    if(undoInput === null) return;

  } else {
    var input = prompt('退回「'+who+'」的作品。\n總平均會扣 0.1 分，原因和時間會記錄在試算表的「退回紀錄」分頁。\n\n請輸入退回原因：', prev ? prev.reason : '上傳的不是自己的作業');
    if(input === null) return;
    reason = input.trim();

  }

  if(slideshowPlaying){ slideshowPlaying = false; stopSlideTimer(); }
  applyWorkLocal(code, { returned: undo ? null : { reason: reason, at: Date.now() } });
  apiGet('teacherReturnWork', { passcode: pass, workCode: code, reason: reason, undo: undo }).then(function(res){
    if(!res || !res.ok) throw new Error(res && res.error === 'unauthorized' ? '教師密語不對' : (res && res.error === 'reason_required' ? '沒有填原因' : '伺服器沒有存成功（請確認 Code.gs 已經重新部署最新版）'));
  }).catch(function(e){
    applyWorkLocal(code, { returned: prev });
    alert((undo ? '撤銷退回' : '退回')+'沒有存成功，已改回原本的狀態：' + e.message);

function handleSlideBonus(n){

function slideAssignmentOptions(){

      segments.push({ seat:p.seat, name:p.name, start:cursor, duration:0, waived:true });
    } else {
      var dur = remainingActiveCount>0 ? remainingBudget/remainingActiveCount : 0;
      segments.push({ seat:p.seat, name:p.name, start:cursor, duration:dur, waived:false });
      cursor += dur;
      remainingBudget -= dur;
      remainingActiveCount--;
    }
  });
  return { segments:segments, totalMs:cursor };
}
/**
 * 所有組別同時開始、同時結束：總時間以「出席人數最多的那一組」為準（人數 × 每人分鐘），
 * 人數比較少的組，每個人的時間就依比例拉長（總時間不變，平均分給組內每個人）。
 * 例如每人 7 分鐘、最多的組 5 人（共 35 分鐘），3 人的組每人約 11.7 分鐘，兩組一起在第 35 分鐘結束。
 * 回傳這一組實際每人的毫秒數（baseMs 是老師設的每人時間，maxN 是最多的那組人數）。
 */
function equipGroupSlot(eq, group){
  var baseMs = (eq.perPersonMinutes||6)*60000;
  var n = presentOrderFor(group || {}).length;
  var maxN = n;
  (eq.groups||[]).forEach(function(g){ var c = presentOrderFor(g).length; if(c > maxN) maxN = c; });
  return { n:n, maxN:maxN, baseMs:baseMs, perMs: n ? baseMs * maxN / n : baseMs };
}
function equipGroupState(eq, group){
  var order = presentOrderFor(group || {});
  var n = order.length;
  if(!n || !eq.startedAt) return { active:false, order:order };
  var perMs = equipGroupSlot(eq, group).perMs;
  var now = eq.pausedAt ? eq.pausedAt : Date.now();
  var elapsed = Math.max(0, now - eq.startedAt - (eq.pausedTotalMs||0));
  var waivedSeats = (group && group.waivedSeats) || [];
  var built = buildEquipSegments(order, perMs, elapsed, waivedSeats);
  var segments = built.segments, cycleMs = built.totalMs;
  if(elapsed >= cycleMs){
    return {
      active:true, done:true, order:order, segments:segments,
      currentIndex: n-1, progress:1, remainingMs:0,
      paused: !!eq.pausedAt
    };
  }
  var currentIndex = 0;
  for(var i=0;i<segments.length;i++){
    if(elapsed < segments[i].start + segments[i].duration){ currentIndex = i; break; }
    currentIndex = i;
  }
  while(currentIndex < segments.length-1 && segments[currentIndex].waived) currentIndex++;
  var curSeg = segments[currentIndex] || segments[segments.length-1];
  return {
    active:true, done:false,
    order:order,
    segments:segments,
    currentIndex: currentIndex,
    progress: cycleMs>0 ? elapsed/cycleMs : 0,
    remainingMs: Math.max(0, curSeg.start + curSeg.duration - elapsed),
    paused: !!eq.pausedAt
  };
}
/**
 * 時段寬度改成照實際分配到的時間比例畫（不再是每人等寬），放棄的人給一個
 * 固定的小寬度顯示「已放棄」，不然 duration=0 會直接從畫面上完全消失，
 * 老師跟同組同學都需要看得到「這個人放棄了」這件事，而不是無聲無息不見。
 */
/** 「下一位」要跳過已放棄的人往下找，不然畫面會顯示一個 duration=0、根本不會真的用到的人。 */
function nextActiveIndex(state){
  var n = (state.order||[]).length;
  if(!n) return -1;
  if(!state.segments) return (state.currentIndex+1) % n;
  for(var i=1;i<=n;i++){
    var idx = (state.currentIndex+i) % n;
    if(!state.segments[idx].waived) return idx;
  }
  return (state.currentIndex+1) % n;
}
function timelineHtml(state, compact){
  var order = state.order||[];
  if(!order.length) return '';
  var segments = state.segments; // 還沒開始計時（!state.active）時是 null，改用等寬預覽
  // 棄權者的寬度不能用絕對常數，因為 duration 是毫秒（動輒十幾萬），常數會小到幾乎看不見、
  // 塞不下「已放棄」三個字——改用「非棄權時段裡最長那個的四分之一」，維持看得到又不會太搶眼。
  var maxActiveDuration = 1;
  if(segments) segments.forEach(function(s){ if(!s.waived && s.duration>maxActiveDuration) maxActiveDuration = s.duration; });
  var segs = order.map(function(p,i){
    var colorName = colorNameForIndex(i);
    var seg = segments ? segments[i] : null;
    var waived = !!(seg && seg.waived);
    var flexBasis = seg ? (waived ? maxActiveDuration*0.3 : Math.max(seg.duration, 1)) : 1;
    var style = 'flex:'+flexBasis+' 1 0;' + (waived
      ? 'background:var(--surface-2);color:var(--ink-soft);opacity:0.65;'
      : 'background:'+swatchColorFor(colorName)+';color:'+swatchTextFor(colorName)+';');
    return '<div class="rotation-segment'+(state.active && i===state.currentIndex && !waived?' rotation-seg-active':'')+'" style="'+style+'">' +
      '<span class="rotation-seat">'+escapeHtml(stripLeadingZero(p.seat))+'號</span>' +
      '<span class="rotation-name">'+(waived?'已放棄':escapeHtml(p.name))+'</span>' +
    '</div>';
  }).join('');
  var playhead = state.active ? '<div class="rotation-playhead" style="left:'+(state.progress*100)+'%"></div>' : '';
  return '<div class="rotation-track'+(compact?' rotation-track-compact':'')+'">'+segs+playhead+'</div>';
}
/** 隨時貼在畫面最上方的迷你進度條，讓每個人不用特地切到「器材輪值」分頁就能看到現在輪到誰。 */
function equipMiniBarHtml(){
  if(!equipmentData || !hasIdentity()) return '';

  var current = (state.active && !state.done) ? state.order[state.currentIndex] : null;
  var label = state.done ? '本輪已全部使用完畢'
    : state.active
      ? (escapeHtml(current.seat)+'號 '+escapeHtml(current.name)+' 使用中　'+fmtTime(state.remainingMs)+(state.paused?'　（已暫停）':''))
      : '尚未開始計時';
  return (
    '<div class="equip-mini">' +
      '<div class="equip-mini-label">'+escapeHtml(group.name)+'：'+label+'</div>' +
      timelineHtml(state, true) +
    '</div>'
  );
}

}
function saveSimEquip(s){ try{ localStorage.setItem(sk('crit.simEquip'), JSON.stringify(s)); }catch(e){} }
function blankEquipStatus(){ return { reported:false, reportedBySeat:'', reportedByName:'', reportedAt:null, confirmed:false }; }

  { seat:'91', name:'模擬同學甲' }, { seat:'92', name:'模擬同學乙' },
  { seat:'93', name:'模擬同學丙' }, { seat:'94', name:'模擬同學丁' }
];
function simGroupFor(eq){
  var sim = getSimEquip();
  var n = (eq && eq.itemTypes ? eq.itemTypes.length : 0);
  var statuses = [];
  for(var i=0;i<n;i++) statuses.push((sim.statuses||[])[i] || blankEquipStatus());
  var members = [ { seat:TEST_SEAT, name:TEST_NAME, present:true } ].concat(SIM_MATES.map(function(m){ return { seat:m.seat, name:m.name, present:true }; }));
  // 輪值順序第一次用到時隨機排好、存起來，之後重新整理都一樣（跟真的分組「排一次就固定」一樣）；按「重設模擬」會重新隨機排
  if(!sim.order || sim.order.length !== members.length){
    var seats = members.map(function(m){ return m.seat; });
    for(var k = seats.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var tmp = seats[k]; seats[k] = seats[j]; seats[j] = tmp; }
    sim.order = seats;
    saveSimEquip(sim);
  }
  var bySeat = {}; members.forEach(function(m){ bySeat[m.seat] = m; });
  var order = sim.order.map(function(s){ return { seat:s, name:bySeat[s].name }; });
  return {

    members: members, order: order,
    leader: order[0].seat, equipmentStatus: statuses,

function findMyGroup(eq){
  if(isTestSeat(getMySeat())) return simGroupFor(eq);

    for(var j=0;j<g.members.length;j++){
      if(normSeat(g.members[j].seat)===mySeatNorm) return g;
    }
  }

}

    var statuses = g.equipmentStatus || [];

        return '<label class="toggle-row equip-confirm-row equip-confirm-pending">' +
